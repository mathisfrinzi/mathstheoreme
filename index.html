r 2 et par 3","notes":""},{"id":"CQG2","label":"Groupes contenant un élément d'ordre p","family":"groupes finis","domain":"théorie des groupes","property":"\\{\\, G \\text{ fini} \\mid \\exists x, \\ x^p = e, \\ x \\neq e \\,\\}","description":"Les groupes finis qui contiennent un élément d'ordre p exactement.","example":"S₃ : une transposition, un 3-cycle","notes":""},{"id":"CAU1","label":"Suites de Cauchy d'un espace complet","family":"suites","domain":"topologie","property":"\\{\\, (x_n) \\mid \\forall \\varepsilon, \\ \\exists N, \\ p, q \\ge N \\Rightarrow d(x_p, x_q) \\le \\varepsilon \\,\\}","description":"Les suites de Cauchy d'un espace métrique complet.","example":"les sommes partielles d’une série absolument convergente","notes":""},{"id":"CAU2","label":"Suites convergentes de l'espace","family":"suites","domain":"topologie","property":"\\{\\, (x_n) \\mid \\exists x, \\ d(x_n, x) \\to 0 \\,\\}","description":"Les suites convergentes de l'espace.","example":"xₙ = 1/n dans ℝ","notes":""},{"id":"CQP1","label":"Paires de polyèdres à faces congruentes","family":"polyèdres","domain":"géométrie euclidienne","property":"\\{\\, (P, Q) \\text{ polyèdres convexes} \\mid \\text{faces correspondantes congruentes} \\,\\}","description":"Les paires de polyèdres convexes dont les faces correspondantes sont congruentes.","example":"deux copies du même tétraèdre régulier","notes":""},{"id":"CQP2","label":"Paires de polyèdres congruents","family":"polyèdres","domain":"géométrie euclidienne","property":"\\{\\, (P, Q) \\mid P \\cong Q \\,\\}","description":"Les paires de polyèdres convexes reliés par une isométrie de l'espace.","example":"le tétraèdre régulier et son image par une rotation","notes":""},{"id":"CLP1","label":"Problèmes de Cauchy à second membre localement lipschitzien","family":"équations différentielles","domain":"analyse des équations différentielles","property":"\\{\\, (f, y_0) \\mid \\forall K, \\ \\exists L_K, \\ |f(t, y) - f(t, z)| \\le L_K |y - z| \\text{ sur } K \\,\\}","description":"Les problèmes de Cauchy y' = f(t, y), y(t₀) = y₀, avec f localement lipschitzienne en y.","example":"y’ = y², y(0) = 1 : localement lipschitzienne","notes":""},{"id":"CLP2","label":"Problèmes de Cauchy à solution unique maximale","family":"équations différentielles","domain":"analyse des équations différentielles","property":"\\{\\, (f, y_0) \\mid \\text{une unique solution maximale existe} \\,\\}","description":"Les problèmes de Cauchy qui admettent une solution et une seule, prolongée au maximum.","example":"y’ = y, y(0) = 1 : la seule solution est exp","notes":""},{"id":"PE1","label":"Problèmes de Cauchy à second membre continu","family":"équations différentielles","domain":"analyse des équations différentielles","property":"\\{\\, (f, y_0) \\mid f \\text{ continue} \\,\\}","description":"Les problèmes de Cauchy y' = f(t, y), y(t₀) = y₀, avec f seulement continue.","example":"y’ = √y, y(0) = 0","notes":""},{"id":"PE2","label":"Problèmes de Cauchy résolubles","family":"équations différentielles","domain":"analyse des équations différentielles","property":"\\{\\, (f, y_0) \\mid \\exists \\text{ une solution locale} \\,\\}","description":"Les problèmes de Cauchy qui admettent au moins une solution locale.","example":"même y’ = √y, y(0) = 0 : au moins la solution nulle","notes":""},{"id":"PEU1","label":"Problèmes de Cauchy à au plus une solution","family":"équations différentielles","domain":"analyse des équations différentielles","property":"\\{\\, (f, y_0) \\mid \\text{au plus une solution locale} \\,\\}","description":"Les problèmes de Cauchy qui n'admettent pas deux solutions distinctes.","example":"y’ = y, y(0) = 1","notes":""},{"id":"RCQ1","label":"Séries décroissantes à condensée convergente","family":"séries","domain":"analyse de séries","property":"\\{\\, (a_n) \\downarrow, \\ a_n > 0 : \\sum 2^k a_{2^k} \\text{ converge} \\,\\}","description":"Les séries à termes positifs décroissants dont la série condensée de Cauchy converge.","example":"1/n^1,1 : la condensée est géométrique, convergente","notes":""},{"id":"RCQ3","label":"Séries décroissantes à condensée divergente","family":"séries","domain":"analyse de séries","property":"\\{\\, (a_n) \\downarrow, \\ a_n > 0 : \\sum 2^k a_{2^k} \\text{ diverge} \\,\\}","description":"Les séries à termes positifs décroissants dont la série condensée diverge.","example":"1/(n log n) : la condensée diverge comme la série harmonique","notes":""},{"id":"DCV1","label":"Disques de convergence des séries entières","family":"séries entières","domain":"analyse complexe","property":"\\{\\, (\\sum a_n z^n, D) \\mid D \\text{ le plus grand disque ouvert de convergence} \\,\\}","description":"Les disques de convergence ouverts des séries entières.","example":"Σ z^n/n : le disque unité","notes":""},{"id":"DCV2","label":"Disques hadamardiens","family":"séries entières","domain":"analyse complexe","property":"\\{\\, (\\sum a_n z^n, D) \\mid D = \\{|z| < R\\}, \\ R = \\left( \\limsup \\sqrt[n]{|a_n|} \\right)^{-1} \\,\\}","description":"Les disques de rayon donné par la formule de Cauchy-Hadamard.","example":"Σ 2^n z^n : R = 1/2, la formule le donne directement","notes":""},{"id":"CR1","label":"Fonctions vérifiant les équations de Cauchy–Riemann","family":"holomorphie","domain":"analyse complexe","property":"\\{\\, f = u + iv : \\partial_x u = \\partial_y v, \\ \\partial_y u = -\\partial_x v \\,\\}","description":"Les fonctions f = u + iv de classe C¹ dont u et v satisfont les équations de Cauchy-Riemann.","example":"x² − y² + 2ixy, c’est-à-dire f(z) = z²","notes":""}],"edges":[{"from":"C","to":"IVP","kind":"inclusion","theorem":"Théorème des valeurs intermédiaires","statement":"Si \\( f \\) est continue sur \\( [a, b] \\), son image contient tout l'intervalle \\( [f(a), f(b)] \\) : pour toute valeur \\( c \\) comprise entre \\( f(a) \\) et \\( f(b) \\), il existe \\( x \\in [a, b] \\) tel que \\( f(x) = c \\).","depth":"fondamental","strict":true,"strictnessExample":"x ↦ sin(1/x) (f(0) = 0) prend toutes les valeurs intermédiaires sans être continue en 0.","id":"e1","domain":"analyse réelle","mathlib":"https://leanprover-community.github.io/mathlib4_docs/Mathlib/Topology/Order/IntermediateValue.html"},{"from":"C","to":"F","kind":"inclusion","theorem":"Définition","statement":"Une fonction réelle continue est en particulier une fonction de ℝ dans ℝ.","depth":"définitoire","id":"e2","domain":"analyse réelle"},{"from":"C","to":"FC","kind":"inclusion","theorem":"Définition","statement":"Une fonction continue de \\( \\mathbb{R} \\) dans \\( \\mathbb{R} \\) est continue entre espaces vectoriels normés : \\( \\mathbb{R} \\) en est un.","depth":"définitoire","id":"e3","domain":"analyse réelle"},{"from":"D","to":"C","kind":"inclusion","theorem":"Une fonction dérivable est continue","statement":"Si \\( f \\) est dérivable en \\( a \\), l'existence de \\( f'(a) = \\lim_{x \\to a} \\frac{f(x) - f(a)}{x - a} \\) impose \\( \\lim_{x \\to a} f(x) = f(a) \\).","depth":"classique","strict":true,"strictnessExample":"x ↦ |x| est continue sans être dérivable en 0.","id":"e4","domain":"analyse réelle","mathlib":"https://leanprover-community.github.io/mathlib4_docs/Mathlib/Analysis/Calculus/FDeriv/Basic.html"},{"from":"C1","to":"D","kind":"inclusion","theorem":"Définition de C¹","statement":"Une fonction de classe C¹ est dérivable, de dérivée continue.","depth":"définitoire","id":"e5","domain":"analyse réelle"},{"from":"AFF","to":"P","kind":"inclusion","theorem":"Définition","statement":"Une fonction affine x ↦ ax + b est un polynôme de degré au plus 1.","depth":"définitoire","id":"e8","domain":"analyse réelle"},{"from":"AFF","to":"L","kind":"inclusion","theorem":"Définition","statement":"Pour \\( f(x) = ax + b \\) : \\( |f(x) - f(y)| = |a|\\,|x - y| \\), lipschitzienne de constante \\( |a| \\).","depth":"définitoire","id":"e9","domain":"analyse réelle"},{"from":"DBR","to":"D","kind":"inclusion","theorem":"Définition","statement":"Une fonction à dérivée bornée est en particulier dérivable.","depth":"définitoire","id":"e10","domain":"analyse réelle"},{"from":"DBR","to":"L","kind":"inclusion","theorem":"Théorème des accroissements finis (TAF)","statement":"Si \\( f \\) est dérivable et \\( |f'| \\le k \\), alors pour tous \\( x, y \\) le TAF fournit \\( c \\) entre \\( x \\) et \\( y \\) tel que \\( |f(x) - f(y)| = |f'(c)|\\,|x - y| \\le k\\,|x - y| \\).","depth":"fondamental","strict":true,"strictnessExample":"x ↦ |x| est lipschitzienne sans être dérivable en 0.","id":"e11","domain":"analyse réelle","mathlib":"https://leanprover-community.github.io/mathlib4_docs/Mathlib/Analysis/Calculus/MeanValue.html"},{"from":"L","to":"UC","kind":"inclusion","theorem":"Module uniforme","statement":"Pour un k-lipschitzien, \\( \\delta = \\varepsilon / k \\) convient en tout point : le contrôle est déjà uniforme.","depth":"immédiat","id":"e12","domain":"analyse réelle"},{"from":"UC","to":"C","kind":"inclusion","theorem":"Définition","statement":"L'uniforme continuité sur ℝ implique la continuité en tout point.","depth":"immédiat","id":"e13","domain":"analyse réelle"},{"from":"C","to":"RSEG","kind":"inclusion","theorem":"Continues ⇒ intégrables","statement":"Sur chaque segment, une fonction continue y est bornée et Riemann-intégrable : l'uniforme continuité sur le compact contrôle l'oscillation des sommes de Riemann.","depth":"classique","id":"e14","domain":"analyse réelle"},{"from":"M","to":"RSEG","kind":"inclusion","theorem":"Monotone ⇒ intégrable (Riemann)","statement":"Une fonction monotone est Riemann-intégrable sur chaque segment : le critère de Darboux est vérifié, la variation totale contrôle l'oscillation sur une subdivision.","depth":"classique","id":"e15","domain":"analyse réelle"},{"from":"PC","to":"RSEG","kind":"inclusion","theorem":"Par morceaux ⇒ intégrable","statement":"Sur chaque segment, on découpe au niveau des discontinuités et on intègre morceau par morceau.","depth":"classique","id":"e16","domain":"analyse réelle"},{"from":"M","to":"CARDE","kind":"inclusion","theorem":"Discontinuités d'une fonction monotone","statement":"Les discontinuités d'une fonction monotone sont des sauts deux à deux disjoints ; chacun contient un rationnel distinct : il y en a au plus une infinité dénombrable.","depth":"classique","id":"e17","domain":"analyse réelle"},{"from":"PC","to":"CARDE","kind":"inclusion","theorem":"Définition","statement":"Un nombre fini de discontinuités par segment, et dénombrablement de segments : au plus dénombrable en tout.","depth":"immédiat","id":"e18","domain":"analyse réelle"},{"from":"CNV","to":"C","kind":"inclusion","theorem":"Convexe ⇒ continue","statement":"Sur tout intervalle ouvert, une fonction convexe est coincée entre deux de ses cordes affines : l'oscillation sur un sous-intervalle est bornée, d'où la continuité.","depth":"classique","notes":"Mieux : localement lipschitzienne. L'analogue est faux en dimension infinie.","id":"e19","domain":"analyse réelle"},{"from":"CNV","to":"DEC","kind":"inclusion","theorem":"Dérivée d'une fonction convexe","statement":"Une fonction convexe admet des dérivées latérales croissantes, égales sauf en au plus un ensemble dénombrable de points (les « angles » de la courbe).","depth":"classique","id":"e20","domain":"analyse réelle"},{"from":"DER","to":"IVP","kind":"inclusion","theorem":"Théorème de Darboux","statement":"Une dérivée, même discontinue, satisfait la propriété des valeurs intermédiaires : si \\( g = f' \\), alors \\( g \\) prend toute valeur comprise entre deux de ses valeurs.","depth":"profond","notes":"Une dérivée ne peut donc jamais sauter : sa discontinuité est obligatoirement oscillante.","id":"e21","domain":"analyse réelle"},{"from":"MB","to":"LIM","kind":"inclusion","theorem":"Théorème de la limite monotone","statement":"Une fonction croissante majorée converge vers sa borne supérieure : \\( \\lim_{x \\to +\\infty} f(x) = \\sup f \\). Une fonction monotone bornée admet donc des limites finies aux deux infinis.","depth":"fondamental","strict":true,"strictnessExample":"x ↦ sin(x)/(1 + x²) tend vers 0 aux deux infinis sans être monotone.","id":"e22","domain":"analyse réelle"},{"from":"MB","to":"M","kind":"inclusion","theorem":"Définition","statement":"Un ensemble-construit est inclus dans ses composants.","depth":"définitoire","id":"e23","domain":"analyse réelle"},{"from":"MB","to":"B","kind":"inclusion","theorem":"Définition","statement":"Un ensemble-construit est inclus dans ses composants.","depth":"définitoire","id":"e24","domain":"analyse réelle"},{"from":"C","to":"M","kind":"anti","theorem":"Une continue non monotone","statement":"La continuité n'implique pas la monotonie.","depth":"facile","counterexample":"x ↦ sin(x) : continue et oscillante.","id":"e25","domain":"analyse réelle"},{"from":"C","to":"L","kind":"anti","theorem":"Une continue non lipschitzienne","statement":"La continuité n'implique pas la condition de Lipschitz.","depth":"classique","counterexample":"x ↦ √|x| : continue, mais (f(h) − f(0))/h = 1/√h → +∞ : aucune constante de Lipschitz ne fonctionne près de 0.","id":"e26","domain":"analyse réelle"},{"from":"C","to":"UC","kind":"anti","theorem":"Une continue non uniformément continue","statement":"La continuité sur ℝ tout entier n'implique pas l'uniforme continuité.","depth":"classique","counterexample":"x ↦ x² : |x² − y²| = |x + y|·|x − y| devient grand même pour un petit écart fixé quand x et y grandissent.","id":"e27","domain":"analyse réelle"},{"from":"C","to":"B","kind":"anti","theorem":"Une continue non bornée","statement":"La continuité n'implique pas la bornitude sur ℝ.","depth":"facile","counterexample":"x ↦ x : continue et non bornée.","id":"e28","domain":"analyse réelle"},{"from":"L","to":"D","kind":"anti","theorem":"Une lipschitzienne non dérivable","statement":"La condition de Lipschitz n'implique pas la dérivabilité.","depth":"facile","counterexample":"x ↦ |x| : 1-lipschitzienne, non dérivable en 0.","id":"e29","domain":"analyse réelle"},{"from":"L","to":"B","kind":"anti","theorem":"Une lipschitzienne non bornée","statement":"Lipschitz n'implique pas bornée sur ℝ.","depth":"facile","counterexample":"x ↦ x : 1-lipschitzienne, non bornée.","id":"e30","domain":"analyse réelle"},{"from":"D","to":"L","kind":"anti","theorem":"Une dérivable non lipschitzienne","statement":"La dérivabilité n'implique pas la condition de Lipschitz.","depth":"classique","counterexample":"f(x) = x² sin(1/x²), f(0) = 0 : dérivable partout, de dérivée \\( f'(x) = 2x\\sin(1/x^2) - (2/x)\\cos(1/x^2) \\) non bornée près de 0.","id":"e31","domain":"analyse réelle"},{"from":"D","to":"DBR","kind":"anti","theorem":"Une dérivée qui explose","statement":"La dérivabilité n'implique pas une dérivée bornée.","depth":"classique","counterexample":"Même exemple : x² sin(1/x²), de dérivée non bornée près de 0.","id":"e32","domain":"analyse réelle"},{"from":"M","to":"C","kind":"anti","theorem":"Une monotone discontinue","statement":"La monotonie n'implique pas la continuité.","depth":"facile","counterexample":"L'échelon d'Heaviside x ↦ 1_{x>0} : croissante, discontinue en 0.","id":"e33","domain":"analyse réelle"},{"from":"M","to":"DEC","kind":"anti","theorem":"Fonction de Cantor","statement":"Une fonction monotone, même continue, peut ne pas être dérivable sur un ensemble non dénombrable de points.","depth":"profond","counterexample":"L'escalier du diable (fonction de Cantor–Lebesgue) : croissante, continue, non dérivable sur une partie non dénombrable de l'ensemble de Cantor.","notes":"Lebesgue : monotone ⇒ dérivable sauf sur un ensemble négligeable, mais « négligeable » est plus fin que « au plus dénombrable » : l'ensemble de Cantor en est exactement la frontière.","id":"e34","domain":"analyse réelle"},{"from":"DER","to":"C","kind":"anti","theorem":"Une dérivée discontinue","statement":"Une fonction qui est une dérivée n'est pas nécessairement continue (mais ne peut pas sauter : Darboux).","depth":"profond","counterexample":"g(x) = 2x sin(1/x) − cos(1/x), g(0) = 0 : la dérivée de f(x) = x² sin(1/x), discontinue en 0.","id":"e35","domain":"analyse réelle"},{"from":"IVP","to":"C","kind":"anti","theorem":"Une Darboux non continue","statement":"La propriété des valeurs intermédiaires n'implique pas la continuité.","depth":"classique","counterexample":"x ↦ sin(1/x) avec f(0) = 0 : l'image de tout intervalle contenant 0 est [−1, 1], mais f est discontinue en 0.","id":"e36","domain":"analyse réelle"},{"from":"RSEG","to":"C","kind":"anti","theorem":"Une intégrable discontinue","statement":"L'intégrabilité au sens de Riemann sur chaque segment n'implique pas la continuité.","depth":"facile","counterexample":"L'échelon d'Heaviside est Riemann-intégrable sur chaque segment, discontinue en 0.","id":"e37","domain":"analyse réelle"},{"from":"UC","to":"L","kind":"anti","theorem":"Une uniformément continue non lipschitzienne","statement":"L'uniforme continuité n'implique pas la condition de Lipschitz.","depth":"classique","counterexample":"x ↦ √|x| : uniformément continue, sans constante de Lipschitz possible près de 0.","id":"e38","domain":"analyse réelle"},{"from":"P","to":"AFF","kind":"anti","theorem":"Un polynôme non affine","statement":"Presque tous les polynômes ne sont pas affines.","depth":"définitoire","counterexample":"x ↦ x².","id":"e39","domain":"analyse réelle"},{"from":"B","to":"LIM","kind":"anti","theorem":"Une bornée sans limites","statement":"La bornitude n'implique pas l'existence de limites aux infinis.","depth":"facile","counterexample":"x ↦ sin(x) : bornée, sans limite en +∞.","id":"e40","domain":"analyse réelle"},{"from":"TC","to":"FC","kind":"anti","theorem":"Une continue topologique non réelle","statement":"La continuité topologique n'implique pas d'être une fonction continue entre espaces vectoriels normés.","depth":"facile","counterexample":"L'identité du cercle \\( S^1 \\) : continue entre espaces topologiques, mais \\( S^1 \\) n'est pas un espace vectoriel normé.","domain":"topologie","id":"e42"},{"from":"MAT","to":"F","kind":"anti","theorem":"Une matrice n'est pas une fonction d'une variable réelle","statement":"Une matrice est une fonction réelle de domaine fini \\( \\{1, \\dots, n\\}^2 \\), pas une fonction de \\( \\mathbb{R} \\) dans \\( \\mathbb{R} \\).","depth":"définitoire","counterexample":"La matrice identité \\( I_2 \\) : aucune valeur en \\( x = 3/2 \\).","domain":"théorie des ensembles","id":"e43"},{"from":"A2","to":"A5","kind":"inclusion","theorem":"Premiers sans facteur carré","statement":"Si \\( p \\) est premier, alors \\( p^{2} \\nmid p \\) : un nombre premier n'est divisible par aucun carré.","depth":"immédiat","strict":true,"strictnessExample":"\\( 6 = 2 \\cdot 3 \\) est sans facteur carré sans être premier.","domain":"arithmétique","id":"e44"},{"from":"A3","to":"A5","kind":"anti","theorem":"Un carré n'est pas sans facteur carré","statement":"La propriété d'être un carré parfait n'implique pas d'être sans facteur carré.","depth":"facile","counterexample":"\\( 4 = 2^{2} \\) : carré parfait divisible par \\( 2^{2} \\).","domain":"arithmétique","id":"e45"},{"from":"A4","to":"A2","kind":"anti","theorem":"Un entier pair n'est pas premier","statement":"La parité n'implique pas la primalité.","depth":"facile","counterexample":"\\( 4 = 2 \\cdot 2 \\) : pair, et divisible par \\( 2 \\), qui n'est ni \\( 1 \\) ni \\( 4 \\).","domain":"arithmétique","id":"e46"},{"from":"A2","to":"A4","kind":"anti","theorem":"Un nombre premier n'est pas pair","statement":"La primalité n'implique pas la parité (le seul premier pair est \\( 2 \\)).","depth":"facile","counterexample":"\\( 3 \\) : premier et impair.","domain":"arithmétique","id":"e47"},{"from":"A7","to":"A4","kind":"inclusion","theorem":"Définition","statement":"Un parfait pair est un entier pair : la parité figure dans la définition.","depth":"définitoire","strict":true,"strictnessExample":"\\( 4 \\) est pair mais \\( \\sigma(4) = 7 \\neq 8 \\).","domain":"arithmétique","id":"e48"},{"from":"A8","to":"A6","kind":"inclusion","theorem":"Formes d'Euclide-Euler triangulaires","statement":"Pour \\( p \\) premier et \\( m = 2^{p}-1 \\), on a \\( \\dfrac{m(m+1)}{2} = \\dfrac{(2^{p}-1)\\,2^{p}}{2} = 2^{p-1}(2^{p}-1) \\).","depth":"immédiat","strict":true,"strictnessExample":"\\( 3 = \\dfrac{2 \\cdot 3}{2} \\) est triangulaire, mais \\( 3 \\) n'est pas de la forme \\( 2^{p-1}(2^{p}-1) \\).","domain":"arithmétique","id":"e49"},{"from":"A7","to":"A8","kind":"inclusion","theorem":"Théorème d'Euler sur les parfaits pairs","statement":"Tout nombre parfait pair \\( n \\) s'écrit \\( n = 2^{p-1}(2^{p}-1) \\) avec \\( p \\) premier (Euler montre même que \\( 2^{p}-1 \\) est premier).","depth":"profond","strict":true,"strictnessExample":"\\( 2^{10}(2^{11}-1) = 2^{10} \\cdot 2047 \\) : \\( p = 11 \\) est premier, mais \\( \\sigma(n) = 2047 \\cdot 2160 \\neq 2n \\).","domain":"arithmétique","id":"e50"},{"from":"A8","to":"A7","kind":"anti","theorem":"Une forme d'Euclide-Euler non parfaite","statement":"Une forme \\( 2^{p-1}(2^{p}-1) \\) avec \\( p \\) premier n'est pas nécessairement parfaite.","depth":"classique","counterexample":"\\( p = 11 \\) : \\( n = 2^{10} \\cdot 2047 \\) n'est pas parfait, car \\( \\sigma(n) = 2047 \\cdot 2160 \\neq 2n = 2048 \\cdot 2047 \\).","domain":"arithmétique","id":"e51"},{"from":"A4","to":"A5","kind":"anti","theorem":"Un entier pair n'est pas sans facteur carré","statement":"La parité n'implique pas l'absence de facteur carré.","depth":"facile","counterexample":"\\( 4 = 2^{2} \\).","domain":"arithmétique","id":"e52"},{"from":"A5","to":"A4","kind":"anti","theorem":"Un entier sans facteur carré n'est pas pair","statement":"L'absence de facteur carré n'implique pas la parité.","depth":"facile","counterexample":"\\( 3 \\) : sans facteur carré et impair.","domain":"arithmétique","id":"e53"},{"from":"A9","to":"A5","kind":"anti","theorem":"Un entier impair n'est pas sans facteur carré","statement":"L'imparité n'implique pas l'absence de facteur carré.","depth":"facile","counterexample":"\\( 9 = 3^{2} \\) : impair et divisible par \\( 3^{2} \\).","domain":"arithmétique","id":"e54"},{"from":"A9","to":"A2","kind":"anti","theorem":"Un entier impair n'est pas premier","statement":"L'imparité n'implique pas la primalité.","depth":"facile","counterexample":"\\( 9 = 3 \\cdot 3 \\) : impair, non premier.","domain":"arithmétique","id":"e55"},{"from":"A3","to":"A1","kind":"inclusion","theorem":"Définition","statement":"Un carré parfait d'entier non nul est un entier naturel non nul.","depth":"définitoire","domain":"arithmétique","id":"e56"},{"from":"A4","to":"A1","kind":"inclusion","theorem":"Définition","statement":"Un entier pair non nul est un élément de \\( \\mathbb{N}^{*} \\).","depth":"définitoire","domain":"arithmétique","id":"e57"},{"from":"A5","to":"A1","kind":"inclusion","theorem":"Définition","statement":"Un entier sans facteur carré est, par définition, un élément de \\( \\mathbb{N}^{*} \\).","depth":"définitoire","domain":"arithmétique","id":"e58"},{"from":"A6","to":"A1","kind":"inclusion","theorem":"Définition","statement":"Un nombre triangulaire est un élément de \\( \\mathbb{N}^{*} \\).","depth":"définitoire","domain":"arithmétique","id":"e59"},{"from":"A9","to":"A1","kind":"inclusion","theorem":"Définition","statement":"Un entier impair est un élément de \\( \\mathbb{N}^{*} \\).","depth":"définitoire","domain":"arithmétique","id":"e60"},{"from":"A6","to":"A3","kind":"anti","theorem":"Un triangulaire n'est pas un carré","statement":"La propriété d'être triangulaire n'implique pas celle d'être un carré.","depth":"facile","counterexample":"\\( 3 = \\dfrac{2 \\cdot 3}{2} \\) : triangulaire, et non carré (\\( 1 < 3 < 4 \\)).","domain":"arithmétique","id":"e61"},{"from":"L7","to":"L6","kind":"inclusion","theorem":"Hermitiennes normales","statement":"Si \\( M^{*} = M \\), alors \\( M M^{*} = M^{2} = M^{*} M \\) : une matrice hermitienne est normale.","depth":"immédiat","strict":true,"strictnessExample":"\\( \\begin{pmatrix} 0 & -1 \\\\ 1 & 0 \\end{pmatrix} \\) est normale, mais \\( M^{*} \\neq M \\).","domain":"algèbre linéaire","id":"e62"},{"from":"L8","to":"L6","kind":"inclusion","theorem":"Unitaires normales","statement":"Si \\( M^{*}M = I_n \\), alors \\( M^{-1} = M^{*} \\) et \\( M M^{*} = I_n = M^{*} M \\) : une matrice unitaire est normale.","depth":"immédiat","strict":true,"strictnessExample":"\\( \\mathrm{diag}(1, 0) \\) est normale, mais \\( M^{*}M \\neq I_2 \\).","domain":"algèbre linéaire","id":"e63"},{"from":"L6","to":"L5","kind":"inclusion","theorem":"Théorème spectral","statement":"Toute matrice complexe normale est diagonalisable (même par une matrice unitaire).","depth":"fondamental","strict":true,"strictnessExample":"\\( \\begin{pmatrix} 1 & 1 \\\\ 0 & 2 \\end{pmatrix} \\) est diagonalisable (valeurs propres \\( 1 \\) et \\( 2 \\)), mais non normale.","domain":"algèbre linéaire","id":"e64"},{"from":"L9","to":"L5","kind":"inclusion","theorem":"Projecteurs diagonalisables","statement":"Si \\( M^{2} = M \\), le polynôme \\( X(X-1) \\), scindé à racines simples, annule \\( M \\) : \\( M \\) est diagonalisable.","depth":"classique","strict":true,"strictnessExample":"\\( \\mathrm{diag}(2, 1) \\) est diagonalisable, mais \\( 2^{2} \\neq 2 \\).","domain":"algèbre linéaire","id":"e65"},{"from":"L10","to":"L5","kind":"inclusion","theorem":"Involutions diagonalisables","statement":"Si \\( M^{2} = I_n \\), le polynôme \\( X^{2}-1 = (X-1)(X+1) \\), scindé à racines simples, annule \\( M \\) : \\( M \\) est diagonalisable.","depth":"classique","strict":true,"strictnessExample":"\\( \\mathrm{diag}(2, 1) \\) est diagonalisable, mais \\( 2^{2} \\neq 1 \\).","domain":"algèbre linéaire","id":"e66"},{"from":"L10","to":"L2","kind":"inclusion","theorem":"Involutions inversibles","statement":"Si \\( M^{2} = I_n \\), alors \\( M \\cdot M = I_n \\) : \\( M \\) est inversible, d'inverse \\( M \\).","depth":"immédiat","strict":true,"strictnessExample":"\\( 3 I_2 \\) est inversible, mais \\( (3I_2)^{2} = 9 I_2 \\neq I_2 \\).","domain":"algèbre linéaire","id":"e67"},{"from":"L4","to":"L3","kind":"inclusion","theorem":"Nilpotentes singulières","statement":"Si \\( M^{k} = 0 \\), alors \\( (\\det M)^{k} = 0 \\) : \\( \\det M = 0 \\), donc \\( M \\) n'est pas inversible.","depth":"immédiat","strict":true,"strictnessExample":"\\( \\mathrm{diag}(1, 0) \\) est singulière, mais non nilpotente.","domain":"algèbre linéaire","id":"e68"},{"from":"L2","to":"L1","kind":"inclusion","theorem":"Définition","statement":"Une matrice inversible est en particulier une matrice carrée complexe.","depth":"définitoire","domain":"algèbre linéaire","id":"e69"},{"from":"L5","to":"L1","kind":"inclusion","theorem":"Définition","statement":"Une matrice diagonalisable est en particulier une matrice carrée complexe.","depth":"définitoire","domain":"algèbre linéaire","id":"e70"},{"from":"L3","to":"L1","kind":"inclusion","theorem":"Définition","statement":"Une matrice singulière est en particulier une matrice carrée complexe.","depth":"définitoire","domain":"algèbre linéaire","id":"e71"},{"from":"L5","to":"L6","kind":"anti","theorem":"Une diagonalisable non normale","statement":"La diagonalisabilité n'implique pas la normalité.","depth":"classique","counterexample":"\\( M = \\begin{pmatrix} 1 & 1 \\\\ 0 & 2 \\end{pmatrix} \\) : \\( M M^{*} = \\begin{pmatrix} 2 & 2 \\\\ 2 & 4 \\end{pmatrix} \\neq \\begin{pmatrix} 1 & 1 \\\\ 1 & 5 \\end{pmatrix} = M^{*} M \\).","domain":"algèbre linéaire","id":"e72"},{"from":"L9","to":"L2","kind":"anti","theorem":"Un projecteur non inversible","statement":"Être idempotente n'implique pas être inversible.","depth":"facile","counterexample":"La matrice nulle \\( 0_n \\) : \\( 0^{2} = 0 \\), et elle n'est pas inversible.","domain":"algèbre linéaire","id":"e73"},{"from":"L10","to":"L8","kind":"anti","theorem":"Une involution non unitaire","statement":"Être involutive n'implique pas être unitaire.","depth":"facile","counterexample":"\\( M = \\begin{pmatrix} 1 & 1 \\\\ 0 & -1 \\end{pmatrix} \\) : \\( M^{2} = I_2 \\), mais \\( M^{*}M = \\begin{pmatrix} 1 & 1 \\\\ 1 & 2 \\end{pmatrix} \\neq I_2 \\).","domain":"algèbre linéaire","id":"e74"},{"from":"L8","to":"L7","kind":"anti","theorem":"Une unitaire non hermitienne","statement":"Être unitaire n'implique pas être hermitienne.","depth":"facile","counterexample":"\\( \\mathrm{diag}(i, 1) \\) : unitaire, mais \\( M^{*} = \\mathrm{diag}(-i, 1) \\neq M \\).","domain":"algèbre linéaire","id":"e75"},{"from":"L4","to":"L5","kind":"anti","theorem":"Une nilpotente non diagonalisable","statement":"Être nilpotente n'implique pas être diagonalisable.","depth":"facile","counterexample":"\\( \\begin{pmatrix} 0 & 1 \\\\ 0 & 0 \\end{pmatrix} \\) : \\( M^{2} = 0 \\), seule valeur propre \\( 0 \\), et \\( M \\neq 0 \\).","domain":"algèbre linéaire","id":"e76"},{"from":"L5","to":"L4","kind":"anti","theorem":"Une diagonalisable non nilpotente","statement":"Être diagonalisable n'implique pas être nilpotente.","depth":"facile","counterexample":"\\( I_2 \\) : diagonale, et \\( I_2^{k} = I_2 \\neq 0 \\) pour tout \\( k \\).","domain":"algèbre linéaire","id":"e77"},{"from":"L6","to":"L8","kind":"anti","theorem":"Une normale non unitaire","statement":"Être normale n'implique pas être unitaire.","depth":"facile","counterexample":"\\( \\mathrm{diag}(1, 0) \\) : normale, mais \\( M^{*}M = M \\neq I_2 \\).","domain":"algèbre linéaire","id":"e78"},{"from":"D2","to":"D1","kind":"inclusion","theorem":"Définition","statement":"Une fonction de classe \\( C^{\\infty} \\) est en particulier de classe \\( C^{2} \\).","depth":"définitoire","strict":true,"strictnessExample":"\\( x \\mapsto |x|^{3} \\) est de classe \\( C^{2} \\), mais \\( f''' \\) n'existe pas en \\( 0 \\).","domain":"analyse réelle","id":"e79"},{"from":"D1","to":"C1","kind":"inclusion","theorem":"Définition","statement":"Si \\( f'' \\) est continue, alors \\( f' \\) est dérivable, donc continue : \\( f \\) est de classe \\( C^{1} \\).","depth":"définitoire","strict":true,"strictnessExample":"\\( x \\mapsto x|x| \\) : \\( f' = 2|x| \\) est continue, mais \\( f'' \\) n'existe pas en \\( 0 \\).","domain":"analyse réelle","id":"e80"},{"from":"D3","to":"D2","kind":"inclusion","theorem":"Analytiques réelles sont C^∞","statement":"Une fonction analytique réelle admet des dérivées de tout ordre : elle est de classe \\( C^{\\infty} \\).","depth":"classique","strict":true,"strictnessExample":"\\( f(x) = e^{-1/x^{2}} \\) pour \\( x \\neq 0 \\), \\( f(0) = 0 \\) : de classe \\( C^{\\infty} \\), mais non analytique en \\( 0 \\).","domain":"analyse réelle","id":"e81"},{"from":"P","to":"D3","kind":"inclusion","theorem":"Polynômes analytiques","statement":"Un polynôme est une série entière à nombre fini de termes, convergente sur \\( \\mathbb{R} \\) et égale à sa somme.","depth":"immédiat","strict":true,"strictnessExample":"\\( x \\mapsto e^{x} \\) est analytique réelle, mais non polynomiale.","domain":"analyse réelle","id":"e82"},{"from":"D4","to":"CNV","kind":"inclusion","theorem":"Définition","statement":"Une fonction convexe et dérivable est, en particulier, convexe.","depth":"définitoire","domain":"analyse réelle","id":"e83"},{"from":"D5","to":"D6","kind":"inclusion","theorem":"Dérivée positive ⇒ strictement croissante","statement":"Si \\( f \\) est dérivable et \\( f' > 0 \\) sur \\( \\mathbb{R} \\), alors \\( f \\) est strictement croissante (théorème des accroissements finis).","depth":"classique","strict":true,"strictnessExample":"\\( x \\mapsto x^{3} \\) est strictement croissante, mais \\( f'(0) = 0 \\).","domain":"analyse réelle","id":"e84"},{"from":"D6","to":"M","kind":"inclusion","theorem":"Définition","statement":"Une fonction strictement croissante est croissante, donc monotone.","depth":"définitoire","strict":true,"strictnessExample":"\\( x \\mapsto 0 \\) est monotone (croissante), mais non strictement croissante.","domain":"analyse réelle","id":"e85"},{"from":"D7","to":"AFF","kind":"inclusion","theorem":"Définition","statement":"Une fonction constante \\( x \\mapsto c \\) s'écrit \\( 0 \\cdot x + c \\) : elle est affine.","depth":"définitoire","strict":true,"strictnessExample":"\\( x \\mapsto x \\) est affine, mais non constante.","domain":"analyse réelle","id":"e86"},{"from":"D9","to":"D3","kind":"inclusion","theorem":"Solutions de y' = y sont analytiques","statement":"Pour \\( C \\in \\mathbb{R} \\), \\( C e^{x} = \\sum_{n \\ge 0} C \\frac{x^{n}}{n!} \\) : c'est une série entière convergente sur \\( \\mathbb{R} \\).","depth":"facile","strict":true,"strictnessExample":"\\( x \\mapsto e^{2x} \\) est analytique, mais ne vérifie pas \\( y' = y \\).","domain":"analyse réelle","id":"e87"},{"from":"D10","to":"B","kind":"inclusion","theorem":"Solutions de y'' + y = 0 sont bornées","statement":"Pour \\( \\alpha, \\beta \\in \\mathbb{R} \\), \\( |\\alpha \\cos x + \\beta \\sin x| \\le \\sqrt{\\alpha^{2}+\\beta^{2}} \\) (Cauchy–Schwarz).","depth":"facile","strict":true,"strictnessExample":"\\( x \\mapsto \\sin(2x) \\) est bornée, mais \\( y'' + y = -3\\sin(2x) \\neq 0 \\).","domain":"analyse réelle","id":"e88"},{"from":"D9","to":"AFF","kind":"anti","theorem":"Une solution de y' = y non affine","statement":"Une solution de \\( y' = y \\) n'est pas nécessairement affine.","depth":"facile","counterexample":"\\( x \\mapsto e^{x} \\) : sa dérivée seconde \\( e^{x} \\) n'est pas nulle.","domain":"analyse réelle","id":"e89"},{"from":"D10","to":"M","kind":"anti","theorem":"Une solution de y'' + y = 0 non monotone","statement":"Une solution de \\( y'' + y = 0 \\) n'est pas nécessairement monotone.","depth":"facile","counterexample":"\\( \\sin \\) : \\( \\sin 0 = 0 < \\sin(\\pi/2) = 1 \\) et \\( \\sin(\\pi/2) = 1 > \\sin \\pi = 0 \\).","domain":"analyse réelle","id":"e90"},{"from":"D9","to":"B","kind":"anti","theorem":"Une solution de y' = y non bornée","statement":"Une solution de \\( y' = y \\) n'est pas nécessairement bornée.","depth":"facile","counterexample":"\\( x \\mapsto e^{x} \\) : tend vers \\( +\\infty \\) en \\( +\\infty \\).","domain":"analyse réelle","id":"e91"},{"from":"D3","to":"P","kind":"anti","theorem":"Une analytique non polynomiale","statement":"Être analytique réelle n'implique pas être polynomiale.","depth":"classique","counterexample":"\\( \\sin \\) : analytique, mais non polynomiale (un polynôme non constant n'est pas borné).","domain":"analyse réelle","id":"e92"},{"from":"CNV","to":"D","kind":"anti","theorem":"Une convexe non dérivable","statement":"Être convexe n'implique pas être dérivable.","depth":"facile","counterexample":"\\( x \\mapsto |x| \\) : convexe, non dérivable en \\( 0 \\).","domain":"analyse réelle","id":"e93"},{"from":"D5","to":"P","kind":"anti","theorem":"Une dérivée positive non polynomiale","statement":"Avoir une dérivée strictement positive n'implique pas être polynomiale.","depth":"facile","counterexample":"\\( x \\mapsto e^{x} \\) : \\( f' = e^{x} > 0 \\), mais \\( f \\) n'est pas polynomiale.","domain":"analyse réelle","id":"e94"},{"from":"X2","to":"X7","kind":"inclusion","theorem":"Holomorphe ⇒ C¹ réel","statement":"Une fonction holomorphe sur \\( \\mathbb{C} \\) est de classe \\( C^{\\infty} \\) comme fonction de deux variables réelles, sa dérivée complexe étant continue.","depth":"fondamental","strict":true,"strictnessExample":"\\( z \\mapsto \\bar z \\) est de classe \\( C^{1} \\) au sens réel, mais non dérivable au sens complexe.","domain":"analyse complexe","id":"e95"},{"from":"X7","to":"X6","kind":"inclusion","theorem":"C¹ réel ⇒ continue","statement":"Une fonction différentiable au sens réel est continue.","depth":"facile","strict":true,"strictnessExample":"\\( z \\mapsto |z| \\) est continue, mais non différentiable en \\( 0 \\).","domain":"analyse complexe","id":"e96"},{"from":"X3","to":"X2","kind":"inclusion","theorem":"Polynômes holomorphes","statement":"Un polynôme complexe est dérivable au sens complexe en tout point de \\( \\mathbb{C} \\).","depth":"immédiat","strict":true,"strictnessExample":"\\( z \\mapsto e^{z} \\) est entière, mais non polynomiale.","domain":"analyse complexe","id":"e97"},{"from":"X4","to":"X3","kind":"inclusion","theorem":"Définition","statement":"Une fonction affine complexe \\( z \\mapsto az+b \\) est un polynôme de degré au plus \\( 1 \\).","depth":"définitoire","strict":true,"strictnessExample":"\\( z \\mapsto z^{2} \\) est polynomiale, mais non affine.","domain":"analyse complexe","id":"e98"},{"from":"X5","to":"X4","kind":"inclusion","theorem":"Définition","statement":"Une fonction constante \\( z \\mapsto c \\) s'écrit \\( 0 \\cdot z + c \\) : elle est affine.","depth":"définitoire","strict":true,"strictnessExample":"\\( z \\mapsto z \\) est affine, mais non constante.","domain":"analyse complexe","id":"e99"},{"from":"X9","to":"X8","kind":"inclusion","theorem":"Définition","statement":"Une fonction entière bornée est en particulier une fonction bornée.","depth":"définitoire","strict":true,"strictnessExample":"\\( z \\mapsto 1/(1+|z|^{2}) \\) est bornée, mais non entière (théorème de Liouville).","domain":"analyse complexe","id":"e100"},{"from":"X9","to":"X5","kind":"inclusion","theorem":"Théorème de Liouville","statement":"Toute fonction entière bornée sur \\( \\mathbb{C} \\) est constante.","depth":"fondamental","domain":"analyse complexe","id":"e101","notes":"L'ensemble des entières bornées est en fait égal à celui des constantes (la réciproque est triviale) : l'inclusion n'est donc pas stricte."},{"from":"X6","to":"X2","kind":"anti","theorem":"Une continue non holomorphe","statement":"La continuité n'implique pas la dérivabilité au sens complexe.","depth":"facile","counterexample":"\\( z \\mapsto \\bar z \\) : le quotient \\( (\\overline{z+h} - \\bar z)/h = \\bar h / h \\) de module \\( 1 \\) n'a pas de limite en \\( 0 \\).","domain":"analyse complexe","id":"e102"},{"from":"X8","to":"X2","kind":"anti","theorem":"Une bornée non entière","statement":"Être bornée n'implique pas être entière.","depth":"classique","counterexample":"\\( z \\mapsto 1/(1+|z|^{2}) \\) : bornée et non constante, donc non entière par Liouville.","domain":"analyse complexe","id":"e103"},{"from":"X2","to":"X3","kind":"anti","theorem":"Une entière non polynomiale","statement":"Être entière n'implique pas être polynomiale.","depth":"facile","counterexample":"\\( z \\mapsto e^{z} \\) : entière, et non polynomiale (elle n'est pas de la forme \\( a_n z^{n} + \\cdots + a_0 \\)).","domain":"analyse complexe","id":"e104"},{"from":"X6","to":"X7","kind":"anti","theorem":"Une continue non C¹ réelle","statement":"La continuité n'implique pas la différentiabilité au sens réel.","depth":"facile","counterexample":"\\( z \\mapsto |z| \\) : continue, non différentiable en \\( 0 \\).","domain":"analyse complexe","id":"e105"},{"from":"X4","to":"X5","kind":"anti","theorem":"Une affine non constante","statement":"Être affine complexe n'implique pas être constante.","depth":"facile","counterexample":"\\( z \\mapsto z \\) : affine, non constante.","domain":"analyse complexe","id":"e106"},{"from":"IQ","to":"FCP","kind":"inclusion","theorem":"Théorème de Lagrange (fractions continues, 1770)","statement":"Le développement en fraction continue d'un irrationnel quadratique est périodique à partir d'un certain rang. La réciproque est vraie (Euler) : fraction continue périodique et irrationnel quadratique décrivent le même ensemble de réels.","depth":"classique","domain":"théorie algébrique des nombres","id":"e108"},{"from":"A1","to":"S4","kind":"inclusion","theorem":"Théorème des quatre carrés (Lagrange, 1770)","statement":"Tout entier naturel non nul est somme de quatre carrés : \\( \\forall n \\in \\mathbb{N}^{*}, \\ \\exists (p, q, r, s) \\in \\mathbb{N}^{4}, \\ n = p^{2} + q^{2} + r^{2} + s^{2} \\).","depth":"fondamental","domain":"arithmétique","id":"e109"},{"from":"LIO","to":"TRS","kind":"inclusion","theorem":"Théorème de Liouville (1844)","statement":"Tout nombre de Liouville est transcendant. Si \\( \\alpha \\) est algébrique de degré \\( d \\ge 2 \\), il existe \\( c > 0 \\) tel que \\( \\left| \\alpha - p/q \\right| \\ge c \\, q^{-d} \\) pour tout rationnel \\( p/q \\), ce qu'un nombre de Liouville contredit. Conséquence : \\( L = \\sum_{k \\ge 1} 10^{-k!} \\) est transcendant.","depth":"fondamental","domain":"arithmétique","id":"e110"},{"from":"TRS","to":"LIO","kind":"anti","theorem":"Transcendant sans être de Liouville","statement":"Être transcendant n'implique pas être un nombre de Liouville.","depth":"classique","counterexample":"\\( e \\) : transcendant (Hermite, 1873) mais qui n'est pas un nombre de Liouville, ses quotients partiels en fraction continue ne croissant que linéairement (Mahler).","domain":"arithmétique","id":"e111"},{"from":"TQ1","to":"TQ2","kind":"inclusion","theorem":"Théorème de Legendre (1785)","statement":"Si \\( a x^{2} + b y^{2} + c z^{2} = 0 \\) (avec \\( a > 0 \\), \\( b, c < 0 \\), coefficients sans facteur carré et premiers entre eux deux à deux) admet une solution non triviale dans \\( \\mathbb{Z}^{3} \\), alors \\( -ab \\) est un résidu quadratique modulo \\( c \\), \\( -bc \\) modulo \\( a \\) et \\( -ca \\) modulo \\( b \\). La réciproque est vraie : le critère est un si et seulement si.","depth":"profond","domain":"théorie algébrique des nombres","id":"e112"},{"from":"LU1","to":"LU2","kind":"inclusion","theorem":"Théorème de Lucas (1878)","statement":"Pour \\( p \\) premier, \\( \\binom{n}{k} \\equiv \\prod_{i} \\binom{n_{i}}{k_{i}} \\ \\text{(mod } p \\text{)} \\), où \\( n_{i}, k_{i} \\) sont les chiffres de \\( n \\) et \\( k \\) en base \\( p \\). Si chaque chiffre de \\( k \\) est inférieur ou égal au chiffre correspondant de \\( n \\), aucun facteur du produit n'est nul et \\( p \\) ne divise pas \\( \\binom{n}{k} \\) (la réciproque est le corollaire de divisibilité).","depth":"classique","domain":"arithmétique","id":"e113"},{"from":"LL1","to":"LL2","kind":"inclusion","theorem":"Test de Lucas–Lehmer, sens direct","statement":"Si \\( M_{p} = 2^{p} - 1 \\) est premier avec \\( p \\ge 3 \\), alors \\( s_{p-2} \\equiv 0 \\ \\text{(mod } M_{p} \\text{)} \\), où \\( s_{0} = 4 \\) et \\( s_{k+1} = s_{k}^{2} - 2 \\). La réciproque fournit le test de primalité de Lucas–Lehmer, utilisé pour les plus grands nombres premiers connus.","depth":"classique","domain":"arithmétique","id":"e114"},{"from":"IN1","to":"IN2","kind":"inclusion","theorem":"Polynômes interpolateurs de Lagrange","statement":"Pour \\( n \\) points distincts \\( x_{1}, \\ldots, x_{n} \\), toute fonction \\( f \\) définie sur ces points coïncide avec un polynôme de degré au plus \\( n - 1 \\), unique pour ce degré. La réciproque est triviale : la restriction d'un polynôme à ces points est une fonction sur ces points.","depth":"classique","domain":"algèbre générale","id":"e115"},{"from":"GR1","to":"GR2","kind":"inclusion","theorem":"Théorème de Lagrange sur les groupes","statement":"Le cardinal d'un sous-groupe d'un groupe fini divise l'ordre du groupe : \\( |H| \\) divise \\( |G| \\).","depth":"classique","domain":"algèbre générale","id":"e116"},{"from":"GR2","to":"GR1","kind":"anti","theorem":"Un cardinal qui divise ne suffit pas","statement":"Une partie du groupe fini G dont le cardinal divise |G| n'est pas forcément un sous-groupe.","depth":"facile","counterexample":"Dans \\( (\\mathbb{Z}/6\\mathbb{Z}, +) \\) : la partie \\( \\{1, 2\\} \\) a deux éléments (2 divise 6), mais \\( 1 + 2 = 3 \\notin \\{1, 2\\} \\).","domain":"algèbre générale","id":"e117"},{"from":"SG1","to":"SG2","kind":"inclusion","theorem":"Théorème de Lie–Kolchin","statement":"Tout sous-groupe résoluble et connexe de \\( GL_{n}(\\mathbb{C}) \\) est simultanément trigonalisable : dans une base bien choisie, tous ses éléments sont triangulaires supérieures.","depth":"classique","domain":"algèbre linéaire","id":"e118"},{"from":"BM1","to":"BM2","kind":"inclusion","theorem":"Théorème de Lax–Milgram","statement":"Sur un espace de Hilbert \\( H \\), pour toute forme bilinéaire \\( a \\) continue et coercive et toute forme linéaire continue \\( \\ell \\), il existe un unique \\( x_{0} \\in H \\) tel que \\( \\ell(y) = a(x_{0}, y) \\) pour tout \\( y \\in H \\). Cas particulier : si \\( a \\) est un produit scalaire, c'est le théorème de Riesz.","depth":"fondamental","domain":"algèbre bilinéaire","id":"e119"},{"from":"KP1","to":"KP2","kind":"inclusion","theorem":"Théorème de Kuratowski (projection fermée)","statement":"Si \\( X \\) est compact, la projection \\( X \\times Y \to Y \\) est une application fermée pour tout espace topologique \\( Y \\). La réciproque est vraie (Mrówka) : ces espaces sont exactement les compacts.","depth":"classique","domain":"topologie","id":"e120"},{"from":"LA1","to":"LA2","kind":"inclusion","theorem":"Théorème de Laurent","statement":"Toute fonction holomorphe sur la couronne \\( \\{ r < |z - z_{0}| < R \\} \\) s'y développe de manière unique en série de Laurent \\( \\sum_{n = -\\infty}^{+\\infty} a_{n} (z - z_{0})^{n} \\). La réciproque est triviale : une telle série définit une fonction holomorphe sur son ouvert de convergence.","depth":"fondamental","domain":"analyse complexe","id":"e121"},{"from":"LR1","to":"LR2","kind":"inclusion","theorem":"Théorème de Laguerre (cas réel)","statement":"Si \\( P \\) est un polynôme unitaire réel de degré \\( n \\) à \\( n \\) racines réelles, toutes ses racines appartiennent au segment \\( [u, v] \\), où \\( u \\) et \\( v \\) sont les racines du trinôme \\( n x^{2} + 2 a_{n-1} x + 2 (n-1) a_{n-2} - (n-2) a_{n-1}^{2} \\).","depth":"classique","domain":"analyse réelle","id":"e122"},{"from":"ZL1","to":"ZL2","kind":"anti","theorem":"Théorème de Laguerre (cas complexe)","statement":"Au moins un zéro du polynôme unitaire \\( f \\), de degré \\( n \\), appartient au disque fermé centré en \\( z_{0} \\) et de rayon \\( n \\left| f(z_{0}) / f'(z_{0}) \\right| \\), dès que \\( f'(z_{0}) \\ne 0 \\) : les zéros ne sont donc pas tous extérieurs à ce disque.","depth":"classique","counterexample":"Pour \\( f = 1 + z + z^{2} \\), \\( z_{0} = 0 \\) : le zéro \\( \\zeta = \\frac{-1 + i \\sqrt{3}}{2} \\) vérifie \\( |\\zeta| = 1 \\le 2 = 2 \\left| f(0)/f'(0) \\right| \\).","domain":"analyse complexe","id":"e123"},{"from":"KOL","to":"DBR","kind":"inclusion","theorem":"Inégalité de Landau–Kolmogorov","statement":"Si \\( f \\) est de classe \\( C^{2} \\) sur \\( \\mathbb{R} \\) avec \\( f \\) et \\( f'' \\) bornées, alors \\( f' \\) est bornée et \\( \\| f' \\|_{\\infty} \\le 2 \\, \\| f \\|_{\\infty}^{1/2} \\| f'' \\|_{\\infty}^{1/2} \\) (Landau, 1913). Kolmogorov a généralisé aux dérivées intermédiaires : \\( \\| f^{(k)} \\|_{\\infty} \\le C(k, n) \\, \\| f \\|_{\\infty}^{1 - k/n} \\| f^{(n)} \\|_{\\infty}^{k/n} \\).","depth":"profond","domain":"analyse réelle","id":"e124"},{"from":"ME1","to":"RSEG","kind":"inclusion","theorem":"Critère de Lebesgue pour l'intégrabilité de Riemann","statement":"Une fonction bornée sur tout segment, dont l'ensemble des points de discontinuité est de mesure nulle, est Riemann-intégrable sur tout segment. La réciproque est vraie : le critère est en fait un si et seulement si.","depth":"fondamental","domain":"théorie de la mesure","id":"e125"},{"from":"ME2","to":"ME3","kind":"inclusion","theorem":"Théorème de Lusin","statement":"Si \\( f : [0, 1] \\to \\mathbb{R} \\) est mesurable et finie, alors pour tout \\( \\varepsilon > 0 \\) il existe un fermé \\( F \\subseteq [0, 1] \\) de mesure plus grande que \\( 1 - \\varepsilon \\) tel que la restriction de \\( f \\) à \\( F \\) soit continue.","depth":"classique","domain":"théorie de la mesure","id":"e126"},{"from":"PR1","to":"PR2","kind":"inclusion","theorem":"Loi forte des grands nombres (Kolmogorov, 1933)","statement":"Si les \\( X_{k} \\) sont indépendantes, de même loi, et \\( \\mathbb{E}|X_{1}| < \\infty \\), les moyennes empiriques convergent presque sûrement : \\( \\bar{X}_{n} \\to \\mathbb{E}(X_{1}) \\) presque sûrement. La clé de la preuve est l'inégalité maximale de Kolmogorov : \\( \\mathbb{P}\\left( \\max_{k \\le n} |S_{k}| \\ge t \\right) \\le \\mathrm{Var}(S_{n}) / t^{2} \\).","depth":"fondamental","domain":"théorie de la mesure","id":"e127"},{"from":"PR1","to":"PR3","kind":"inclusion","theorem":"Loi faible des grands nombres (Khintchine, 1929)","statement":"Sous la seule hypothèse \\( \\mathbb{E}|X_{1}| < \\infty \\) (aucune variance exige), les moyennes empiriques convergent en probabilité vers l'espérance : \\( \\mathbb{P}\\left( \\left| \\bar{X}_{n} - \\mathbb{E}(X_{1}) \\right| > \\varepsilon \\right) \\to 0 \\).","depth":"classique","domain":"théorie de la mesure","id":"e128"},{"from":"PR3","to":"PR2","kind":"anti","theorem":"En probabilité, pas encore presque sûr","statement":"La convergence en probabilité n'implique pas la convergence presque sûre.","depth":"facile","counterexample":"\\( (Y_{n}) \\) indépendantes avec \\( \\mathbb{P}(Y_{n} = 1) = 1/n \\) et \\( \\mathbb{P}(Y_{n} = 0) = 1 - 1/n \\) : \\( Y_{n} \\to 0 \\) en probabilité, mais par Borel–Cantelli \\( Y_{n} = 1 \\) une infinité de fois presque sûrement.","domain":"théorie de la mesure","id":"e129"},{"from":"GTR","to":"GAK","kind":"inclusion","theorem":"Théorème d'Al-Kashi","statement":"Dans tout triangle, le carré d'un côté égale la somme des carrés des deux autres côtés, moins le double produit de ces côtés par le cosinus de l'angle entre eux : \\( a^2 = b^2 + c^2 - 2bc\\cos(\\widehat{A}) \\), où \\( \\widehat{A} \\) est opposé au côté \\( a \\). Le cas \\( \\widehat{A} = 90^\\circ \\) redonne le théorème de Pythagore.","depth":"classique","domain":"géométrie euclidienne","id":"e130"},{"from":"GIA","to":"GIM","kind":"inclusion","theorem":"Théorème de l'angle inscrit","statement":"Dans un cercle, tout angle inscrit interceptant un arc donné mesure la moitié de l'angle au centre qui intercepte le même arc : \\( \\widehat{AMB} = \\tfrac{1}{2}\\, \\widehat{AOB} \\). Deux angles inscrits interceptant le même arc sont donc égaux.","depth":"classique","domain":"géométrie euclidienne","id":"e131"},{"from":"GCA","to":"GCD","kind":"inclusion","theorem":"Théorème de l'angle au centre","statement":"Dans un cercle, la mesure de l'angle au centre est le double de la mesure de tout angle inscrit qui intercepte le même arc : \\( \\widehat{AOB} = 2\\, \\widehat{AMB} \\).","depth":"classique","domain":"géométrie euclidienne","id":"e132"},{"from":"GAR","to":"GAA","kind":"inclusion","theorem":"Théorème de l'arc capable","statement":"Le lieu des points d'où l'on voit un segment \\( [AB] \\) sous un angle \\( \\alpha \\in\\, ]0, \\pi[ \\) est la réunion de deux arcs de cercles passant par \\( A \\) et \\( B \\) : les arcs capables de l'angle \\( \\alpha \\).","depth":"classique","domain":"géométrie euclidienne","id":"e133"},{"from":"GAP","to":"CER","kind":"inclusion","theorem":"Cercles d'Apollonius","statement":"Pour \\( k > 0 \\), \\( k \\neq 1 \\), le lieu des points \\( M \\) vérifiant \\( \\tfrac{MA}{MB} = k \\) est un cercle, dit cercle d'Apollonius : celui de diamètre \\( [I, J] \\), où \\( I \\) et \\( J \\) divisent le segment \\( [AB] \\) au rapport \\( k \\), l'un à l'intérieur, l'autre à l'extérieur.","depth":"classique","domain":"géométrie euclidienne","id":"e134"},{"from":"GME","to":"CER","kind":"anti","theorem":"Le cas k = 1 n'est pas un cercle","statement":"Pour \\( k = 1 \\), le lieu des points vérifiant \\( \\tfrac{MA}{MB} = k \\) n'est pas un cercle : l'hypothèse \\( k \\neq 1 \\) est nécessaire.","depth":"facile","counterexample":"La médiatrice de \\( [AB] \\) : une droite, non bornée, donc pas un cercle.","domain":"géométrie euclidienne","id":"e135"},{"from":"LT1","to":"LT2","kind":"inclusion","theorem":"Lemme d'Arden","statement":"Si \\( A \\) et \\( B \\) sont des langages sur \\( \\Sigma \\) avec \\( \\varepsilon \\notin A \\), l'équation de langage \\( X = X \\cdot A \\cup B \\) admet une unique solution, \\( X = B \\cdot A^* \\) : toute solution est donc de la forme \\( B \\cdot A^* \\).","depth":"classique","domain":"théorie des langages","id":"e136"},{"from":"KF1","to":"KF2","kind":"inclusion","theorem":"Théorème d'Artin–Schreier (1927)","statement":"Si la clôture algébrique \\( \\overline{K} \\) est une extension finie de \\( K \\), alors \\( \\overline{K} = K(i) \\), l'extension est de degré 2 et \\( K \\) est un corps réel clos. La réciproque est vraie : la clôture algébrique d'un corps réel clos est \\( K(i) \\), de degré 2.","depth":"profond","domain":"théorie des corps","id":"e137"},{"from":"KF3","to":"KF4","kind":"inclusion","theorem":"Théorème d'Artin–Schreier (corps formellement réels)","statement":"Un corps est formellement réel — \\( -1 \\) n'y est pas une somme de carrés — si et seulement s'il est ordonnable : il admet un ordre total compatible avec \\( + \\) et \\( \\times \\). On trace le sens « formellement réel ⇒ ordonnable » ; la réciproque est immédiate.","depth":"profond","domain":"théorie des corps","id":"e138"},{"from":"MT1","to":"MT2","kind":"inclusion","theorem":"Lemme de Baire","statement":"Tout espace métrique complet est un espace de Baire : toute intersection dénombrable d'ouverts denses y est dense. Un tel espace n'est donc pas une réunion dénombrable de fermés d'intérieur vide (les espaces localement compacts sont aussi de Baire).","depth":"fondamental","domain":"topologie","id":"e139"},{"from":"MA1","to":"MA2","kind":"inclusion","theorem":"Théorème d'Ascoli","statement":"Sur \\( \\mathcal{C}(K, \\mathbb{R}) \\), \\( K \\) compact métrique, toute partie compacte pour la norme uniforme est équicontinue (et bornée en chaque point). Le théorème d'Arzelà–Ascoli donne la caractérisation réciproque, à tracer par Mathis : compacte ⟺ fermée, équicontinue et bornée en chaque point.","depth":"profond","domain":"topologie métrique","id":"e140"},{"from":"MV1","to":"MV2","kind":"inclusion","theorem":"Théorème de Banach–Mazur","statement":"Tout espace de Banach séparable est linéairement isométrique à un sous-espace de \\( \\mathcal{C}([0, 1]) \\) : une famille dénombrable normante \\( (f_n) \\), fournie par Hahn–Banach, encode \\( x \\) en une fonction continue de \\( [0, 1] \\) prenant les valeurs \\( f_n(x) \\) aux noeuds.","depth":"profond","domain":"topologie vectorielle","id":"e141"},{"from":"ABR1","to":"ABR2","kind":"anti","theorem":"Théorème d'Abel–Ruffini","statement":"Il n'existe pas de formule par radicaux pour les racines de l'équation générique de degré \\( n \\ge 5 \\) : elle n'est pas résoluble par radicaux (pour \\( n \\le 4 \\), les formules de Cardan et Ferrari existent).","depth":"profond","counterexample":"L'équation générique \\( X^5 + a_4X^4 + a_3X^3 + a_2X^2 + a_1X + a_0 = 0 \\) sur \\( \\mathbb{Q}(a_0, \\ldots, a_4) \\) : son groupe de Galois est \\( S_5 \\), non résoluble, donc ses racines ne s'écrivent pas par radicaux.","domain":"algèbre générale","id":"e142"},{"from":"HLB1","to":"HLB2","kind":"inclusion","theorem":"Théorème de la base d'Hilbert","statement":"Si \\( A \\) est un anneau noethérien, alors \\( A[X] \\) est noethérien ; en itérant, \\( A[X_1, \\ldots, X_n] \\) est noethérien. La réciproque est vraie : \\( A \\) est un quotient de \\( A[X] \\).","depth":"classique","domain":"algèbre générale","id":"e143"},{"from":"BI1","to":"BI2","kind":"inclusion","theorem":"Théorème de la base incomplète","statement":"Toute famille libre d'un espace vectoriel peut être complétée en une base : il existe une base qui la contient. En dimension finie, par récurrence ; en général, par le lemme de Zorn.","depth":"classique","domain":"algèbre linéaire","id":"e144"},{"from":"ADO1","to":"ADO2","kind":"inclusion","theorem":"Théorème d'Ado","statement":"Toute algèbre de Lie de dimension finie sur un corps de caractéristique nulle admet une représentation fidèle de dimension finie : elle s'injecte dans \\( \\mathfrak{gl}_n(k) \\) comme sous-algèbre de Lie.","depth":"profond","domain":"algèbre bilinéaire","id":"e145"},{"from":"BTY1","to":"BTY2","kind":"inclusion","theorem":"Théorème de Beatty (1926)","statement":"Si \\( \\alpha \\) et \\( \\beta \\) sont irrationnels, plus grands que 1, avec \\( \\tfrac{1}{\\alpha} + \\tfrac{1}{\\beta} = 1 \\), alors les suites \\( (\\lfloor n\\alpha \\rfloor) \\) et \\( (\\lfloor n\\beta \\rfloor) \\) partitionnent \\( \\mathbb{N}^* \\) : chaque entier non nul apparaît exactement une fois. La réciproque est vraie aussi.","depth":"classique","domain":"théorie algébrique des nombres","id":"e146"},{"from":"XNC","to":"XZR","kind":"inclusion","theorem":"Théorème de d'Alembert–Gauss","statement":"Tout polynôme non constant à coefficients complexes admet au moins une racine dans \\( \\mathbb{C} \\) ; par récurrence sur le degré, tout polynôme non constant est scindé sur \\( \\mathbb{C} \\). C'est le théorème fondamental de l'algèbre, dont une preuve courte passe par le théorème de Liouville (une fonction entière bornée est constante).","depth":"fondamental","domain":"analyse complexe","id":"e147"},{"from":"XNC","to":"X3","kind":"inclusion","theorem":"Définition","statement":"Un polynôme non constant est en particulier un polynôme complexe.","depth":"définitoire","domain":"analyse complexe","id":"e148"},{"from":"SU1","to":"SU2","kind":"inclusion","theorem":"Règle de d'Alembert (convergence)","statement":"Si \\( \\lim \\left| \\tfrac{a_{n+1}}{a_n} \\right| = \\ell < 1 \\), alors la série \\( \\sum a_n \\) converge absolument.","depth":"classique","domain":"analyse des suites réelles","id":"e149"},{"from":"SU3","to":"SU4","kind":"inclusion","theorem":"Règle de d'Alembert (divergence)","statement":"Si \\( \\lim \\left| \\tfrac{a_{n+1}}{a_n} \\right| = \\ell > 1 \\), alors \\( a_n \\) ne tend pas vers 0 : la série \\( \\sum a_n \\) diverge grossièrement.","depth":"classique","domain":"analyse des suites réelles","id":"e150"},{"from":"SU5","to":"SU2","kind":"anti","theorem":"Le cas ℓ = 1 ne dit rien","statement":"Le cas \\( \\ell = 1 \\) de la règle de d'Alembert ne permet pas de conclure à la convergence : une suite à ratio limite 1 peut être le terme général d'une série divergente.","depth":"facile","counterexample":"\\( a_n = 1/n \\) : le ratio tend vers 1, et la série harmonique \\( \\sum 1/n \\) diverge.","domain":"analyse des suites réelles","id":"e151"},{"from":"SU5","to":"SU4","kind":"anti","theorem":"Même pas la divergence","statement":"Le cas \\( \\ell = 1 \\) n'implique pas non plus la divergence : une suite à ratio limite 1 peut être le terme général d'une série convergente.","depth":"facile","counterexample":"\\( a_n = 1/n^2 \\) : le ratio tend vers 1, et \\( \\sum 1/n^2 \\) converge (vers \\( \\pi^2/6 \\)).","domain":"analyse des suites réelles","id":"e152"},{"from":"FC","to":"FMC","kind":"inclusion","theorem":"Définition","statement":"Une application continue entre espaces vectoriels normés est continue entre les espaces métriques sous-jacents, pour \\( d(x, y) = \\|x - y\\| \\).","depth":"définitoire","domain":"topologie vectorielle","id":"e153"},{"from":"FMC","to":"TC","kind":"inclusion","theorem":"Définition","statement":"Une application continue entre espaces métriques est continue au sens topologique : les boules ouvertes forment une base de la topologie métrique.","depth":"définitoire","domain":"topologie métrique","id":"e154"},{"from":"BZ1","to":"BZ2","kind":"inclusion","theorem":"Théorème de Bézout","statement":"Pour tous entiers a et b non tous nuls, l'ensemble des combinaisons \\( au + bv \\) est exactement le sous-groupe \\( \\mathrm{pgcd}(a, b)\\,\\mathbb{Z} \\) : le pgcd s'écrit \\( au_0 + bv_0 \\) (identité de Bézout), et a et b sont premiers entre eux si et seulement s'il existe u, v tels que \\( au + bv = 1 \\).","depth":"classique","domain":"arithmétique","id":"e155"},{"from":"BJ1","to":"BJ2","kind":"inclusion","theorem":"Théorème de la bijection entre segments","statement":"Une fonction continue et strictement monotone sur \\( [a, b] \\) est une bijection de \\( [a, b] \\) sur le segment \\( [f(a), f(b)] \\) si elle est croissante, sur \\( [f(b), f(a)] \\) si elle est décroissante.","depth":"classique","domain":"analyse réelle","id":"e156"},{"from":"BJ3","to":"BJ4","kind":"inclusion","theorem":"Théorème de la bijection monotone","statement":"Une fonction continue et strictement monotone sur un intervalle \\( I \\) est une bijection de \\( I \\) sur l'intervalle \\( f(I) \\), et sa réciproque est continue et strictement monotone de même sens : \\( f \\) est un homéomorphisme de \\( I \\) sur \\( f(I) \\).","depth":"classique","domain":"analyse réelle","id":"e157"},{"from":"BJ1","to":"BJ3","kind":"inclusion","theorem":"Définition","statement":"Un segment \\( [a, b] \\) est un intervalle : les fonctions du segment sont un cas particulier de celles d'un intervalle.","depth":"définitoire","domain":"analyse réelle","id":"e158"},{"from":"F","to":"BG2","kind":"inclusion","theorem":"Théorème de Blumberg (1922)","statement":"Pour toute fonction \\( f : \\mathbb{R} \\to \\mathbb{R} \\), il existe une partie dense \\( D \\) de \\( \\mathbb{R} \\) telle que la restriction \\( f|_D \\) soit continue : même la fonction de Dirichlet, discontinue partout, se restreint continûment (constante) à \\( \\mathbb{R} \\setminus \\mathbb{Q} \\). La preuve utilise le lemme de Zorn.","depth":"profond","domain":"théorie des ensembles","id":"e159"},{"from":"GAM1","to":"GAM3","kind":"inclusion","theorem":"Définition","statement":"Une fonction gamma-like log-convexe vérifie en particulier l'équation fonctionnelle de Gamma.","depth":"définitoire","domain":"analyse réelle","id":"e160"},{"from":"GAM1","to":"GAM2","kind":"inclusion","theorem":"Théorème de Bohr–Mollerup (1922)","statement":"Parmi les fonctions positives qui vérifient \\( f(1) = 1 \\) et \\( f(x+1) = x f(x) \\), la fonction Gamma d'Euler est la seule à être log-convexe : toute fonction gamma-like log-convexe est la fonction Gamma.","depth":"classique","domain":"analyse réelle","id":"e161"},{"from":"GAM3","to":"GAM2","kind":"anti","theorem":"Une gamma-like qui n'est pas Gamma","statement":"L'équation fonctionnelle de Gamma et la normalisation \\( f(1) = 1 \\) ne caractérisent pas Gamma sans la log-convexité : d'autres fonctions positives les vérifient.","depth":"facile","counterexample":"\\( f(x) = \\Gamma(x)\\left(1 + \\tfrac{1}{2}\\sin(2\\pi x)\\right) \\) : positive, vérifie \\( f(1) = 1 \\) et \\( f(x+1) = x f(x) \\), mais vaut \\( \\tfrac{3}{2}\\,\\Gamma(1/4) \\) en \\( 1/4 \\) : ce n'est pas Gamma.","domain":"analyse réelle","id":"e162"},{"from":"BW1","to":"BW2","kind":"inclusion","theorem":"Théorème de Bolzano–Weierstrass","statement":"De toute suite bornée de réels on peut extraire une sous-suite convergente (dichotomie en cascade sur des segments emboîtés). Version topologique : dans un espace compact, toute suite admet un point d'adhérence, et dans un espace métrique compact, une sous-suite convergente.","depth":"fondamental","domain":"topologie","id":"e163"},{"from":"BF1","to":"BF2","kind":"inclusion","theorem":"Théorème de bonne fondation","statement":"Une relation est bien fondée si et seulement si elle n'admet aucune chaîne descendante infinie (la réciproque demande l'axiome du choix dénombrable). L'axiome de fondation de ZFC affirme que la relation d'appartenance \\( \\in \\) est bien fondée : c'est le socle de la récurrence sur les ensembles et de l'interdiction des boucles \\( x \\in x \\).","depth":"classique","domain":"théorie des ensembles","id":"e164"},{"from":"BR1","to":"BR2","kind":"inclusion","theorem":"Théorème de Borel (1895)","statement":"Toute suite réelle \\( (a_n)_{n \\ge 0} \\) est la suite des dérivées successives en 0 d'une fonction \\( \\mathcal{C}^{\\infty} \\) de \\( \\mathbb{R} \\) dans \\( \\mathbb{R} \\) : toute série formelle \\( \\sum a_n \\tfrac{x^n}{n!} \\) est la série de Taylor d'une fonction lisse. La fonction n'est en général pas analytique : pour \\( a_n = (n!)^2 \\), la série ne converge qu'en 0.","depth":"classique","domain":"analyse réelle","id":"e165"},{"from":"BL1","to":"BL2","kind":"inclusion","theorem":"Théorème de Borel–Lebesgue","statement":"Dans \\( \\mathbb{R}^n \\), toute partie fermée et bornée est compacte : de tout recouvrement par des ouverts on peut extraire un sous-recouvrement fini (Borel–Lebesgue). La réciproque est vraie ; la caractérisation échoue en dimension infinie, où la boule unité fermée n'est jamais compacte (théorème de Riesz).","depth":"fondamental","domain":"topologie vectorielle","id":"e166"},{"from":"LN1","to":"LN2","kind":"inclusion","theorem":"Caractérisation de la continuité linéaire","statement":"Entre espaces vectoriels normés, une application linéaire est continue si et seulement si elle est bornée sur la boule unité : \\( \\exists C, \\ \\forall x, \\ \\|x\\|_E \\le 1 \\Rightarrow \\|T(x)\\|_F \\le C \\). En dimension finie, toutes les applications linéaires sont continues.","depth":"classique","domain":"topologie vectorielle","id":"e167"},{"from":"SQ1","to":"SQ2","kind":"inclusion","theorem":"Caractérisation séquentielle de la compacité","statement":"Dans un espace vectoriel normé (plus généralement dans tout espace métrique), une partie est compacte si et seulement si toute suite à valeurs dans cette partie admet une sous-suite qui converge dans la partie : les deux définitions coïncident.","depth":"classique","domain":"topologie vectorielle","id":"e168"},{"from":"FQ1","to":"FQ2","kind":"inclusion","theorem":"Caractérisation séquentielle des fermés","statement":"Dans un espace vectoriel normé (plus généralement dans tout espace métrique), une partie est fermée si et seulement si elle contient les limites de toutes ses suites convergentes.","depth":"immédiat","domain":"topologie vectorielle","id":"e169"},{"from":"TB1","to":"TB2","kind":"inclusion","theorem":"Théorème des bornes atteintes","statement":"Toute fonction réelle continue sur un compact est bornée et atteint ses bornes : l'image d'un compact par une application continue est un compact, donc une partie fermée et bornée de \\( \\mathbb{R} \\), qui contient sa borne supérieure et sa borne inférieure.","depth":"fondamental","domain":"topologie métrique","id":"e170"},{"from":"BU1","to":"BU2","kind":"inclusion","theorem":"Théorème de Borsuk–Ulam","statement":"Toute application continue \\( f : \\mathbb{S}^n \\to \\mathbb{R}^n \\) identifie deux points antipodaux : \\( \\exists x, \\ f(x) = f(-x) \\). En n = 1, il existe deux points diamétralement opposés du cercle de même température ; en n = 2, deux points antipodaux du globe de même température et même pression. La preuve passe par le degré des applications impaires.","depth":"profond","domain":"topologie algébrique","id":"e171"},{"from":"BV1","to":"BV2","kind":"inclusion","theorem":"Théorème de la boule chevelue","statement":"Tout champ de vecteurs continu tangent à la sphère \\( \\mathbb{S}^2 \\) s'annule en au moins un point : impossible de peigner une sphère chevelue sans ébouriffage. Le résultat vaut pour toutes les sphères paires \\( \\mathbb{S}^{2n} \\) ; les sphères impaires y échappent (champ de Hopf sur \\( \\mathbb{S}^3 \\)).","depth":"profond","domain":"topologie différentielle","id":"e172"},{"from":"BRG1","to":"BRG2","kind":"inclusion","theorem":"Théorème de Brahmagupta (628)","statement":"L'aire d'un quadrilatère cyclique de côtés \\( a \\), \\( b \\), \\( c \\), \\( d \\), de demi-périmètre \\( s \\), vaut \\( \\mathcal{A} = \\sqrt{(s-a)(s-b)(s-c)(s-d)} \\). Le cas \\( d = 0 \\) redonne la formule de Héron pour le triangle.","depth":"classique","domain":"géométrie euclidienne","id":"e173"},{"from":"BRI1","to":"BRI2","kind":"inclusion","theorem":"Identité de Brahmagupta","statement":"\\( (x^2 + n y^2)(z^2 + n w^2) = (xz - nyw)^2 + n(xw + yz)^2 \\) : un produit de deux entiers de la forme \\( x^2 + n y^2 \\) en est encore un ; pour n = 1, c'est l'identité de Fibonacci–Brahmagupta, cœur de la preuve du théorème des deux carrés de Fermat.","depth":"classique","domain":"arithmétique","id":"e174"},{"from":"BRH1","to":"BRH2","kind":"inclusion","theorem":"Théorème de Brianchon (1806)","statement":"Si un hexagone est circonscrit à une conique (ses six côtés tangents à une même conique), ses trois diagonales, joignant les paires de sommets opposés, sont concourantes. C'est l'énoncé dual du théorème de Pascal : hexagone inscrit, intersections des côtés opposés alignées.","depth":"classique","domain":"géométrie euclidienne","id":"e175"},{"from":"BRK1","to":"BRK2","kind":"inclusion","theorem":"Théorème de Brooks (1941)","statement":"Pour un graphe connexe de degré maximum \\( \\Delta \\) qui n'est ni une clique ni un cycle impair, \\( \\chi(G) \\le \\Delta \\) : un coloriage glouton dans un bon ordre des sommets ne bloque jamais. Les deux exceptions sont exactes (voir les deux arêtes pointillées) ; la borne est atteinte, par exemple par les cycles pairs.","depth":"classique","domain":"théorie des graphes","id":"e176"},{"from":"BRK3","to":"BRK2","kind":"anti","theorem":"L'exception des cycles impairs","statement":"Un cycle impair contredit la borne de Brooks : il exige 3 couleurs alors que son degré maximum vaut 2.","depth":"facile","counterexample":"\\( C_5 \\) : \\( \\chi(C_5) = 3 > 2 = \\Delta(C_5) \\), théorème des deux couleurs impossible sur un cycle impair.","domain":"théorie des graphes","id":"e177"},{"from":"BRK4","to":"BRK2","kind":"anti","theorem":"L'exception des cliques","statement":"Une clique contredit la borne de Brooks : chaque sommet est adjacent à tous les autres, et il faut autant de couleurs que de sommets.","depth":"facile","counterexample":"\\( K_3 \\), le triangle : \\( \\chi = 3 > 2 = \\Delta \\) ; plus généralement \\( K_n \\) demande ses \\( n \\) couleurs.","domain":"théorie des graphes","id":"e178"},{"from":"BRN1","to":"SU2","kind":"inclusion","theorem":"Théorème de Brun (1919)","statement":"La série des inverses des couples de premiers jumeaux converge : la constante de Brun vaut environ 1,902. C'est un résultat de crible ; il laisse ouverte l'existence d'une infinité de premiers jumeaux, mais montre qu'ils sont assez rares pour que \\( \\sum (1/p + 1/(p+2)) \\) converge, alors que la série des inverses de tous les premiers diverge (Euler).","depth":"profond","domain":"théorie algébrique des nombres","id":"e179"},{"from":"BNS1","to":"BNS2","kind":"inclusion","theorem":"Théorème de Burnside (1904)","statement":"Tout groupe fini dont l'ordre n'admet que deux facteurs premiers distincts, \\( |G| = p^a q^b \\), est résoluble. La preuve de Burnside passe par la théorie des caractères complexes : un tel groupe a toujours un sous-groupe normal propre non trivial. On en déduit que les groupes simples non cycliques ont au moins trois facteurs premiers.","depth":"profond","domain":"théorie des groupes","id":"e180"},{"from":"BSL1","to":"BSL2","kind":"inclusion","theorem":"Lemme de Burnside (1897)","statement":"Le nombre d'orbites de l'action d'un groupe fini \\( G \\) sur un ensemble fini \\( X \\) vaut la moyenne du nombre de points fixes : \\( |X/G| = (1/|G|) \\sum_{g} |\\mathrm{Fix}(g)| \\). Chaque orbite de taille \\( s \\) contribue pour \\( |G|/s \\) au total. C'est l'outil de comptage des objets modulo symétrie : colliers, coloriages, énumération de Pólya.","depth":"classique","domain":"théorie des groupes","id":"e181"},{"from":"CNT1","to":"CNT2","kind":"inclusion","theorem":"Théorème de Cantor (1891)","statement":"Aucune application \\( f : X \\to \\mathcal{P}(X) \\) n'est surjective : la partie diagonale \\( D = \\{\\, x \\in X : x \\notin f(x) \\,\\} \\) n'est la valeur d'aucun point, sinon son antécédent \\( x_0 \\) vérifierait \\( x_0 \\in f(x_0) \\) équivalent à \\( x_0 \\notin f(x_0) \\). Il n'y a donc pas de bijection entre \\( X \\) et \\( \\mathcal{P}(X) \\) : \\( |X| < |\\mathcal{P}(X)| \\). C'est la diagonale de Cantor, mère des arguments diagonaux (Russell, Gödel, Turing).","depth":"fondamental","domain":"théorie des ensembles","id":"e182"},{"from":"ORD1","to":"ORD2","kind":"inclusion","theorem":"Théorème de Cantor sur les ordres (1895)","statement":"Tout ordre linéaire dense dénombrable sans extrémités est isomorphe à \\( (\\mathbb{Q}, \\le) \\) : l'isomorphisme se construit par va-et-vient (back-and-forth), en envoyant les éléments l'un après l'autre. \\( (\\mathbb{Q}, \\le) \\) est ainsi l'unique modèle dénombrable des ordres denses sans extrémités ; les variantes avec extrémités donnent quatre modèles dénombrables au total.","depth":"classique","domain":"théorie des ordres","id":"e183"},{"from":"CBD1","to":"CBD2","kind":"inclusion","theorem":"Théorème de Cantor–Bendixson","statement":"Tout fermé de \\( \\mathbb{R} \\) se décompose en réunion disjointe d'un ensemble parfait (fermé sans point isolé) et d'un ensemble au plus dénombrable : les points isolés s'éliminent en itérant l'opération dérivée, et le rang de Cantor Bendixson atteint le vide en un ordinal dénombrable. Conséquence : tout fermé non dénombrable contient une partie parfaite, donc a exactement la puissance du continu.","depth":"classique","domain":"topologie","id":"e184"},{"from":"CBE1","to":"CBE2","kind":"inclusion","theorem":"Théorème de Cantor–Bernstein","statement":"Si \\( X \\) s'injecte dans \\( Y \\) et \\( Y \\) s'injecte dans \\( X \\), alors \\( X \\) et \\( Y \\) sont équipotents (Schröder Bernstein). La preuve fait osciller les deux injections : \\( X \\) se partitionne en trois zones, l'une envoyée sur \\( Y \\) par \\( f \\), les deux autres par \\( g^{-1} \\). D'où \\( |\\mathbb{R}| = |\\mathcal{P}(\\mathbb{N})| \\) via les développements binaires.","depth":"classique","domain":"théorie des ensembles","id":"e185"},{"from":"CAR1","to":"CAR2","kind":"inclusion","theorem":"Théorème d'extension de Carathéodory","statement":"Toute prémesure \\( \\sigma \\)-additive sur une algèbre se prolonge en une mesure sur la tribu engendrée : les ensembles \\( \\mu^* \\)-mesurables au sens de Carathéodory (\\( \\mu^*(A) = \\mu^*(A \\cap E) + \\mu^*(A \\setminus E) \\) pour tout \\( A \\)) forment une tribu complète contenant l'algèbre de départ, sur laquelle la mesure extérieure \\( \\mu^* \\) prolonge la prémesure. C'est ainsi que la longueur des intervalles devient la mesure de Lebesgue.","depth":"fondamental","domain":"théorie de la mesure","id":"e186"},{"from":"CKD1","to":"CKD2","kind":"inclusion","theorem":"Théorème de Carathéodory (enveloppe convexe)","statement":"Dans \\( \\mathbb{R}^n \\), tout point de l'enveloppe convexe d'une partie \\( S \\) est barycentre d'au plus \\( n+1 \\) points de \\( S \\) : \\( \\mathrm{conv}(S) \\) est la réunion des \\( \\mathrm{conv}(T) \\) pour les \\( T \\subseteq S \\) de cardinal au plus \\( n+1 \\). En dimension 2, tout point est dans un triangle ; en dimension 3, dans un tétraèdre. La réciproque est triviale, tout barycentre de points de \\( S \\) restant dans \\( \\mathrm{conv}(S) \\).","depth":"classique","domain":"topologie vectorielle","id":"e187"},{"from":"CQG1","to":"CQG2","kind":"inclusion","theorem":"Théorème de Cauchy (groupes)","statement":"Si un nombre premier \\( p \\) divise l'ordre d'un groupe fini \\( G \\), alors \\( G \\) contient un élément d'ordre \\( p \\), donc un sous-groupe d'ordre \\( p \\). Preuve courte : les \\( p \\)-uplets \\( (x_1, \\ldots, x_p) \\) de produit \\( e \\) sont en nombre multiple de \\( p \\) (rotation circulaire), et les uplets constants fournissent les éléments d'ordre \\( p \\). La réciproque est le sens facile du théorème de Lagrange.","depth":"classique","domain":"théorie des groupes","id":"e188"},{"from":"CAU1","to":"CAU2","kind":"inclusion","theorem":"Critère de Cauchy","statement":"Dans un espace métrique complet, toute suite de Cauchy converge : c'est exactement ce que dit la complétion, et le critère de Cauchy permet de prouver une convergence sans connaître la limite. La réciproque vaut dans tout espace métrique : toute suite convergente est de Cauchy. Appliqué aux sommes partielles, c'est le critère de Cauchy des séries : \\( \\sum a_n \\) converge si et seulement si \\( |a_{p+1} + \\cdots + a_q| \\le \\varepsilon \\) dès que \\( q > p \\ge N \\).","depth":"classique","domain":"topologie","id":"e189"},{"from":"CQP1","to":"CQP2","kind":"inclusion","theorem":"Théorème de Cauchy sur les polyèdres (1813)","statement":"Deux polyèdres convexes dont les faces correspondantes sont congruentes (côtés et angles égaux) sont congruents : les angles dièdres correspondants sont égaux. La preuve étudie les variations des dièdres via le lemme de signes de Cauchy. Conséquence célèbre : les polyèdres convexes sont rigides, aucune flexion continue non triviale, contrairement aux polyèdres non convexes (Bricard, Connelly).","depth":"profond","domain":"géométrie euclidienne","id":"e190"},{"from":"CLP1","to":"PE1","kind":"inclusion","theorem":"Définition","statement":"Un second membre localement lipschitzien en y est en particulier continu : les problèmes de Cauchy lipschitziens forment une sous-classe des problèmes continus.","depth":"définitoire","domain":"analyse des équations différentielles","id":"e191"},{"from":"CLP1","to":"CLP2","kind":"inclusion","theorem":"Théorème de Cauchy–Lipschitz","statement":"Pour \\( y' = f(t, y) \\), \\( y(t_0) = y_0 \\), avec \\( f \\) continue et localement lipschitzienne en \\( y \\), il existe une unique solution maximale, définie sur un intervalle ouvert ; de plus deux solutions qui coïncident en un point coïncident partout (lemme de Gronwall). C'est ce théorème qui justifie l'article défini : « la » solution d'une équation différentielle.","depth":"fondamental","domain":"analyse des équations différentielles","id":"e192"},{"from":"RCQ1","to":"SU2","kind":"inclusion","theorem":"Règle de condensation de Cauchy (convergence)","statement":"Pour une suite \\( (a_n) \\) positive décroissante, la série \\( \\sum a_n \\) converge si et seulement si la série condensée \\( \\sum 2^k a_{2^k} \\) converge : les blocs dyadiques encadrent la série. En une ligne : \\( \\sum 1/n^p \\) converge pour \\( p > 1 \\) (condensée géométrique) et diverge pour \\( p \\le 1 \\).","depth":"classique","domain":"analyse de séries","id":"e193"},{"from":"RCQ3","to":"SU4","kind":"inclusion","theorem":"Règle de condensation de Cauchy (divergence)","statement":"Pour une suite \\( (a_n) \\) positive décroissante, la série diverge dès que la condensée diverge. La condensation de la série harmonique redonne \\( \\sum 1 \\), celle de \\( \\sum 1/(n \\log n) \\) redonne la série harmonique : Maclaurin et Cauchy en tirent un arsenal entier de tests de convergence.","depth":"classique","domain":"analyse de séries","id":"e194"},{"from":"DCV2","to":"DCV1","kind":"inclusion","theorem":"Théorème de Cauchy–Hadamard","statement":"Le rayon de convergence d'une série entière \\( \\sum a_n z^n \\) vaut \\( R = \\left( \\limsup \\sqrt[n]{|a_n|} \\right)^{-1} \\) : la série converge absolument dans le disque ouvert \\( |z| < R \\), diverge grossièrement pour \\( |z| > R \\), et tout peut arriver sur le cercle \\( |z| = R \\).","depth":"classique","domain":"analyse complexe","id":"e195"},{"from":"PE1","to":"PE2","kind":"inclusion","theorem":"Théorème de Cauchy–Peano–Arzelà","statement":"Pour \\( y' = f(t, y) \\), \\( y(t_0) = y_0 \\), avec \\( f \\) seulement continue, il existe au moins une solution locale : polygones d'Euler de pas fin, famille équicontinue, passage à la limite par le théorème d'Arzelà Ascoli. Sans hypothèse de Lipschitz, l'unicité disparaît (voir l'arête pointillée).","depth":"classique","domain":"analyse des équations différentielles","id":"e196"},{"from":"PE1","to":"PEU1","kind":"anti","theorem":"Sans Lipschitz, l'unicité tombe","statement":"La seule continuité du second membre ne suffit pas pour l'unicité : un même problème de Cauchy peut avoir plusieurs solutions.","depth":"facile","counterexample":"\\( y' = \\sqrt{y} \\), \\( y(0) = 0 \\) : la solution nulle, mais aussi toutes les fonctions nulles jusqu’à un temps \\( c > 0 \\) puis \\( (t-c)^{2}/4 \\) ensuite, une infinité de solutions.","domain":"analyse des équations différentielles","id":"e197"},{"from":"C
