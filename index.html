R1","to":"X2","kind":"inclusion","theorem":"Équations de Cauchy–Riemann","statement":"Une fonction \\( f = u + iv \\) de classe \\( C^1 \\) sur \\( \\mathbb{C} \\) qui vérifie les équations de Cauchy Riemann, \\( \\partial u / \\partial x = \\partial v / \\partial y \\) et \\( \\partial u / \\partial y = -\\partial v / \\partial x \\), est entière ; la réciproque est immédiate en dérivant dans les directions réelle et imaginaire. Être holomorphe, c'est avoir une différentielle \\( \\mathbb{C} \\)-linéaire ; sur un ouvert, la même équivalence vaut localement.","depth":"classique","domain":"analyse complexe","id":"e198"}]};

  "algèbre générale": { bg: "#f9dfa0", border: "#e0b45d" },
  "algèbre linéaire": { bg: "#c4e8c8", border: "#8fc79e" },
  "théorie des ensembles": { bg: "#b6dcf5", border: "#7fb4dd" },
  "analyse complexe": { bg: "#dfc3ac", border: "#b5896a" },
  "topologie": { bg: "#d8c6ee", border: "#ac86d9" },
  "théorie algébrique des nombres": { bg: "#47aec3", border: "#17788a" },
  "algèbre bilinéaire": { bg: "#43a067", border: "#1f6f3f" },
  "théorie de la mesure": { bg: "#df8bd9", border: "#b336b0" },
  "géométrie euclidienne": { bg: "#fcf1c1", border: "#d9bd63" },
  "théorie des langages": { bg: "#bdeef5", border: "#57c3d8" },
  "théorie des corps": { bg: "#f4e0ac", border: "#c2902a" },
  "topologie métrique": { bg: "#e7e0f7", border: "#a78fd8" },
  "topologie vectorielle": { bg: "#c9b3ec", border: "#7b53c7" },
  "analyse des suites réelles": { bg: "#f8ceb9", border: "#e0896a" },
  "topologie algébrique": { bg: "#aec3e9", border: "#2f4f9e" },
  "topologie différentielle": { bg: "#bfeee8", border: "#52b7aa" },
  "théorie des graphes": { bg: "#8fcfe8", border: "#2a93b8" },
  "théorie des groupes": { bg: "#efe6cf", border: "#c9ab77" },
  "théorie des ordres": { bg: "#8ba3cf", border: "#1e3a6e" },
  "analyse des équations différentielles": { bg: "#f2b483", border: "#c77b3a" },
  "analyse de séries": { bg: "#eccbd0", border: "#b06a76" }
};
function domainStyle(d) { return DOMAIN_STYLE[d] || { bg: "#cfd9e4", border: "#a9b6c6" }; }
var DOMAIN_SYMBOL = { "analyse réelle": "∫", "arithmétique": "ℤ", "algèbre générale": "∘", "algèbre linéaire": "λ", "théorie des ensembles": "∈", "analyse complexe": "i", "topologie": "τ", "théorie algébrique des nombres": "√", "algèbre bilinéaire": "β", "théorie de la mesure": "μ", "géométrie euclidienne": "△", "théorie des langages": "Σ", "théorie des corps": "𝕂", "topologie métrique": "d", "topologie vectorielle": "‖", "analyse des suites réelles": "∑", "topologie algébrique": "π", "topologie différentielle": "∂", "théorie des graphes": "χ", "théorie des groupes": "𝔾", "théorie des ordres": "≤", "analyse des équations différentielles": "ẋ", "analyse de séries": "Σ" };

var cy = null;
var idToLabel = {};
function labelOf(id) { return idToLabel[id] || id; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

var NODE_FONT = 'Inter, system-ui, "Segoe UI", sans-serif';
var _ctx = document.createElement("canvas").getContext("2d");
function textW(t, fs) { _ctx.font = "600 " + fs + "px " + NODE_FONT; return _ctx.measureText(t).width; }
function countLines(label, fs, w) {
  var words = label.split(" "), n = 1, cur = "";
  words.forEach(function (wd) {
    if (cur === "") { cur = wd; }
    else if (textW(cur + " " + wd, fs) <= w) { cur = cur + " " + wd; }
    else { n++; cur = wd; }
  });
  return n;
}
function fits(label, fs, d) {
  var w = d * 0.78;
  var longest = 0;
  label.split(" ").forEach(function (wd) { longest = Math.max(longest, textW(wd, fs)); });
  return longest <= w && countLines(label, fs, w) * fs * 1.25 <= d * 0.74;
}
function nodeSize(label, inDeg) {
  // Diamètre de base décidé par les arêtes qui arrivent ; il n'est agrandi
  // (jusqu'à ×1,8) que si le texte ne rentre pas, même à police réduite (≥ 8 px).
  var dDeg = Math.min(170, 46 + inDeg * 9);
  for (var d = dDeg; d <= Math.round(dDeg * 1.8); d += 2) {
    for (var fs = 10.5; fs >= 8; fs -= 0.5) {
      if (fits(label, fs, d)) { return { d: d, w: Math.round(d * 0.78), font: fs }; }
    }
  }
  var dMax = Math.round(dDeg * 1.8);
  return { d: dMax, w: Math.round(dMax * 0.78), font: 7 };
}

function buildElements(g) {
  idToLabel = {};
  g.nodes.forEach(function (n) { idToLabel[n.id] = n.label; });
  var inDeg = {};
  g.edges.forEach(function (e) { inDeg[e.to] = (inDeg[e.to] || 0) + 1; });
  var els = [];
  g.nodes.forEach(function (n) {
    var ds = domainStyle(n.domain);
    var sz = nodeSize(n.label, inDeg[n.id] || 0);
    els.push({ data: {
      id: n.id, label: n.label, family: n.family, domain: n.domain,
      property: n.property, description: n.description, example: n.example,
      notes: n.notes || "", color: ds.bg, borderColor: ds.border,
      size: sz.d, tw: sz.w, font: sz.font, inDeg: inDeg[n.id] || 0
    } });
  });
  g.edges.forEach(function (e) {
    els.push({ data: {
      id: e.id, source: e.from, target: e.to, from: e.from, to: e.to, kind: e.kind,
      domain: e.domain || "", mathlib: e.mathlib || "",
      theorem: e.theorem, statement: e.statement, depth: e.depth,
      counterexample: e.counterexample || "", strict: e.kind === "inclusion" && e.strict,
      strictnessExample: e.strictnessExample || "", notes: e.notes || ""
    } });
  });
  return els;
}

function styleSheet() {
  return [
    { selector: "node", style: {
      "shape": "ellipse", "background-color": "data(color)",
      "border-width": 1.5, "border-color": "data(borderColor)",
      "width": "data(size)", "height": "data(size)",
      "label": "data(label)", "color": "#2e2a33", "font-size": "data(font)", "font-family": NODE_FONT,
      "font-weight": 600, "text-valign": "center", "text-halign": "center",
      "text-wrap": "wrap", "text-max-width": "data(tw)"
    } },
    { selector: "node:selected", style: { "border-width": 3, "border-color": "#f2c14e" } },
    { selector: "edge", style: {
      "curve-style": "bezier", "control-point-step-size": 55,
      "width": 0.9, "line-color": "#ffffff", "opacity": 0.65,
      "target-arrow-shape": "triangle", "target-arrow-color": "#ffffff", "arrow-scale": 0.7
    } },
    { selector: 'edge[kind="anti"]', style: { "line-style": "dashed", "target-arrow-shape": "none", "opacity": 0.5 } },
    { selector: 'edge[kind="equivalence"]', style: { "source-arrow-shape": "triangle", "source-arrow-color": "#ffffff" } },
    { selector: "edge:selected", style: { "line-color": "#f2c14e", "target-arrow-color": "#f2c14e", "width": 2.4, "opacity": 1 } },
    { selector: ".hiddenedge", style: { "display": "none" } },
    { selector: ".faded", style: { "opacity": 0.07 } }
  ];
}

function getLayout() {
  return { name: "cose", animate: true, animationDuration: 500, idealEdgeLength: 110, nodeRepulsion: 12000, nodeOverlap: 26, componentSpacing: 40, padding: 30, randomize: true };
}

function mathify() {
  var el = document.getElementById("panel");
  if (window.renderMathInElement) {
    renderMathInElement(el, { delimiters: [{ left: "\\(", right: "\\)", display: false }], throwOnError: false });
  }
}
function showPanel(html) {
  var el = document.getElementById("panel");
  el.innerHTML = html;
  mathify();
}

function famLabel(f) { return FAMILY_LABEL[f] || (f ? f.charAt(0).toUpperCase() + f.slice(1) : ""); }

function vig(tag, tagColor, title, domain, sub) {
  var ds = domainStyle(domain);
  var sym = DOMAIN_SYMBOL[domain] || "·";
  return "<div class='vig'><div class='vsym' style='background:" + ds.bg + "'>" + sym + "</div>" +
    "<div class='vtxt'><div class='vtag' style='color:" + tagColor + "'>" + esc(tag) + "</div>" +
    "<h2>" + esc(title) + "</h2><div class='vdom'>" + esc(sub === undefined ? domain : sub) + "</div></div></div>";
}

function nodeHtml(n) {
  var h = [];
  h.push(vig("Ensemble", "var(--blue)", n.label, n.domain, n.domain + (n.family ? " · " + famLabel(n.family) : "")));
  h.push("<div class='body'>");
  h.push("<div class='statement'>" + esc(n.description) + "</div>");
  h.push("<div class='prop'>\\(" + n.property + "\\)</div>");
  h.push("<div class='card'><b>Exemple type.</b> " + esc(n.example) + "</div>");
  if (n.notes) { h.push("<p class='note'>" + esc(n.notes) + "</p>"); }
  var outs = [], ins = [], antis = [];
  GRAPH.edges.forEach(function (e) {
    if (e.kind === "inclusion") {
      if (e.from === n.id) { outs.push(e); }
      else if (e.to === n.id) { ins.push(e); }
    } else if (e.kind === "anti") {
      if (e.from === n.id || e.to === n.id) { antis.push(e); }
    }
  });
  if (outs.length) {
    h.push("<h3>Sont contenus dedans (" + outs.length + ")</h3><ul>");
    outs.forEach(function (e) { h.push("<li>" + esc(labelOf(n.id)) + "<span class='op'>⊂</span>" + esc(labelOf(e.to)) + " <span class='th'>— " + esc(e.theorem) + (e.strict ? " (strict)" : "") + "</span></li>"); });
    h.push("</ul>");
  }
  if (ins.length) {
    h.push("<h3>Le contiennent (" + ins.length + ")</h3><ul>");
    ins.forEach(function (e) { h.push("<li>" + esc(labelOf(e.from)) + "<span class='op'>⊂</span>" + esc(labelOf(n.id)) + " <span class='th'>— " + esc(e.theorem) + "</span></li>"); });
    h.push("</ul>");
  }
  if (antis.length) {
    h.push("<h3>Non-inclusions voisines</h3><ul>");
    antis.forEach(function (e) {
      var first = e.from === n.id ? n.id : e.to;
      var second = e.from === n.id ? e.to : n.id;
      h.push("<li class='antiitem'>" + esc(labelOf(first)) + "<span class='op'>⊄</span>" + esc(labelOf(second)) + " <span class='th'>— " + esc(e.theorem) + "</span></li>");
    });
    h.push("</ul>");
  }
  h.push("</div>");
  return h.join("");
}

function edgeHtml(e) {
  var a = null, b = null;
  GRAPH.nodes.forEach(function (n) { if (n.id === e.from) { a = n; } else if (n.id === e.to) { b = n; } });
  var lat = e.kind === "inclusion" ? "subseteq" : (e.kind === "equivalence" ? "equiv" : "nsubseteq");
  var opTxt = e.kind === "inclusion" ? "⊆" : (e.kind === "equivalence" ? "=" : "⊄");
  var tag = e.kind === "inclusion" ? "Théorème" : (e.kind === "anti" ? "Contre-exemple" : "Équivalence");
  var tagColor = e.kind === "inclusion" ? "var(--pink)" : (e.kind === "anti" ? "var(--orange)" : "var(--green)");
  var dom = e.domain || (a && a.domain) || (b && b.domain) || "";
  var h = [];
  h.push(vig(tag, tagColor, e.theorem || opTxt, dom));
  h.push("<div class='body'>");
  h.push("<div class='chips'><span class='chip'>" + esc(e.depth || "") + "</span>" + (e.strict ? "<span class='chip'>inclusion stricte</span>" : "") + (e.mathlib ? "<a class='chip mlink' href='" + esc(e.mathlib) + "' target='_blank' rel='noreferrer'>↗ Mathlib</a>" : "") + "</div>");
  h.push("<div class='statement'>" + esc(e.statement) + "</div>");
  h.push("<div class='rel'>\\(" + ((a && a.property) || esc(labelOf(e.from))) + " \\" + lat + " " + ((b && b.property) || esc(labelOf(e.to))) + "\\)</div>");
  if (e.kind === "anti" && e.counterexample) {
    h.push("<div class='ce'><b>Contre-exemple.</b> " + esc(e.counterexample) + "</div>");
  }
  if (e.strict && e.strictnessExample) {
    h.push("<div class='ce ok'><b>Inclusion stricte.</b> " + esc(e.strictnessExample) + "</div>");
  }
  if (e.notes) { h.push("<p class='note'>" + esc(e.notes) + "</p>"); }
  h.push("<p class='note'>" + esc(labelOf(e.from)) + " → " + esc(labelOf(e.to)) + "</p>");
  h.push("</div>");
  return h.join("");
}

function defaultPanel() {
  var h = [];
  h.push("<div class='vig'><div class='vsym' style='background:#cfd9e4'>⊆</div><div class='vtxt'><div class='vtag' style='color:var(--accent)'>Guide</div><h2>Graphe des théorèmes</h2><div class='vdom'>nœud = ensemble · arête = théorème</div></div></div>");
  h.push("<div class='body'>");
  h.push("<div class='statement'>Chaque <b>cercle</b> est un <b>ensemble</b>, nommé précisément. Chaque <b>arête blanche</b> est un <b>théorème</b> : A ⊆ B. Les <b>pointillés</b> sont des contre-exemples : A ⊄ B, prouvés par un objet explicite.</div>");
  h.push("<div class='card'>La <b>taille d'un cercle</b> est proportionnelle au nombre d'arêtes qui y arrivent. Chaque théorème a sa propre vignette, dont la couleur et le symbole sont ceux de sa thématique (le domaine de l'arête, indépendant de celui des deux ensembles reliés).</div>");
  h.push("<h3>Domaines</h3><div class='chips'>");
  Object.keys(DOMAIN_STYLE).forEach(function (d) { var ds = DOMAIN_STYLE[d]; h.push("<span class='chip' style='background:" + ds.bg + "; border-color:" + ds.border + "; color:#2e2a33'>" + DOMAIN_SYMBOL[d] + " " + esc(d) + "</span>"); });
  h.push("</div>");
  h.push("<p class='note'>Cliquez sur un cercle ou une arête. Les formules sont composées par KaTeX. La case « contre-exemples » les masque ou les affiche.</p>");
  h.push("</div>");
  return h.join("");
}

function applyVisibility() {
  var fam = document.getElementById("family").value;
  var dep = document.getElementById("depth").value;
  var q = document.getElementById("search").value.trim().toLowerCase();
  cy.batch(function () {
    cy.nodes().forEach(function (n) {
      var nd = n.data();
      var okF = fam === "all" || nd.family === fam;
      var okQ = q === "" || ((nd.label + " " + nd.description + " " + (nd.notes || "") + " " + (nd.example || "")).toLowerCase().indexOf(q) >= 0);
      n.toggleClass("faded", !(okF && okQ));
    });
    cy.edges().forEach(function (e) {
      var ed = e.data();
      var okD = dep === "all" || ed.depth === dep;
      var epVisible = (!e.source().hasClass("faded")) && (!e.target().hasClass("faded"));
      e.toggleClass("faded", !(okD && epVisible));
    });
  });
}

function rebuild() {
  initSelects();
  if (cy) { cy.destroy(); }
  cy = cytoscape({ container: document.getElementById("cy"), elements: buildElements(GRAPH), style: styleSheet(), layout: getLayout() });
  cy.on("tap", "node", function (ev) { showPanel(nodeHtml(ev.target.data())); });
  cy.on("tap", "edge", function (ev) { showPanel(edgeHtml(ev.target.data())); });
  cy.on("tap", function (ev) { if (ev.target === cy) { showPanel(defaultPanel()); } });
  applyAnti();
  applyVisibility();
}

function applyAnti() {
  var on = document.getElementById("anti").checked;
  cy.edges().forEach(function (e) {
    e.toggleClass("hiddenedge", !on && e.data("kind") === "anti");
  });
}

function initSelects() {
  var depthSel = document.getElementById("depth");
  depthSel.innerHTML = "";
  var o = document.createElement("option"); o.value = "all"; o.textContent = "Toutes profondeurs"; depthSel.appendChild(o);
  Object.keys(DEPTH_LABEL).forEach(function (d) {
    var x = document.createElement("option"); x.value = d; x.textContent = "Théorèmes " + DEPTH_LABEL[d]; depthSel.appendChild(x);
  });
  var famSel = document.getElementById("family");
  famSel.innerHTML = "";
  var o2 = document.createElement("option"); o2.value = "all"; o2.textContent = "Toutes familles"; famSel.appendChild(o2);
  var fams = [];
  GRAPH.nodes.forEach(function (n) { if (n.family && fams.indexOf(n.family) < 0) { fams.push(n.family); } });
  fams.forEach(function (f) {
    var x = document.createElement("option"); x.value = f; x.textContent = famLabel(f); famSel.appendChild(x);
  });
}

document.getElementById("relayout").addEventListener("click", function () { cy.layout(getLayout()).run(); });
document.getElementById("search").addEventListener("input", applyVisibility);
document.getElementById("depth").addEventListener("change", applyVisibility);
document.getElementById("family").addEventListener("change", applyVisibility);
document.getElementById("anti").addEventListener("change", applyAnti);
document.getElementById("file").addEventListener("change", function (ev) {
  var f = ev.target.files[0];
  if (!f) { return; }
  var r = new FileReader();
  r.onload = function () {
    try {
      var g = JSON.parse(r.result);
      if (!g.nodes || !g.edges) { throw new Error("JSON sans nodes/edges"); }
      GRAPH = g;
      rebuild();
      showPanel("<h2>Graphe chargé</h2><div class='card'>" + g.nodes.length + " ensembles, " + g.edges.length + " théorèmes.</div>");
    } catch (err) { alert("JSON invalide : " + err.message); }
  };
  r.readAsText(f);
});

initSelects();
showPanel(defaultPanel());
rebuild();

fetch("data/graphe.json").then(function (r) { return r.json(); }).then(function (g) {
  if (g && g.nodes && g.edges && (g.nodes.length !== GRAPH.nodes.length || g.edges.length !== GRAPH.edges.length)) {
    GRAPH = g;
    rebuild();
  }
}).catch(function () {});
</script>
</body>
</html>
