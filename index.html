<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Graphe des théorèmes</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root { color-scheme: dark; --bg: #14171c; --panel: #1b1f26; --dark: #22262d; --line: #2b313b; --ink: #eef1f5; --muted: #9aa4b2; --accent: #f2c14e; --light: #eceff3; --lightink: #3a404b; --pink: #ee5c85; --orange: #f29a4a; --green: #52c98f; --blue: #5aa9e6; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 17px; margin: 0 10px 0 0; font-weight: 700; letter-spacing: 0.1px; }
  header .sub { font-size: 12px; color: var(--muted); margin-right: 10px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  input[type=text], select { background: #11141a; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font: 500 12px var(--sans); }
  input[type=text]:focus, select:focus { outline: none; border-color: #4a5668; }
  input[type=file] { font-size: 11px; color: var(--muted); max-width: 180px; }
  button { background: #2a303a; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; font: 600 12px var(--sans); cursor: pointer; }
  button:hover { background: #343c49; }
  .ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .ctl input { accent-color: var(--pink); }
  main { flex: 1; display: flex; min-height: 0; }
  #cy { flex: 1; min-width: 0; background: radial-gradient(ellipse at 50% 40%, #1a1f27 0%, #0f1216 100%); }
  aside { width: 440px; max-width: 52%; overflow-y: auto; padding: 0; background: var(--light); border-left: 1px solid var(--line); font-size: 15px; line-height: 1.6; color: var(--lightink); }
  aside::-webkit-scrollbar { width: 9px; }
  aside::-webkit-scrollbar-thumb { background: #b9c0cb; border-radius: 9px; }

  /* Vignette : en-tête sombre, grande pastille colorée + symbole, étiquette, titre, thème */
  .vig { background: var(--dark); display: flex; gap: 20px; align-items: center; padding: 24px 22px; border-bottom: 1px solid #2d333d; position: sticky; top: 0; z-index: 2; }
  .vsym { flex: 0 0 auto; width: 104px; height: 104px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-style: italic; font-size: 76px; line-height: 1; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.18); box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
  .vtxt { min-width: 0; }
  .vtag { font-size: 13px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 4px; }
  .vig h2 { font-family: var(--sans); font-size: 26px; font-weight: 700; line-height: 1.12; margin: 0 0 8px; color: #fff; letter-spacing: -0.3px; overflow-wrap: anywhere; }
  .vdom { font-size: 17px; color: #a9b1bd; font-weight: 500; }
  .vdom::first-letter { text-transform: uppercase; }

  .body { padding: 22px 22px 30px; }
  .body h3 { font-size: 11.5px; margin: 24px 0 8px; color: #6b7482; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; }
  .statement { font-size: 16.5px; line-height: 1.65; color: #4a505b; margin: 0 0 14px; }
  .statement .katex { color: #2a2f38; }
  .rel { background: #fff; border: 1px solid #dde2e9; border-radius: 14px; padding: 12px 14px; margin: 12px 0; overflow-x: auto; font-size: 16px; color: #1f242c; }
  .rel .katex { color: #1f242c; }
  .card { background: #fff; border: 1px solid #dde2e9; border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .ce { background: #fff6e6; border: 1px solid #f0d49b; border-radius: 14px; padding: 11px 14px; margin: 10px 0; color: #5a4520; }
  .ce b { color: #b8741a; }
  .ce.ok { background: #eaf7ef; border-color: #b9e0c9; color: #2f5b43; }
  .ce.ok b { color: #2a8a57; }
  .note { color: #7b8492; font-size: 13.5px; margin: 10px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .chip { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #dfe4eb; color: #4a5260; border: 1px solid #cdd4de; }
  .mlink { text-decoration: none; color: #2f6cb3; border-color: #a9c8ea; background: #e6f0fb; }
  .mlink:hover { background: #d5e6f8; }
  .prop { background: #fff; border: 1px solid #dde2e9; border-radius: 14px; padding: 12px 14px; margin: 12px 0; overflow-x: auto; color: #1f242c; }
  .prop .katex { color: #1f242c; }
  aside ul { margin: 4px 0; padding: 0; list-style: none; }
  aside li { margin: 8px 0; padding: 9px 12px; background: #fff; border: 1px solid #e1e6ed; border-radius: 12px; font-size: 14px; line-height: 1.45; }
  aside li .op { color: var(--pink); font-weight: 700; padding: 0 5px; }
  aside li.antiitem .op { color: var(--orange); }
  aside li .th { color: #7b8492; }
  footer { padding: 7px 20px; background: var(--panel); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .leg { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #f8cbd8; display: inline-block; }
  .sw { width: 26px; height: 0; display: inline-block; border-top: 1px solid #fff; }
  .sw.dash { border-top-style: dashed; }
  @media (max-width: 800px) { main { flex-direction: column; } aside { width: 100%; max-width: 100%; height: 50%; } .vsym { width: 76px; height: 76px; font-size: 54px; border-radius: 16px; } .vig h2 { font-size: 21px; } }
</style>
</head>
<body>
<header>
  <h1>Graphe des théorèmes</h1>
  <span class="sub">nœud = ensemble · arête = théorème</span>
  <div class="controls">
    <input type="text" id="search" placeholder="Rechercher…"/>
    <select id="depth"></select>
    <select id="family"></select>
    <label class="ctl"><input type="checkbox" id="anti" checked/> contre-exemples</label>
    <button id="relayout">Réarranger</button>
    <input type="file" id="file" accept=".json,application/json" title="Charger un autre graphe"/>
  </div>
</header>
<main>
  <div id="cy"></div>
  <aside id="panel"></aside>
</main>
<footer>
  <span class="leg"><span class="dot"></span> cercle : ensemble (couleur = domaine)</span>
  <span class="leg"><span class="sw"></span> inclusion A ⊆ B</span>
  <span class="leg"><span class="sw dash"></span> contre-exemple A ⊄ B (couplable)</span>
  <span class="leg">taille du cercle ∝ arêtes qui y arrivent</span>
</footer>
<script>
var GRAPH_EMBEDDED = {"meta":{"name":"Graphe des théorèmes","version":"0.7.0","created":"2026-11-23","language":"fr","description":"Chaque nœud est un ensemble (de fonctions, d'entiers, de matrices…), chaque arête est un théorème : inclusion (A ⊆ B) ou non-inclusion avec contre-exemple (A ⊄ B).","colorCode":{"analyse réelle":"rose pastel","arithmétique":"orange pastel","algèbre générale":"jaune orangé","algèbre linéaire":"vert pastel","théorie des ensembles":"bleu clair","analyse complexe":"marron pastel","topologie":"mauve pastel","théorie algébrique des nombres":"bleu canard foncé","algèbre bilinéaire":"vert foncé","théorie de la mesure":"rose fuchsia","géométrie euclidienne":"jaune pastel","théorie des langages":"cyan","théorie des corps":"or","topologie métrique":"violet clair","topologie vectorielle":"violet","analyse des suites réelles":"saumon","topologie algébrique":"bleu marine","topologie différentielle":"turquoise","théorie des graphes":"cyan foncé","théorie des groupes":"beige","théorie des ordres":"marine ardoise","analyse des équations différentielles":"orange foncé","analyse de séries":"bordeaux clair"},"semantics":{"node":"un ensemble, nommé précisément (ex. : Fonctions réelles continues)","inclusion":"arête blanche fine A → B : le théorème affirme A ⊆ B","anti":"arête pointillée : A ⊄ B, prouvé par un contre-exemple explicite","nodeSize":"taille du cercle = 46 + 9 par arête qui y arrive (plafond 170) ; le texte s'adapte (retour à la ligne, police réduite) et le cercle ne grandit (jusqu'à ×1,8) que si le texte ne rentre pas autrement","depth":["définitoire","immédiat","facile","classique","fondamental","profond"],"notes":"Le type « équivalence » est prévu par le format mais aucune arête d'équivalence n'est encore tracée : la logique des équivalences sera établie par Mathis."}},"nodes":[{"id":"C","label":"Fonctions réelles continues","family":"continuité","domain":"analyse réelle","property":"\\{\\, f : \\mathbb{R} \\to \\mathbb{R} \\mid f \\text{ continue en tout point de } \\mathbb{R} \\,\\}","description":"Les fonctions continues de ℝ dans ℝ.","example":"x ↦ x²","notes":"Nœud de départ du graphe."},{"id":"F","label":"Fonctions réelles","family":"univers","domain":"analyse réelle","property":"\\mathbb{R}^{\\mathbb{R}} = \\{\\, f : \\mathbb{R} \\to \\mathbb{R} \\,\\}","description":"Toutes les fonctions de ℝ dans ℝ : l'ensemble ambiant.","example":"x ↦ 1 si x ∈ ℚ, sinon 0 (fonction de Dirichlet)","notes":""},{"id":"FC","label":"Fonctions vectorielles continues","family":"continuité","domain":"topologie vectorielle","property":"\\{\\, f : (E, \\|\\cdot\\|_E) \\to (F, \\|\\cdot\\|_F) \\mid f \\text{ continue}, \\ E, F \\text{ espaces vectoriels normés} \\,\\}","description":"Les fonctions continues entre espaces vectoriels normés.","example":"x ↦ ‖x‖, de ℝ³ dans ℝ","notes":"Renommé depuis « Fonctions continues » en v0.5.0 ; « Fonctions métriques continues » en est le pendant entre espaces métriques."},{"id":"UC","label":"Fonctions uniformément continues","family":"continuité","domain":"analyse réelle","property":"\\{\\, f : \\forall \\varepsilon > 0,\\ \\exists \\delta > 0,\\ \\forall x, y : |x - y| < \\delta \\Rightarrow |f(x) - f(y)| < \\varepsilon \\,\\}","description":"Fonctions uniformément continues sur ℝ tout entier.","example":"x ↦ x","notes":""},{"id":"L","label":"Fonctions lipschitziennes","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : \\exists k \\ge 0,\\ \\forall x, y : |f(x) - f(y)| \\le k\\,|x - y| \\,\\}","description":"Fonctions k-lipschitziennes sur ℝ.","example":"x ↦ |x| (constante 1)","notes":""},{"id":"DBR","label":"Fonctions dérivables à dérivée bornée","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f \\text{ dérivable sur } \\mathbb{R} \\text{ et } f' \\text{ bornée} \\,\\}","description":"Fonctions dérivées partout avec une dérivée bornée sur ℝ.","example":"x ↦ sin(x)","notes":""},{"id":"D","label":"Fonctions dérivables","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : \\forall a \\in \\mathbb{R},\\ f'(a) = \\lim_{x \\to a} \\frac{f(x) - f(a)}{x - a} \\text{ existe} \\,\\}","description":"Fonctions dérivables en tout point de ℝ.","example":"x ↦ x³","notes":""},{"id":"DEC","label":"Dérivables sauf sur un dénombrable","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : \\{ x : f \\text{ non dérivable en } x \\} \\text{ est au plus dénombrable} \\,\\}","description":"Fonctions dérivables sauf sur un ensemble au plus dénombrable de points.","example":"x ↦ |x| (un seul point de non-dérivabilité)","notes":""},{"id":"DER","label":"Fonctions dérivées","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, g : \\exists f \\text{ dérivable},\\ g = f' \\,\\}","description":"Les fonctions qui sont la dérivée d'une fonction dérivable.","example":"x ↦ x (dérivée de x ↦ x²/2)","notes":"Ensemble construit à partir des fonctions dérivables par l'opérateur f ↦ f'. Contient des fonctions discontinues."},{"id":"C1","label":"Fonctions de classe C¹","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f \\text{ dérivable, de dérivée continue} \\,\\}","description":"Fonctions de classe C¹.","example":"x ↦ sin(x)","notes":""},{"id":"P","label":"Fonctions polynomiales","family":"dérivabilité","domain":"analyse réelle","property":"\\mathbb{R}[X] = \\{\\, f : f(x) = a_n x^n + \\cdots + a_1 x + a_0 \\,\\}","description":"Les fonctions polynomiales.","example":"x ↦ x²","notes":"Même C^∞ et analytiques."},{"id":"AFF","label":"Fonctions affines","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, x \\mapsto ax + b : a, b \\in \\mathbb{R} \\,\\}","description":"Les fonctions affines.","example":"x ↦ 2x + 3","notes":""},{"id":"M","label":"Fonctions monotones","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f : f \\text{ croissante sur } \\mathbb{R} \\text{ ou décroissante sur } \\mathbb{R} \\,\\}","description":"Fonctions monotones sur ℝ.","example":"x ↦ x","notes":""},{"id":"CNV","label":"Fonctions convexes","family":"continuité","domain":"analyse réelle","property":"\\{\\, f : \\forall x, y,\\ \\forall t \\in [0,1] : f(tx + (1-t)y) \\le t f(x) + (1-t) f(y) \\,\\}","description":"Fonctions convexes sur ℝ.","example":"x ↦ eˣ","notes":""},{"id":"B","label":"Fonctions réelles bornées","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f : \\exists M,\\ \\forall x \\in \\mathbb{R} : |f(x)| \\le M \\,\\}","description":"Fonctions bornées sur ℝ tout entier.","example":"x ↦ sin(x)","notes":""},{"id":"MB","label":"Fonctions monotones et bornées","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f \\text{ monotone et bornée sur } \\mathbb{R} \\,\\}","description":"Ensemble-construit : intersection des monotones et des bornées.","example":"x ↦ arctan(x)","notes":"Nœud construit à partir de deux autres ensembles."},{"id":"LIM","label":"Fonctions à limites finies en ±∞","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f : \\lim_{x \\to +\\infty} f(x) \\text{ et } \\lim_{x \\to -\\infty} f(x) \\text{ existent et sont finies} \\,\\}","description":"Fonctions admettant des limites finies aux deux infinis.","example":"x ↦ arctan(x)","notes":""},{"id":"IVP","label":"Fonctions de Darboux","family":"valeurs","domain":"analyse réelle","property":"\\{\\, f : f(I) \\text{ est un intervalle pour tout intervalle } I \\,\\}","description":"Les fonctions qui prennent toutes les valeurs intermédiaires.","example":"x ↦ sin(1/x) (f(0) = 0)","notes":""},{"id":"CARDE","label":"Fonctions à discontinuités dénombrables","family":"intégrabilité","domain":"analyse réelle","property":"\\{\\, f : \\{ x : f \\text{ discontinue en } x \\} \\text{ est au plus dénombrable} \\,\\}","description":"Fonctions discontinues seulement en un nombre au plus dénombrable de points.","example":"x ↦ 1_{x>0} (échelon d'Heaviside)","notes":""},{"id":"PC","label":"Fonctions continues par morceaux","family":"intégrabilité","domain":"analyse réelle","property":"\\{\\, f : \\text{sur chaque segment, un nombre fini de discontinuités de première espèce} \\,\\}","description":"Fonctions continues par morceaux sur chaque segment.","example":"x ↦ 1_{x>0}","notes":""},{"id":"RSEG","label":"Fonctions Riemann-intégrables sur tout segment","family":"intégrabilité","domain":"analyse réelle","property":"\\{\\, f : \\forall [a, b] \\subset \\mathbb{R},\\ f \\text{ Riemann-intégrable sur } [a, b] \\,\\}","description":"Fonctions Riemann-intégrables sur chaque segment.","example":"x ↦ 1_{x>0}","notes":""},{"id":"MAT","label":"Matrices à coefficients réels","family":"linéarité","domain":"algèbre linéaire","property":"\\bigcup_{n \\in \\mathbb{N}^{*}} \\mathcal{M}_n(\\mathbb{R})","description":"Les matrices carrées à coefficients réels, toutes tailles. Une matrice est en particulier une fonction réelle d'ensemble de définition fini.","example":"la matrice identité I₂","notes":"Nœud de test : code couleur algèbre linéaire (vert pastel), relié par un théorème de théorie des ensembles à un ensemble d'analyse réelle."},{"id":"TC","label":"Fonctions topologiquement continues","family":"continuité","domain":"topologie","property":"\\{\\, f : (X, \\mathcal{T}_X) \\to (Y, \\mathcal{T}_Y) \\mid f^{-1}(O) \\in \\mathcal{T}_X \\ \\text{ pour tout ouvert } O \\in \\mathcal{T}_Y \\,\\}","description":"Les fonctions continues entre espaces topologiques quelconques : l'image réciproque de tout ouvert est un ouvert.","example":"l'identité d'un espace topologique dans lui-même","notes":"Nœud de test du code couleur topologie (mauve)."},{"id":"A1","label":"Entiers naturels non nuls","family":"arithmétique","domain":"arithmétique","property":"\\mathbb{N}^{*}","description":"Les entiers strictement positifs : l'ensemble ambiant des nœuds arithmétiques.","example":"12","notes":""},{"id":"A2","label":"Nombres premiers","family":"arithmétique","domain":"arithmétique","property":"\\{\\, p \\in \\mathbb{N}^{*} : p \\ge 2 \\text{ et } \\forall d \\in \\mathbb{N}^{*},\\ d \\mid p \\Rightarrow d \\in \\{1, p\\} \\,\\}","description":"Entiers au moins égaux à 2 dont les seuls diviseurs positifs sont 1 et eux-mêmes.","example":"7","notes":""},{"id":"A3","label":"Carrés parfaits","family":"arithmétique","domain":"arithmétique","property":"\\{\\, n \\in \\mathbb{N}^{*} : \\exists k \\in \\mathbb{N}^{*},\\ n = k^{2} \\,\\}","description":"Entiers qui sont le carré d'un entier.","example":"9 = 3²","notes":""},{"id":"A4","label":"Entiers pairs","family":"congruences","domain":"arithmétique","property":"\\{\\, n \\in \\mathbb{N}^{*} : \\exists k \\in \\mathbb{N},\\ n = 2k \\,\\}","description":"Entiers divisibles par 2.","example":"10","notes":""},{"id":"A5","label":"Entiers sans facteur carré","family":"factorisation","domain":"arithmétique","property":"\\{\\, n \\in \\mathbb{N}^{*} : \\forall p \\text{ premier},\\ p^{2} \\nmid n \\,\\}","description":"Entiers non divisibles par le carré d'un nombre premier.","example":"30 = 2·3·5","notes":""},{"id":"A6","label":"Nombres triangulaires","family":"combinatoire","domain":"arithmétique","property":"\\{\\, n \\in \\mathbb{N}^{*} : \\exists m \\in \\mathbb{N}^{*},\\ n = \\dfrac{m(m+1)}{2} \\,\\}","description":"Entiers de la forme m(m+1)/2 avec m au moins égal à 1 : 1, 3, 6, 10, …","example":"28 = 7·8/2","notes":""},{"id":"A7","label":"Nombres parfaits pairs","family":"diviseurs","domain":"arithmétique","property":"\\{\\, n \\in \\mathbb{N}^{*} : n \\text{ pair et } \\sigma(n) = 2n \\,\\}, \\quad \\sigma(n) = \\sum_{d \\mid n} d","description":"Entiers pairs dont la somme des diviseurs positifs vaut le double.","example":"6 (diviseurs 1, 2, 3, 6, somme 12)","notes":"6 est le plus petit nombre parfait."},{"id":"A8","label":"Formes d'Euclide-Euler","family":"diviseurs","domain":"arithmétique","property":"\\{\\, 2^{p-1}(2^{p}-1) : p \\text{ premier} \\,\\}","description":"Entiers de la forme 2^(p−1)(2^p−1) avec p premier, sans exiger que 2^p − 1 soit premier.","example":"6 (p = 2) ; 2^10·2047 (p = 11)","notes":"Le sous-ensemble où 2^p − 1 est premier (nombres de Mersenne) n'est pas utilisé ici."},{"id":"A9","label":"Entiers impairs","family":"congruences","domain":"arithmétique","property":"\\{\\, n \\in \\mathbb{N}^{*} : \\exists k \\in \\mathbb{N},\\ n = 2k+1 \\,\\}","description":"Entiers non divisibles par 2 : le complémentaire de Entiers pairs dans ℕ*.","example":"9","notes":""},{"id":"L1","label":"Matrices carrées complexes (toutes tailles)","family":"matrices","domain":"algèbre linéaire","property":"\\bigcup_{n \\in \\mathbb{N}^{*}} \\mathcal{M}_n(\\mathbb{C})","description":"Univers des matrices carrées à coefficients complexes, toutes tailles n ≥ 1.","example":"I₂","notes":"Univers ℂ : les matrices réelles de MAT sont des matrices complexes particulières, non reliées ici."},{"id":"L2","label":"Matrices inversibles","family":"matrices","domain":"algèbre linéaire","property":"\\{\\, M \\in \\bigcup_{n \\ge 1} \\mathcal{M}_n(\\mathbb{C}) : \\det M \\neq 0 \\,\\}","description":"Matrices carrées complexes de déterminant non nul.","example":"3·I₂","notes":""},{"id":"L3","label":"Matrices singulières","family":"matrices","domain":"algèbre linéaire","property":"\\{\\, M \\in \\bigcup_{n \\ge 1} \\mathcal{M}_n(\\mathbb{C}) : \\det M = 0 \\,\\}","description":"Matrices carrées complexes non inversibles.","example":"diag(1, 0)","notes":""},{"id":"L4","label":"Matrices nilpotentes","family":"matrices","domain":"algèbre linéaire","property":"\\{\\, M : \\exists k \\ge 1,\\ M^{k} = 0 \\,\\}","description":"Matrices carrées complexes dont une puissance est nulle.","example":"[[0,1],[0,0]]","notes":""},{"id":"L5","label":"Matrices diagonalisables","family":"matrices","domain":"algèbre linéaire","property":"\\{\\, M : \\exists P \\in \\mathrm{GL}_n(\\mathbb{C}),\\ P^{-1} M P \\text{ diagonale} \\,\\}","description":"Matrices complexes semblables à une matrice diagonale.","example":"diag(2, 1)","notes":""},{"id":"L6","label":"Matrices normales","family":"matrices","domain":"algèbre linéaire","property":"\\{\\, M : M M^{*} = M^{*} M \\,\\}  \\quad (M^{*} = \\overline{M}^{\\mathsf{T}})","description":"Matrices complexes commutant avec leur adjointe.","example":"[[0,-1],[1,0]]","notes":""},{"id":"L7","label":"Matrices hermitiennes","family":"matrices","domain":"algèbre linéaire","property":"\\{\\, M : M^{*} = M \\,\\}","description":"Matrices complexes égales à leur adjointe.","example":"[[2,1],[1,2]]","notes":""},{"id":"L8","label":"Matrices unitaires","family":"matrices","domain":"algèbre linéaire","property":"\\{\\, M : M^{*} M = I_n \\,\\}","description":"Matrices complexes dont l'inverse est l'adjointe.","example":"diag(i, 1)","notes":""},{"id":"L9","label":"Matrices idempotentes","family":"matrices","domain":"algèbre linéaire","property":"\\{\\, M : M^{2} = M \\,\\}","description":"Matrices carrées complexes égales à leur carré (projecteurs).","example":"diag(1, 0)","notes":""},{"id":"L10","label":"Matrices involutives","family":"matrices","domain":"algèbre linéaire","property":"\\{\\, M : M^{2} = I_n \\,\\}","description":"Matrices carrées complexes égales à leur propre inverse.","example":"[[1,1],[0,-1]]","notes":""},{"id":"D1","label":"Fonctions de classe C²","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : f \\text{ dérivable deux fois sur } \\mathbb{R},\\ f'' \\text{ continue sur } \\mathbb{R} \\,\\}","description":"Fonctions deux fois dérivables sur ℝ, de dérivée seconde continue.","example":"x ↦ x³","notes":""},{"id":"D2","label":"Fonctions de classe C^∞","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : f \\text{ admet des dérivées de tout ordre sur } \\mathbb{R} \\,\\}","description":"Fonctions admettant des dérivées de tout ordre sur ℝ.","example":"x ↦ eˣ","notes":""},{"id":"D3","label":"Fonctions analytiques réelles","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : \\forall a \\in \\mathbb{R},\\ \\exists r > 0,\\ \\exists (a_n),\\ f(x) = \\sum_{n \\ge 0} a_n (x-a)^n \\text{ pour } |x-a| < r \\,\\}","description":"Fonctions égales, au voisinage de chaque point, à la somme d'une série entière réelle.","example":"x ↦ sin(x)","notes":""},{"id":"D4","label":"Fonctions convexes dérivables","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : f \\text{ convexe et dérivable sur } \\mathbb{R} \\,\\}","description":"Ensemble construit : intersection des fonctions convexes et des fonctions dérivables.","example":"x ↦ x²","notes":"Ensemble-construit (intersection)."},{"id":"D5","label":"Fonctions à dérivée strictement positive","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f \\text{ dérivable sur } \\mathbb{R} \\text{ et } f' > 0 \\text{ sur } \\mathbb{R} \\,\\}","description":"Fonctions dérivables sur ℝ dont la dérivée est partout strictement positive.","example":"x ↦ eˣ","notes":""},{"id":"D6","label":"Fonctions strictement croissantes","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f : \\forall x < y,\\ f(x) < f(y) \\,\\}","description":"Fonctions strictement croissantes sur ℝ.","example":"x ↦ x³","notes":""},{"id":"D7","label":"Fonctions constantes","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, x \\mapsto c : c \\in \\mathbb{R} \\,\\}","description":"Fonctions constantes sur ℝ.","example":"x ↦ 5","notes":""},{"id":"D9","label":"Solutions de y' = y","family":"équations différentielles","domain":"analyse des équations différentielles","property":"\\{\\, x \\mapsto C e^{x} : C \\in \\mathbb{R} \\,\\}","description":"Solutions sur ℝ de l'équation différentielle linéaire y' = y.","example":"x ↦ 2eˣ","notes":"Domaine déplacé depuis analyse réelle en v0.7.0."},{"id":"D10","label":"Solutions de y'' + y = 0","family":"équations différentielles","domain":"analyse des équations différentielles","property":"\\{\\, x \\mapsto \\alpha \\cos x + \\beta \\sin x : \\alpha, \\beta \\in \\mathbb{R} \\,\\}","description":"Solutions sur ℝ de l'équation différentielle linéaire y'' + y = 0.","example":"x ↦ cos(x)","notes":"Domaine déplacé depuis analyse réelle en v0.7.0."},{"id":"X2","label":"Fonctions entières","family":"holomorphie","domain":"analyse complexe","property":"\\{\\, f : \\mathbb{C} \\to \\mathbb{C} \\mid f \\text{ dérivable au sens complexe en tout } z \\in \\mathbb{C} \\,\\}","description":"Fonctions holomorphes sur tout ℂ.","example":"z ↦ eᶻ","notes":""},{"id":"X3","label":"Polynômes complexes","family":"holomorphie","domain":"analyse complexe","property":"\\{\\, f : \\mathbb{C} \\to \\mathbb{C} \\mid f(z) = a_n z^{n} + \\cdots + a_1 z + a_0,\\ a_i \\in \\mathbb{C} \\,\\}","description":"Fonctions polynomiales à coefficients complexes.","example":"z ↦ z²","notes":""},{"id":"X4","label":"Fonctions affines complexes","family":"holomorphie","domain":"analyse complexe","property":"\\{\\, z \\mapsto az + b : a, b \\in \\mathbb{C} \\,\\}","description":"Fonctions de la forme z ↦ az + b.","example":"z ↦ iz + 1","notes":""},{"id":"X5","label":"Fonctions constantes complexes","family":"holomorphie","domain":"analyse complexe","property":"\\{\\, z \\mapsto c : c \\in \\mathbb{C} \\,\\}","description":"Fonctions constantes sur ℂ.","example":"z ↦ 2 + i","notes":""},{"id":"X6","label":"Fonctions continues ℂ → ℂ","family":"régularité réelle","domain":"analyse complexe","property":"\\{\\, f : \\mathbb{C} \\to \\mathbb{C} \\mid f \\text{ continue en tout point} \\,\\}","description":"Fonctions continues sur ℂ.","example":"z ↦ |z|","notes":""},{"id":"X7","label":"Fonctions C¹ au sens réel","family":"régularité réelle","domain":"analyse complexe","property":"\\{\\, f : \\mathbb{C} \\to \\mathbb{C} \\mid f \\text{ différentiable au sens réel, à différentielle continue} \\,\\}","description":"Fonctions de classe C¹ en tant que fonctions de deux variables réelles.","example":"z ↦ z̄","notes":"z̄ désigne le conjugué."},{"id":"X8","label":"Fonctions bornées ℂ → ℂ","family":"régularité réelle","domain":"analyse complexe","property":"\\{\\, f : \\mathbb{C} \\to \\mathbb{C} \\mid \\exists M \\ge 0,\\ \\forall z \\in \\mathbb{C},\\ |f(z)| \\le M \\,\\}","description":"Fonctions dont le module est majoré sur ℂ.","example":"z ↦ 1/(1+|z|²)","notes":""},{"id":"X9","label":"Fonctions entières bornées","family":"holomorphie","domain":"analyse complexe","property":"\\{\\, f : f \\text{ entière et bornée sur } \\mathbb{C} \\,\\}","description":"Ensemble construit : intersection des fonctions entières et des fonctions bornées.","example":"z ↦ 3","notes":"Ensemble-construit (intersection)."},{"id":"IQ","label":"Irrationnels quadratiques","family":"nombres réels","domain":"théorie algébrique des nombres","property":"\\{\\, x \\in \\mathbb{R} \\setminus \\mathbb{Q} \\mid \\exists (a, b, c) \\in \\mathbb{Z}^{3}, a \\neq 0, a x^{2} + b x + c = 0 \\,\\}","description":"Les irrationnels algébriques de degré 2 : racines d'un trinôme à coefficients entiers, comme la racine carrée d'un entier qui n'est pas un carré.","example":"√2","notes":""},{"id":"FCP","label":"Réels à fraction continue périodique","family":"nombres réels","domain":"théorie algébrique des nombres","property":"\\{\\, x \\in \\mathbb{R} \\setminus \\mathbb{Q} \\mid \\text{les quotients partiels de } x \\text{ forment une suite périodique à partir d'un certain rang} \\,\\}","description":"Réels dont le développement en fraction continue devient périodique à partir d'un certain rang.","example":"φ = (1+√5)/2 = [1 ; 1, 1, 1, …]","notes":""},{"id":"S4","label":"Sommes de quatre carrés","family":"arithmétique","domain":"arithmétique","property":"\\{\\, p^{2} + q^{2} + r^{2} + s^{2} \\mid p, q, r, s \\in \\mathbb{N} \\,\\}","description":"Entiers qui s'écrivent comme somme de quatre carrés d'entiers naturels (0 compris).","example":"7 = 4 + 1 + 1 + 1","notes":""},{"id":"LIO","label":"Nombres de Liouville","family":"nombres réels","domain":"arithmétique","property":"\\{\\, x \\in \\mathbb{R} \\mid \\forall n \\in \\mathbb{N}^{*}, \\ \\exists \\frac{p}{q} \\in \\mathbb{Q}, \\ 0 < \\left| x - \\frac{p}{q} \\right| < \\frac{1}{q^{n}} \\,\\}","description":"Réels approchables par des rationnels à tous les ordres : pour tout n, il existe un rationnel p/q, différent de x, avec |x − p/q| < 1/qⁿ. Un tel x est forcément irrationnel.","example":"L = 10⁻¹ + 10⁻² + 10⁻⁶ + 10⁻²⁴ + …","notes":""},{"id":"TRS","label":"Nombres transcendants","family":"nombres réels","domain":"arithmétique","property":"\\{\\, x \\in \\mathbb{R} \\mid P(x) \\neq 0 \\text{ pour tout } P \\in \\mathbb{Z}[X] \\setminus \\{0\\} \\,\\}","description":"Réels qui ne sont racine d'aucun polynôme non nul à coefficients entiers. Les algébriques (ceux qui le sont) forment un ensemble dénombrable.","example":"e, π","notes":""},{"id":"TQ1","label":"Formes ternaires résolubles","family":"triplets d'entiers","domain":"théorie algébrique des nombres","property":"\\{\\, (a, b, c) \\mid a > 0, \\ b < 0, \\ c < 0, \\ \\text{sans facteur carré, premiers entre eux deux à deux, et } a x^{2} + b y^{2} + c z^{2} = 0 \\text{ admet une solution non triviale dans } \\mathbb{Z}^{3} \\,\\}","description":"Triplets de Legendre : l'équation diophantienne ax² + by² + cz² = 0 admet une solution non triviale.","example":"(1, −1, −1) : 25 = 9 + 16, solution (5, 3, 4)","notes":""},{"id":"TQ2","label":"Triplets à conditions de résidus","family":"triplets d'entiers","domain":"théorie algébrique des nombres","property":"\\{\\, (a, b, c) \\mid a > 0, \\ b < 0, \\ c < 0, \\ \\text{sans facteur carré, premiers entre eux deux à deux, et } -ab \\text{ carré modulo } c, \\ -bc \\text{ modulo } a, \\ -ca \\text{ modulo } b \\,\\}","description":"Triplets tels que l'opposé de ab est un carré modulo c, l'opposé de bc modulo a et l'opposé de ca modulo b.","example":"(1, −1, −1) : les trois conditions sont triviales","notes":""},{"id":"LU1","label":"Couples dominés chiffre à chiffre","family":"couples d'entiers","domain":"arithmétique","property":"\\{\\, (n, k) \\in \\mathbb{N}^{2} \\mid \\text{chaque chiffre de } k \\text{ en base } p \\text{ est inférieur ou égal au chiffre correspondant de } n \\,\\}","description":"Pour un nombre premier p fixé : couples (n, k) tels qu'aucun chiffre de k écrit en base p ne dépasse le chiffre de n de même rang.","example":"p = 3, n = 5 (soit « 12 » en base 3), k = 2 (soit « 02 »)","notes":""},{"id":"LU2","label":"Binômes non divisibles par p","family":"couples d'entiers","domain":"arithmétique","property":"\\{\\, (n, k) \\in \\mathbb{N}^{2} \\mid p \\text{ ne divise pas } \\binom{n}{k} \\,\\}","description":"Couples (n, k), k ≤ n, dont le coefficient binomial n'est pas divisible par le nombre premier p fixé.","example":"p = 3, (5, 2) : C(5, 2) = 10, non divisible par 3","notes":""},{"id":"LL1","label":"Nombres de Mersenne premiers","family":"arithmétique","domain":"arithmétique","property":"\\{\\, 2^{p} - 1 \\mid p \\text{ premier et } 2^{p} - 1 \\text{ premier} \\,\\}","description":"Nombres de Mersenne premiers : M_p = 2^p − 1 avec p et M_p tous deux premiers.","example":"M₁₃ = 8191","notes":""},{"id":"LL2","label":"Mersenne validés par Lucas–Lehmer","family":"arithmétique","domain":"arithmétique","property":"\\{\\, 2^{p} - 1 \\mid p \\text{ premier}, \\ s_{p-2} \\equiv 0 \\ \\text{(mod } 2^{p} - 1\\text{)} \\,\\}","description":"Nombres de Mersenne qui divisent le terme de rang p−2 de la suite récurrente partant de 4 et passant de s à s² − 2 (suite de Lucas–Lehmer).","example":"M₃ = 7 : la suite vaut 4 puis 14 = 2 × 7","notes":""},{"id":"KOL","label":"Fonctions C² à normes bornées","family":"univers","domain":"analyse réelle","property":"\\{\\, f : \\mathbb{R} \\to \\mathbb{R} \\text{ de classe } C^{2} \\mid \\| f \\|_{\\infty} < \\infty \\text{ et } \\| f'' \\|_{\\infty} < \\infty \\,\\}","description":"Fonctions de classe C² sur ℝ dont f et f'' sont bornées. Aucune borne ne porte a priori sur f'.","example":"x ↦ cos(x)","notes":"Ensemble construit : intersection des fonctions C² et des fonctions à dérivée seconde bornée."},{"id":"LA1","label":"Fonctions holomorphes sur une couronne","family":"holomorphie","domain":"analyse complexe","property":"\\{\\, f : \\{ z \\in \\mathbb{C} \\mid r < |z - z_{0}| < R \\} \\to \\mathbb{C} \\mid f \\text{ holomorphe} \\,\\}","description":"Fonctions holomorphes sur une couronne fixée {z : r < |z − z₀| < R} (paramètres r, R et z₀ fixés, r < R).","example":"z ↦ 1/z sur la couronne 1 < |z| < 2","notes":""},{"id":"LA2","label":"Fonctions développables en série de Laurent","family":"holomorphie","domain":"analyse complexe","property":"\\{\\, f \\mid f(z) = \\sum_{n = -\\infty}^{+\\infty} a_{n} (z - z_{0})^{n} \\text{ converge partout sur } \\{ r < |z - z_{0}| < R \\} \\,\\}","description":"Fonctions somme d'une série de Laurent convergeant sur la couronne fixée.","example":"z ↦ 1/z : série de Laurent réduite au terme de rang −1","notes":""},{"id":"BM1","label":"Formes linéaires continues sur H","family":"espaces de Hilbert","domain":"algèbre bilinéaire","property":"\\{\\, \\ell : H \\to \\mathbb{R} \\mid \\ell \\text{ linéaire et continue} \\,\\}","description":"Formes linéaires continues sur l'espace de Hilbert fixé H, muni d'une forme bilinéaire a continue et coercive.","example":"y ↦ a(v, y) pour un v ∈ H fixé","notes":""},{"id":"BM2","label":"Fonctionnelles a(x₀, ·)","family":"espaces de Hilbert","domain":"algèbre bilinéaire","property":"\\{\\, y \\mapsto a(x_{0}, y) \\mid x_{0} \\in H \\,\\}","description":"Fonctionnelles obtenues en figeant la première variable de la forme bilinéaire coercive a : y ↦ a(x₀, y), x₀ parcourant H.","example":"y ↦ a(v, y)","notes":""},{"id":"ME1","label":"Fonctions à discontinuités de mesure nulle","family":"univers","domain":"théorie de la mesure","property":"\\{\\, f : \\mathbb{R} \\to \\mathbb{R} \\mid f \\text{ bornée sur tout segment et l'ensemble de ses points de discontinuité est de mesure nulle} \\,\\}","description":"Fonctions bornées sur tout segment dont l'ensemble des points de discontinuité est de mesure de Lebesgue nulle.","example":"l'indicatrice de [0, +∞), discontinue seulement en 0","notes":""},{"id":"ME2","label":"Fonctions mesurables sur le segment","family":"univers","domain":"théorie de la mesure","property":"\\{\\, f : [0, 1] \\to \\mathbb{R} \\mid f \\text{ mesurable au sens de Lebesgue et finie} \\,\\}","description":"Fonctions mesurables (au sens de Lebesgue) et finies sur le segment [0, 1].","example":"l'indicatrice des rationnels de [0, 1]","notes":""},{"id":"ME3","label":"Fonctions presque continues","family":"univers","domain":"théorie de la mesure","property":"\\{\\, f : [0, 1] \\to \\mathbb{R} \\mid \\forall \\varepsilon > 0, \\ \\exists F \\text{ fermé} \\subseteq [0, 1], \\ \\lambda([0, 1] \\setminus F) < \\varepsilon, \\ f|_{F} \\text{ continue} \\,\\}","description":"Fonctions continues après restriction à un fermé dont le complémentaire dans le segment a une mesure inférieure à ε pour tout ε > 0 : continues sur presque tout le segment.","example":"l'indicatrice des rationnels, continue sur un fermé de mesure presque totale évitant les rationnels","notes":""},{"id":"PR1","label":"Moyennes empiriques de variables iid","family":"probabilités","domain":"théorie de la mesure","property":"\\{\\, \\left( \\bar{X}_{n} \\right)_{n} \\mid \\bar{X}_{n} = \\frac{1}{n} \\sum_{k=1}^{n} X_{k}, \\ (X_{k}) \\text{ indépendantes, de même loi, } \\mathbb{E}|X_{1}| < \\infty \\,\\}","description":"Suites de moyennes empiriques de variables aléatoires réelles indépendantes et identiquement distribuées, intégrables.","example":"la fréquence moyenne de « pile » dans une suite de lancers équilibrés","notes":""},{"id":"PR2","label":"Suites convergeant presque sûrement","family":"probabilités","domain":"théorie de la mesure","property":"\\{\\, (Y_{n}) \\mid \\exists Y, \\ Y_{n} \\to Y \\text{ presque sûrement} \\,\\}","description":"Suites de variables aléatoires convergeant presque sûrement : en dehors d'un événement de probabilité nulle.","example":"une suite constante (Y_n = Y pour tout n)","notes":""},{"id":"PR3","label":"Suites convergeant en probabilité","family":"probabilités","domain":"théorie de la mesure","property":"\\{\\, (Y_{n}) \\mid \\exists Y, \\ \\forall \\varepsilon > 0, \\ \\mathbb{P}(|Y_{n} - Y| > \\varepsilon) \\to 0 \\,\\}","description":"Suites de variables aléatoires convergeant en probabilité.","example":"Y_n valant 1 avec probabilité 1/n et 0 sinon : Y_n tend vers 0 en probabilité","notes":""},{"id":"SG1","label":"Sous-groupes résolubles connexes","family":"groupes de matrices","domain":"algèbre linéaire","property":"\\{\\, G \\subseteq GL_{n}(\\mathbb{C}) \\mid G \\text{ sous-groupe résoluble et connexe} \\,\\}","description":"Sous-groupes du groupe linéaire GL_n(ℂ) (n fixé) qui sont résolubles (dérivée itérée réduite au neutre) et connexes.","example":"les matrices triangulaires supérieures inversibles","notes":""},{"id":"SG2","label":"Ensembles simultanément trigonalisables","family":"groupes de matrices","domain":"algèbre linéaire","property":"\\{\\, G \\subseteq GL_{n}(\\mathbb{C}) \\mid \\exists P, \\ P M P^{-1} \\text{ triangulaire supérieure pour tout } M \\in G \\,\\}","description":"Ensembles de matrices inversibles trigonalisables dans une même base.","example":"les matrices diagonales inversibles (P = identité)","notes":""},{"id":"KP1","label":"Espaces compacts","family":"espaces topologiques","domain":"topologie","property":"\\{\\, X \\mid X \\text{ espace topologique compact} \\,\\}","description":"Espaces topologiques compacts : tout recouvrement ouvert admet un sous-recouvrement fini.","example":"le segment [0, 1] (théorème de Heine–Borel)","notes":""},{"id":"KP2","label":"Espaces à projection fermée","family":"espaces topologiques","domain":"topologie","property":"\\{\\, X \\mid \\text{la projection } X \\times Y \to Y \\text{ est fermée pour tout espace topologique } Y \\,\\}","description":"Espaces X tels que la projection X × Y → Y envoie les fermés sur des fermés, quel que soit l'espace Y.","example":"tout espace compact (théorème de Kuratowski)","notes":""},{"id":"GR1","label":"Sous-groupes d'un groupe fini","family":"groupes finis","domain":"algèbre générale","property":"\\{\\, H \\subseteq G \\mid H \\text{ sous-groupe du groupe fini fixé } (G, \\cdot) \\,\\}","description":"Les sous-groupes du groupe fini fixé G.","example":"dans (ℤ/6ℤ, +), le sous-groupe {0, 3}","notes":""},{"id":"GR2","label":"Parties de cardinal divisant l'ordre","family":"groupes finis","domain":"algèbre générale","property":"\\{\\, P \\subseteq G \\mid |P| \\text{ divise } |G| \\,\\}","description":"Parties du groupe fini fixé G dont le cardinal divise l'ordre de G.","example":"dans (ℤ/6ℤ, +), la partie {1, 2} de cardinal 2","notes":""},{"id":"IN1","label":"Fonctions sur n points fixés","family":"univers","domain":"algèbre générale","property":"\\{\\, f : \\{ x_{1}, \\ldots, x_{n} \\} \\to \\mathbb{R} \\,\\}","description":"Toutes les fonctions définies sur l'ensemble fixé de n réels distincts {x₁, …, xₙ} (n et les xᵢ fixés).","example":"une table de n valeurs réelles","notes":""},{"id":"IN2","label":"Restrictions de polynômes de degré au plus n−1","family":"univers","domain":"algèbre générale","property":"\\{\\, f : \\{ x_{1}, \\ldots, x_{n} \\} \\to \\mathbb{R} \\mid \\exists P \\in \\mathbb{R}[X], \\ \\deg P \\le n - 1, \\ \\forall i, \\ f(x_{i}) = P(x_{i}) \\,\\}","description":"Fonctions sur les n points fixés qui coïncident avec un polynôme de degré au plus n − 1 évalué sur ces points.","example":"les valeurs prises par 1 − x + x² aux cinq points fixés","notes":""},{"id":"LR1","label":"Racines à coefficients imposés","family":"polynômes","domain":"analyse réelle","property":"\\{\\, x \\in \\mathbb{R} \\mid x \\text{ racine d'un polynôme unitaire réel de degré } n \\text{ à } n \\text{ racines réelles, avec } a_{n-1} \\text{ et } a_{n-2} \\text{ fixés} \\,\\}","description":"Union des racines des polynômes unitaires réels de degré n (fixé) ayant n racines réelles, dont les coefficients de degré n−1 et n−2 sont fixés (les autres libres).","example":"n = 2, coefficients 0 et −1 : le polynôme x² − 1, racines ±1","notes":""},{"id":"LR2","label":"Segment de Laguerre","family":"polynômes","domain":"analyse réelle","property":"[u, v], \\text{ où } u \\text{ et } v \\text{ sont les racines du trinôme } n x^{2} + 2 a_{n-1} x + 2 (n-1) a_{n-2} - (n-2) a_{n-1}^{2}","description":"Le segment dont les extrémités sont les racines du trinôme de Laguerre construit sur les mêmes données (n et les deux coefficients fixés).","example":"n = 2, coefficients 0 et −1 : trinôme 2x² − 2, segment [−1, 1]","notes":""},{"id":"ZL1","label":"Zéros d'un polynôme fixé","family":"polynômes","domain":"analyse complexe","property":"\\{\\, z \\in \\mathbb{C} \\mid f(z) = 0 \\,\\}","description":"L'ensemble des zéros du polynôme unitaire fixé f, à coefficients complexes, de degré n.","example":"pour f = 1 + z + z² : les deux racines, de module 1","notes":""},{"id":"ZL2","label":"Extérieur du disque de Laguerre","family":"polynômes","domain":"analyse complexe","property":"\\{\\, z \\in \\mathbb{C} \\mid |z - z_{0}| > n \\left| \\frac{f(z_{0})}{f'(z_{0})} \\right| \\,\\}","description":"Le complémentaire du disque fermé centré en z₀ fixé (avec f '(z₀) non nul), de rayon n fois le rapport |f(z₀)/f '(z₀)|.","example":"f = 1 + z + z² et z₀ = 0 : l'extérieur du disque de rayon 2","notes":""},{"id":"GTR","label":"Triangles du plan","family":"triangles","domain":"géométrie euclidienne","property":"\\{\\, (A, B, C) \\in (\\mathbb{R}^2)^3 \\mid A, B, C \\text{ non alignés} \\,\\}","description":"Les triangles du plan euclidien : trois points non alignés.","example":"le triangle de sommets (0, 0), (1, 0) et (0, 1)","notes":""},{"id":"GAK","label":"Quadruplets vérifiant la loi d'Al-Kashi","family":"triangles","domain":"géométrie euclidienne","property":"\\{\\, (a, b, c, \\theta) \\in \\mathbb{R}^4 \\mid a^2 = b^2 + c^2 - 2bc\\cos(\\theta) \\,\\}","description":"Les quadruplets formés de trois côtés et d'un angle qui satisfont la relation d'Al-Kashi.","example":"a = 5, b = 4, c = 3 et un angle droit : 25 = 16 + 9","notes":""},{"id":"GIA","label":"Angles inscrits interceptant un arc donné","family":"cercles","domain":"géométrie euclidienne","property":"\\{\\, \\widehat{AMB} \\mid M \\in \\mathcal{C}, \\ \\widehat{AMB} \\text{ intercepte l'arc } AB \\,\\}","description":"Les angles inscrits dans le cercle fixé C, ouverts vers l'arc AB.","example":"tout angle de sommet sur le cercle, vu depuis l'arc AB","notes":""},{"id":"GIM","label":"Moitiés de l'angle au centre correspondant","family":"cercles","domain":"géométrie euclidienne","property":"\\{\\, \\text{angles mesurant } \\tfrac{1}{2}\\, \\widehat{AOB} \\mid O \\text{ centre de } \\mathcal{C} \\,\\}","description":"Les angles qui mesurent la moitié de l'angle au centre sous-tendant l'arc AB.","example":"45°, si l'angle au centre de l'arc AB vaut 90°","notes":""},{"id":"GCA","label":"Couples d'angles interceptant le même arc","family":"cercles","domain":"géométrie euclidienne","property":"\\{\\, (\\widehat{AOB}, \\widehat{AMB}) \\mid M \\in \\mathcal{C} \\,\\}","description":"Les couples (angle au centre, angle inscrit) d'un même cercle, interceptant le même arc.","example":"(90°, 45°) pour un même arc AB","notes":""},{"id":"GCD","label":"Couples dont l'un vaut le double de l'autre","family":"cercles","domain":"géométrie euclidienne","property":"\\{\\, (\\alpha, \\beta) \\in \\mathbb{R}^2 \\mid \\alpha = 2\\beta \\,\\}","description":"Les couples d'angles dont le premier vaut exactement le double du second.","example":"(90°, 45°)","notes":""},{"id":"GAR","label":"Lieux des points voyant [AB] sous un angle donné","family":"cercles","domain":"géométrie euclidienne","property":"\\{\\, E_\\alpha \\mid E_\\alpha = \\{\\, M \\in \\mathbb{R}^2 : \\widehat{AMB} = \\alpha \\,\\}, \\ 0 < \\alpha < \\pi \\,\\}","description":"Les ensembles de points du plan d'où l'on voit un segment fixé sous un angle donné.","example":"l'ensemble des points d'où l'on voit [AB] sous 45°","notes":""},{"id":"GAA","label":"Réunions de deux arcs de cercles passant par A et B","family":"cercles","domain":"géométrie euclidienne","property":"\\{\\, \\gamma_1 \\cup \\gamma_2 \\mid \\gamma_1, \\gamma_2 \\text{ arcs de cercles d'extrémités } A \\text{ et } B \\,\\}","description":"Les lieux qui s'écrivent comme réunion de deux arcs de cercles joignant A et B.","example":"les deux arcs symétriques d'où l'on voit [AB] sous un angle fixé","notes":""},{"id":"GAP","label":"Lieux à rapport de distances constant (k ≠ 1)","family":"cercles","domain":"géométrie euclidienne","property":"\\{\\, \\{\\, M \\in \\mathbb{R}^2 : \\tfrac{MA}{MB} = k \\,\\} \\mid k > 0, \\ k \\neq 1 \\,\\}","description":"Les lieux des points dont le rapport des distances à A et B vaut une constante différente de 1.","example":"les points deux fois plus proches de A que de B (k = 1/2)","notes":""},{"id":"CER","label":"Cercles du plan","family":"cercles","domain":"géométrie euclidienne","property":"\\{\\, \\mathcal{C}(O, r) \\mid O \\in \\mathbb{R}^2, \\ r > 0 \\,\\}","description":"Tous les cercles du plan euclidien : centre, rayon strictement positif.","example":"le cercle de centre (0, 0) et de rayon 1","notes":""},{"id":"GME","label":"Lieux à rapport de distances égal à 1","family":"droites","domain":"géométrie euclidienne","property":"\\{\\, \\{\\, M \\in \\mathbb{R}^2 : MA = MB \\,\\} \\mid A \\neq B \\,\\}","description":"Les lieux des points équidistants de deux points A et B : le cas k = 1 des lieux d'Apollonius.","example":"la médiatrice du segment [AB]","notes":"Cas limite du lieu d'Apollonius : pour k = 1, le lieu est une droite."},{"id":"LT1","label":"Solutions d'une équation de langage","family":"équations de langages","domain":"théorie des langages","property":"\\{\\, X \\subseteq \\Sigma^* \\mid X = X \\cdot A \\cup B, \\ \\varepsilon \\notin A \\,\\}","description":"Les langages solutions de l'équation X = XA ∪ B, pour des langages A (sans le mot vide) et B fixés.","example":"X = {b, ab, aab, …} pour A = {a} et B = {b}","notes":""},{"id":"LT2","label":"Langages de la forme BA*","family":"équations de langages","domain":"théorie des langages","property":"\\{\\, B \\cdot A^* \\mid A, B \\subseteq \\Sigma^*, \\ \\varepsilon \\notin A \\,\\}","description":"Les langages produit de B par l'étoile itérative de A, avec le mot vide hors de A.","example":"{b, ab, aab, …} = {b} · {a}*","notes":""},{"id":"KF1","label":"Corps à clôture algébrique finie","family":"clôture","domain":"théorie des corps","property":"\\{\\, K \\text{ corps} \\mid \\overline{K} \\text{ est une extension finie de } K \\,\\}","description":"Les corps dont la clôture algébrique est une extension de degré fini.","example":"ℝ : sa clôture algébrique ℂ est de degré 2","notes":""},{"id":"KF2","label":"Corps réels clos","family":"ordres","domain":"théorie des corps","property":"\\{\\, K \\text{ corps réel clos} \\,\\}","description":"Les corps réels clos : ordonnables, où tout élément positif est un carré et tout polynôme de degré impair a une racine.","example":"ℝ, et le corps des réels algébriques","notes":"Un corps réel clos n'admet qu'un seul ordre."},{"id":"KF3","label":"Corps formellement réels","family":"ordres","domain":"théorie des corps","property":"\\{\\, K \\text{ corps} \\mid -1 \\text{ n'est pas une somme de carrés dans } K \\,\\}","description":"Les corps formellement réels : −1 n'y est pas une somme (finie) de carrés.","example":"ℚ, ℝ, et tout corps ordonné","notes":""},{"id":"KF4","label":"Corps ordonnables","family":"ordres","domain":"théorie des corps","property":"\\{\\, K \\text{ corps} \\mid K \\text{ admet un ordre total compatible avec } + \\text{ et } \\times \\,\\}","description":"Les corps qui peuvent être munis d'un ordre total compatible avec l'addition et la multiplication.","example":"ℚ, muni de son ordre usuel","notes":""},{"id":"MT1","label":"Espaces métriques complets","family":"espaces métriques","domain":"topologie métrique","property":"\\{\\, (X, d) \\mid \\text{toutes les suites de Cauchy de } X \\text{ convergent dans } X \\,\\}","description":"Les espaces métriques complets : toutes leurs suites de Cauchy convergent.","example":"ℝ avec sa distance usuelle ; tout espace compact","notes":""},{"id":"MT2","label":"Espaces de Baire","family":"espaces de Baire","domain":"topologie","property":"\\{\\, X \\mid \\text{toute intersection dénombrable d'ouverts denses est dense dans } X \\,\\}","description":"Les espaces de Baire : toute intersection dénombrable d'ouverts denses y est dense.","example":"ℝ ; tout espace localement compact","notes":""},{"id":"MA1","label":"Parties compactes de C(K, ℝ)","family":"équicontinuité","domain":"topologie métrique","property":"\\{\\, \\mathcal{F} \\subseteq \\mathcal{C}(K, \\mathbb{R}) \\mid \\mathcal{F} \\text{ compacte pour la norme uniforme} \\,\\}","description":"Les parties compactes de l'espace des fonctions continues sur un compact K, muni de la norme uniforme.","example":"toute famille finie de fonctions continues","notes":""},{"id":"MA2","label":"Parties équicontinues","family":"équicontinuité","domain":"topologie métrique","property":"\\{\\, \\mathcal{F} \\mid \\forall \\varepsilon > 0, \\ \\exists \\delta > 0, \\ \\forall f \\in \\mathcal{F}, \\ d(x, y) < \\delta \\Rightarrow |f(x) - f(y)| \\le \\varepsilon \\,\\}","description":"Les familles de fonctions équicontinues : le même δ fonctionne pour toute la famille.","example":"une famille de fonctions toutes k-lipschitziennes (δ = ε/k)","notes":""},{"id":"FMC","label":"Fonctions métriques continues","family":"continuité","domain":"topologie métrique","property":"\\{\\, f : (X, d_X) \\to (Y, d_Y) \\mid \\forall \\varepsilon > 0, \\ \\exists \\delta > 0, \\ d_X(x, y) < \\delta \\Rightarrow d_Y(f(x), f(y)) < \\varepsilon \\,\\}","description":"Les fonctions continues entre espaces métriques.","example":"x ↦ x², de ℝ muni de sa distance usuelle","notes":""},{"id":"MV1","label":"Espaces de Banach séparables","family":"espaces de Banach","domain":"topologie vectorielle","property":"\\{\\, (E, \\|\\cdot\\|) \\mid E \\text{ complet et admet une partie dénombrable dense} \\,\\}","description":"Les espaces de Banach séparables : complets, avec une partie dénombrable dense.","example":"ℓ¹, l'espace des suites sommables","notes":""},{"id":"MV2","label":"Espaces isométriques à un sous-espace de C([0,1])","family":"espaces de Banach","domain":"topologie vectorielle","property":"\\{\\, E \\mid E \\text{ linéairement isométrique à un sous-espace de } \\mathcal{C}([0, 1]) \\,\\}","description":"Les espaces qui se plongent linéairement et isométriquement dans C([0,1]), l'espace des fonctions continues sur [0,1].","example":"(ℝⁿ, norme sup), via des fonctions affines par morceaux","notes":""},{"id":"ABR1","label":"Équations génériques de degré au moins 5","family":"équations polynomiales","domain":"algèbre générale","property":"\\{\\, X^n + a_{n-1}X^{n-1} + \\cdots + a_0 : n \\ge 5, \\ a_0, \\ldots, a_{n-1} \\text{ algébriquement indépendants} \\,\\}","description":"Les équations polynomiales génériques de degré n ≥ 5, à coefficients indéterminés.","example":"X⁵ + a₄X⁴ + … + a₀ sur ℚ(a₀, …, a₄)","notes":""},{"id":"ABR2","label":"Équations résolubles par radicaux","family":"équations polynomiales","domain":"algèbre générale","property":"\\{\\, P \\mid \\text{les racines de } P \\text{ s'expriment par radicaux à partir des coefficients} \\,\\}","description":"Les équations dont les racines s'écrivent en combinant les coefficients, des radicaux et les quatre opérations.","example":"x² − 2 = 0, de racines ±√2","notes":""},{"id":"HLB1","label":"Anneaux noethériens","family":"anneaux","domain":"algèbre générale","property":"\\{\\, A \\mid \\text{tout idéal de } A \\text{ est engendré par un nombre fini d'éléments} \\,\\}","description":"Les anneaux noethériens : tous leurs idéaux sont de type fini.","example":"ℤ, et tout corps","notes":""},{"id":"HLB2","label":"Anneaux à polynômes noethériens","family":"anneaux","domain":"algèbre générale","property":"\\{\\, A \\mid A[X] \\text{ est noethérien} \\,\\}","description":"Les anneaux dont l'anneau de polynômes à une indéterminée est noethérien.","example":"ℤ : ℤ[X] est noethérien (c'est le théorème)","notes":""},{"id":"BI1","label":"Familles libres","family":"bases","domain":"algèbre linéaire","property":"\\{\\, (x_i)_{i \\in I} \\mid \\text{toute combinaison linéaire finie nulle a ses coefficients nuls} \\,\\}","description":"Les familles linéairement indépendantes d'un espace vectoriel.","example":"(e₁, e₂) extraite de la base canonique de ℝ³","notes":""},{"id":"BI2","label":"Familles complétées en une base","family":"bases","domain":"algèbre linéaire","property":"\\{\\, (x_i)_{i \\in I} \\mid \\exists \\text{ une base } B \\text{ de } E \\text{ avec } \\{x_i : i \\in I\\} \\subseteq B \\,\\}","description":"Les familles qui se prolongent en une base de l'espace entier.","example":"la famille vide, prolongée en n'importe quelle base","notes":""},{"id":"ADO1","label":"Algèbres de Lie de dimension finie","family":"algèbres de Lie","domain":"algèbre bilinéaire","property":"\\{\\, \\mathfrak{g} \\mid \\dim \\mathfrak{g} < \\infty, \\ \\text{sur un corps de caractéristique nulle} \\,\\}","description":"Les algèbres de Lie de dimension finie sur un corps de caractéristique nulle : un produit bilinéaire antisymétrique vérifiant l'identité de Jacobi.","example":"ℝ³ muni du produit vectoriel","notes":"Le crochet de Lie est bilinéaire : ce sont des algèbres bilinéaires particulières."},{"id":"ADO2","label":"Sous-algèbres de Lie de gl_n","family":"algèbres de Lie","domain":"algèbre bilinéaire","property":"\\{\\, \\mathfrak{h} \\subseteq \\mathfrak{gl}_n(k) \\mid \\mathfrak{h} \\text{ stable par crochets} \\,\\}","description":"Les sous-algèbres de Lie des algèbres de matrices : stables par commutateurs.","example":"les matrices triangulaires supérieures strictes","notes":""},{"id":"BTY1","label":"Couples irrationnels complémentaires","family":"nombres réels","domain":"théorie algébrique des nombres","property":"\\{\\, (\\alpha, \\beta) \\mid \\alpha, \\beta \\text{ irrationnels}, \\ \\alpha, \\beta > 1, \\ \\tfrac{1}{\\alpha} + \\tfrac{1}{\\beta} = 1 \\,\\}","description":"Les couples d'irrationnels plus grands que 1 dont les inverses s'ajoutent à 1.","example":"(φ, φ²) pour le nombre d'or φ : 1/φ + 1/φ² = 1","notes":""},{"id":"BTY2","label":"Suites de Beatty partitionnant ℕ*","family":"nombres réels","domain":"théorie algébrique des nombres","property":"\\{\\, (\\alpha, \\beta) \\mid \\{\\lfloor n\\alpha \\rfloor : n \\ge 1\\} \\text{ et } \\{\\lfloor n\\beta \\rfloor : n \\ge 1\\} \\text{ forment une partition de } \\mathbb{N}^* \\,\\}","description":"Les couples dont les suites de Beatty se partagent ℕ* : chaque entier non nul apparaît exactement une fois, sans trou ni doublon.","example":"(φ, φ²) : chaque entier apparaît exactement une fois dans ⌊nφ⌋ ou ⌊nφ²⌋","notes":""},{"id":"XNC","label":"Polynômes non constants","family":"polynômes","domain":"analyse complexe","property":"\\{\\, P \\in \\mathbb{C}[X] \\mid \\deg P \\ge 1 \\,\\}","description":"Les polynômes complexes de degré au moins 1.","example":"z ↦ z⁵ − 1","notes":""},{"id":"XZR","label":"Polynômes ayant au moins une racine (dans ℂ)","family":"polynômes","domain":"analyse complexe","property":"\\{\\, P \\in \\mathbb{C}[X] \\mid \\exists z \\in \\mathbb{C}, \\ P(z) = 0 \\,\\}","description":"Les polynômes complexes qui s'annulent en au moins un point de ℂ.","example":"z ↦ z² + 1, qui s'annule en i","notes":""},{"id":"SU1","label":"Suites à ratio limite < 1","family":"séries","domain":"analyse des suites réelles","property":"\\{\\, (a_n)_{n \\ge 1} \\mid a_n \\neq 0, \\ \\lim \\left| \\tfrac{a_{n+1}}{a_n} \\right| = \\ell < 1 \\,\\}","description":"Les suites réelles dont le rapport des termes consécutifs tend vers une limite ℓ < 1.","example":"aₙ = n/2ⁿ : le ratio tend vers 1/2","notes":""},{"id":"SU2","label":"Séries convergentes","family":"séries","domain":"analyse des suites réelles","property":"\\{\\, (a_n)_{n \\ge 1} \\mid \\sum a_n \\text{ converge} \\,\\}","description":"Les suites réelles (termes généraux) dont la série associée converge.","example":"aₙ = 1/n²","notes":""},{"id":"SU3","label":"Suites à ratio limite > 1","family":"séries","domain":"analyse des suites réelles","property":"\\{\\, (a_n)_{n \\ge 1} \\mid a_n \\neq 0, \\ \\lim \\left| \\tfrac{a_{n+1}}{a_n} \\right| = \\ell > 1 \\,\\}","description":"Les suites réelles dont le rapport des termes consécutifs tend vers une limite ℓ > 1.","example":"aₙ = 2ⁿ","notes":""},{"id":"SU4","label":"Séries divergentes","family":"séries","domain":"analyse des suites réelles","property":"\\{\\, (a_n)_{n \\ge 1} \\mid \\sum a_n \\text{ diverge} \\,\\}","description":"Les suites réelles dont la série associée diverge.","example":"aₙ = 1/n","notes":""},{"id":"SU5","label":"Suites à ratio limite 1","family":"séries","domain":"analyse des suites réelles","property":"\\{\\, (a_n)_{n \\ge 1} \\mid a_n \\neq 0, \\ \\lim \\left| \\tfrac{a_{n+1}}{a_n} \\right| = 1 \\,\\}","description":"Les suites dont le ratio des termes consécutifs tend vers 1 : le cas litigieux de la règle de d'Alembert.","example":"aₙ = 1/n et aₙ = 1/n² : même ratio, destins opposés","notes":""},{"id":"BZ1","label":"Ensembles de combinaisons au + bv","family":"diviseurs","domain":"arithmétique","property":"\\{\\, a\\mathbb{Z} + b\\mathbb{Z} : a, b \\in \\mathbb{Z} \\,\\}","description":"Les ensembles d'entiers qui s'écrivent au + bv : les combinaisons arithmétiques de deux entiers donnés (non tous nuls).","example":"3ℤ + 5ℤ = ℤ, car 2 × 3 − 1 × 5 = 1","notes":""},{"id":"BZ2","label":"Sous-groupes de la forme nℤ","family":"diviseurs","domain":"arithmétique","property":"\\{\\, n\\mathbb{Z} : n \\in \\mathbb{N}^* \\,\\}","description":"Les sous-groupes additifs de ℤ engendrés par un entier.","example":"6ℤ : les multiples de 6","notes":""},{"id":"BJ1","label":"Fonctions continues strictement monotones sur un segment","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f : [a, b] \\to \\mathbb{R} \\mid f \\text{ continue, strictement monotone} \\,\\}","description":"Les fonctions continues et strictement monotones sur un segment [a, b].","example":"x ↦ x³ sur [−1, 1]","notes":""},{"id":"BJ2","label":"Bijections d'un segment sur un segment","family":"valeurs","domain":"analyse réelle","property":"\\{\\, f : [a, b] \\to [c, d] \\mid f \\text{ bijective} \\,\\}","description":"Les bijections d'un segment sur un segment.","example":"x ↦ 2x + 1, de [0, 1] sur [1, 3]","notes":""},{"id":"BJ3","label":"Fonctions continues strictement monotones sur un intervalle","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f : I \\to \\mathbb{R} \\mid I \\text{ intervalle}, \\ f \\text{ continue, strictement monotone} \\,\\}","description":"Les fonctions continues et strictement monotones sur un intervalle quelconque.","example":"x ↦ eˣ sur ℝ","notes":""},{"id":"BJ4","label":"Homéomorphismes monotones sur leur image","family":"valeurs","domain":"analyse réelle","property":"\\{\\, f : I \\to f(I) \\mid f \\text{ bijective}, \\ f^{-1} \\text{ continue et strictement monotone} \\,\\}","description":"Les fonctions qui induisent un homéomorphisme de l'intervalle de départ sur son image.","example":"x ↦ tan(x), de ]−π/2, π/2[ sur ℝ","notes":""},{"id":"BG2","label":"Fonctions continûment restreignables à une partie dense","family":"continuité","domain":"théorie des ensembles","property":"\\{\\, f \\mid \\exists D \\text{ dense dans } \\mathbb{R}, \\ f|_D \\text{ continue} \\,\\}","description":"Les fonctions dont une restriction à une partie dense de ℝ est continue.","example":"la fonction de Dirichlet (1 sur ℚ, 0 ailleurs), restreinte à ℝ ∖ ℚ où elle vaut 0","notes":""},{"id":"GAM1","label":"Fonctions gamma-like log-convexes","family":"fonctions usuelles","domain":"analyse réelle","property":"\\{\\, f : ]0, +\\infty[ \\to ]0, +\\infty[ \\mid f(1) = 1, \\ f(x+1) = x f(x), \\ f \\text{ log-convexe} \\,\\}","description":"Les fonctions positives qui vérifient l'équation fonctionnelle de Gamma et sont log-convexes.","example":"la fonction Gamma d'Euler (c'est le théorème)","notes":""},{"id":"GAM3","label":"Fonctions vérifiant l'équation fonctionnelle de Gamma","family":"fonctions usuelles","domain":"analyse réelle","property":"\\{\\, f : ]0, +\\infty[ \\to ]0, +\\infty[ \\mid f(1) = 1, \\ f(x+1) = x f(x) \\,\\}","description":"Les fonctions positives qui vérifient f(x+1) = x f(x) et f(1) = 1, sans autre contrainte.","example":"Gamma d'Euler, et Gamma multipliée par 1 + sin(2πx)/2","notes":""},{"id":"GAM2","label":"Fonction Gamma d'Euler","family":"fonctions usuelles","domain":"analyse réelle","property":"\\{\\, \\Gamma \\mid \\Gamma(x) = \\int_0^{+\\infty} t^{x-1}e^{-t} \\, dt \\,\\}","description":"Le singleton formé de la fonction Gamma d'Euler : le prolongement log-convexe de la factorielle aux réels positifs.","example":"Γ(1/2) = √π","notes":"Nœud singleton."},{"id":"BW1","label":"Suites bornées de réels","family":"suites","domain":"analyse des suites réelles","property":"\\{\\, (a_n)_{n \\ge 1} \\mid \\exists M, \\ \\forall n, \\ |a_n| \\le M \\,\\}","description":"Les suites réelles bornées.","example":"aₙ = (−1)ⁿ","notes":""},{"id":"BW2","label":"Suites admettant une sous-suite convergente","family":"suites","domain":"analyse des suites réelles","property":"\\{\\, (a_n)_{n \\ge 1} \\mid \\exists (n_k)_{k}, \\ (a_{n_k}) \\text{ converge dans } \\mathbb{R} \\,\\}","description":"Les suites dont on peut extraire une sous-suite convergente.","example":"aₙ = (−1)ⁿ : extraire les termes pairs","notes":""},{"id":"BF1","label":"Relations bien fondées","family":"relations","domain":"théorie des ensembles","property":"\\{\\, R \\subseteq X \\times X \\mid \\forall A \\subseteq X, \\ A \\neq \\varnothing \\Rightarrow \\exists a \\in A, \\ \\neg\\exists x \\in A, \\ x R a \\,\\}","description":"Les relations bien fondées : toute partie non vide admet un élément minimal, sans prédécesseur dans la partie.","example":"l'ordre strict < sur ℕ","notes":""},{"id":"BF2","label":"Relations sans chaîne descendante infinie","family":"relations","domain":"théorie des ensembles","property":"\\{\\, R \\subseteq X \\times X \\mid \\nexists (x_n)_{n}, \\ \\forall n, \\ x_{n+1} R x_n \\,\\}","description":"Les relations d'où l'on ne peut pas descendre indéfiniment.","example":"l'ordre strict < sur ℕ","notes":""},{"id":"BR1","label":"Suites réelles","family":"suites","domain":"analyse des suites réelles","property":"\\{\\, (a_n)_{n \\ge 0} \\mid a_n \\in \\mathbb{R} \\,\\}","description":"Toutes les suites réelles : l'ensemble ambiant des suites.","example":"aₙ = (n!)², de série de Taylor divergente partout sauf en 0 (voir Borel)","notes":""},{"id":"BR2","label":"Suites de dérivées successives en 0 de fonctions C∞","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, (a_n)_{n \\ge 0} \\mid \\exists f \\in \\mathcal{C}^{\\infty}(\\mathbb{R}, \\mathbb{R}), \\ \\forall n, \\ f^{(n)}(0) = a_n \\,\\}","description":"Les suites qui apparaissent comme suites de dérivées successives en 0 d'une fonction lisse.","example":"la suite nulle, réalisée par x ↦ e^(-1/x²) prolongée par 0 (plate en 0)","notes":""},{"id":"BL1","label":"Parties fermées bornées de ℝⁿ","family":"parties d'un evn","domain":"topologie vectorielle","property":"\\{\\, A \\subseteq \\mathbb{R}^n \\mid A \\text{ fermée et bornée} \\,\\}","description":"Les parties fermées et bornées d'un espace ℝⁿ.","example":"le carré [0, 1]² dans ℝ²","notes":""},{"id":"BL2","label":"Parties compactes de ℝⁿ","family":"parties d'un evn","domain":"topologie vectorielle","property":"\\{\\, A \\subseteq \\mathbb{R}^n \\mid \\text{de tout recouvrement d'ouverts on extrait un sous-recouvrement fini} \\,\\}","description":"Les parties compactes au sens de Borel–Lebesgue.","example":"le segment [0, 1]","notes":""},{"id":"LN1","label":"Applications linéaires continues","family":"applications linéaires","domain":"topologie vectorielle","property":"\\{\\, T : (E, \\|\\cdot\\|_E) \\to (F, \\|\\cdot\\|_F) \\mid T \\text{ linéaire et continue} \\,\\}","description":"Les applications linéaires continues entre espaces vectoriels normés.","example":"x ↦ 2x","notes":""},{"id":"LN2","label":"Applications linéaires bornées sur la boule unité","family":"applications linéaires","domain":"topologie vectorielle","property":"\\{\\, T \\mid \\exists C, \\ \\forall x, \\ \\|x\\|_E \\le 1 \\Rightarrow \\|T(x)\\|_F \\le C \\,\\}","description":"Les applications linéaires bornées sur la boule unité de l'espace de départ.","example":"un projecteur orthogonal, borné par 1","notes":""},{"id":"SQ1","label":"Parties compactes d'un espace vectoriel normé","family":"parties d'un evn","domain":"topologie vectorielle","property":"\\{\\, K \\subseteq E \\mid K \\text{ compacte} \\,\\}","description":"Les parties compactes d'un espace vectoriel normé.","example":"un segment de ℝ","notes":""},{"id":"SQ2","label":"Parties séquentiellement compactes","family":"parties d'un evn","domain":"topologie vectorielle","property":"\\{\\, K \\mid \\text{toute suite de } K \\text{ admet une sous-suite convergente dans } K \\,\\}","description":"Les parties dont toute suite admet une sous-suite qui converge dans la partie.","example":"le segment [0, 1]","notes":""},{"id":"FQ1","label":"Parties fermées d'un espace vectoriel normé","family":"parties d'un evn","domain":"topologie vectorielle","property":"\\{\\, A \\subseteq E \\mid A \\text{ fermée} \\,\\}","description":"Les parties fermées d'un espace vectoriel normé.","example":"l'hyperplan des x vérifiant x₁ = 0","notes":""},{"id":"FQ2","label":"Parties contenant les limites de leurs suites","family":"parties d'un evn","domain":"topologie vectorielle","property":"\\{\\, A \\subseteq E \\mid \\forall (x_n) \\text{ de } A, \\ x_n \\to x \\Rightarrow x \\in A \\,\\}","description":"Les parties qui contiennent les limites de toutes leurs suites convergentes.","example":"le segment [0, 1], stable par passage à la limite","notes":""},{"id":"TB1","label":"Fonctions continues sur un compact","family":"fonctions continues","domain":"topologie métrique","property":"\\{\\, f : K \\to \\mathbb{R} \\mid K \\text{ compact}, \\ f \\text{ continue} \\,\\}","description":"Les fonctions réelles continues sur un espace compact.","example":"x ↦ sin(x) sur [0, 2π]","notes":""},{"id":"TB2","label":"Fonctions bornées atteignant leurs bornes","family":"bornes","domain":"topologie métrique","property":"\\{\\, f : \\exists x_{min}, x_{max}, \\ \\forall x, \\ f(x_{min}) \\le f(x) \\le f(x_{max}) \\,\\}","description":"Les fonctions bornées qui atteignent leur borne inférieure et leur borne supérieure.","example":"x ↦ x² sur [−1, 1] : bornes 0 et 1 atteintes","notes":""},{"id":"BU1","label":"Fonctions continues de Sⁿ dans ℝⁿ","family":"sphères","domain":"topologie algébrique","property":"\\{\\, f : \\mathbb{S}^n \\to \\mathbb{R}^n \\mid f \\text{ continue} \\,\\}","description":"Les fonctions continues définies sur la sphère Sⁿ, à valeurs dans un espace de même dimension.","example":"en n = 1 : la hauteur d'un point du cercle","notes":""},{"id":"BU2","label":"Fonctions identifiant deux points antipodaux","family":"sphères","domain":"topologie algébrique","property":"\\{\\, f \\mid \\exists x \\in \\mathbb{S}^n, \\ f(x) = f(-x) \\,\\}","description":"Les fonctions qui prennent la même valeur en deux points antipodaux.","example":"la pression atmosphérique sur le globe (n = 2)","notes":""},{"id":"BV1","label":"Champs de vecteurs continus tangents à la sphère","family":"champs de vecteurs","domain":"topologie différentielle","property":"\\{\\, V : \\mathbb{S}^2 \\to \\mathbb{R}^3 \\mid V \\text{ continu}, \\ V(x) \\perp x \\,\\}","description":"Les champs de vecteurs continus tangents à la sphère de dimension 2.","example":"V(x, y, z) = (−y, x, 0), la rotation autour de l'axe z : tangent partout, nul aux pôles","notes":""},{"id":"BV2","label":"Champs de vecteurs s'annulant quelque part","family":"champs de vecteurs","domain":"topologie différentielle","property":"\\{\\, V \\mid \\exists x, \\ V(x) = 0 \\,\\}","description":"Les champs de vecteurs qui s'annulent en au moins un point.","example":"V(x, y, z) = (−y, x, 0), nul aux pôles","notes":""},{"id":"BRG1","label":"Quadrilatères cycliques","family":"polygones","domain":"géométrie euclidienne","property":"\\{\\, (A, B, C, D) \\in (\\mathbb{R}^2)^4 \\mid A, B, C, D \\text{ cocycliques} \\,\\}","description":"Les quadrilatères dont les quatre sommets sont sur un même cercle.","example":"tout rectangle","notes":""},{"id":"BRG2","label":"Quintuplets vérifiant la formule de Brahmagupta","family":"polygones","domain":"géométrie euclidienne","property":"\\{\\, (a, b, c, d, \\mathcal{A}) \\mid \\mathcal{A}^2 = (s-a)(s-b)(s-c)(s-d), \\ s = \\tfrac{a+b+c+d}{2} \\,\\}","description":"Les quintuplets (quatre côtés, aire) qui satisfont la formule de Brahmagupta, s le demi-périmètre.","example":"le carré de côté 1 : s = 2, aire √(1·1·1·1) = 1","notes":""},{"id":"BRI1","label":"Couples représentables par x² + ny²","family":"couples d'entiers","domain":"arithmétique","property":"\\{\\, (m, m') \\mid m = x^2 + n y^2, \\ m' = z^2 + n w^2 \\,\\}","description":"Les couples d'entiers tous deux représentables sous la forme x² + ny² (n fixé, n ≥ 1).","example":"(2, 5) pour n = 1 : 2 = 1² + 1², 5 = 1² + 2²","notes":""},{"id":"BRI2","label":"Couples dont le produit est représentable","family":"couples d'entiers","domain":"arithmétique","property":"\\{\\, (m, m') \\mid m m' = X^2 + n Y^2 \\,\\}","description":"Les couples dont le produit s'écrit encore sous la forme x² + ny².","example":"(2, 5) : 10 = 1² + 3²","notes":""},{"id":"BRH1","label":"Hexagones circonscrits à une conique","family":"polygones","domain":"géométrie euclidienne","property":"\\{\\, \\text{hexagones dont les six côtés touchent une même conique} \\,\\}","description":"Les hexagones dont les six côtés sont tangents à une même conique.","example":"un hexagone régulier autour d’un cercle","notes":""},{"id":"BRH2","label":"Hexagones à diagonales concourantes","family":"polygones","domain":"géométrie euclidienne","property":"\\{\\, \\text{hexagones dont les trois diagonales passent par un même point} \\,\\}","description":"Les hexagones dont les trois grandes diagonales se croisent en un point.","example":"un hexagone régulier","notes":""},{"id":"BRK1","label":"Graphes connexes ni complets ni cycles impairs","family":"graphes","domain":"théorie des graphes","property":"\\{\\, G \\mid G \\text{ connexe, ni clique, ni cycle impair} \\,\\}","description":"Les graphes connexes qui évitent les deux cas d'exception de Brooks.","example":"le carré C₄","notes":""},{"id":"BRK2","label":"Graphes colorables avec deg couleurs","family":"graphes","domain":"théorie des graphes","property":"\\{\\, G \\mid \\chi(G) \\le \\Delta(G) \\,\\}","description":"Les graphes dont le nombre chromatique ne dépasse pas le degré maximum.","example":"un arbre binaire : Δ = 3, χ = 2","notes":""},{"id":"BRK3","label":"Cycles impairs","family":"graphes","domain":"théorie des graphes","property":"\\{\\, C_{2k+1} \\mid k \\ge 1 \\,\\}","description":"Les cycles de longueur impaire.","example":"C₅","notes":""},{"id":"BRK4","label":"Cliques","family":"graphes","domain":"théorie des graphes","property":"\\{\\, K_n \\mid n \\ge 3 \\,\\}","description":"Les graphes complets d'au moins trois sommets.","example":"K₄ : Δ = 3 mais χ = 4","notes":""},{"id":"BRN1","label":"Séries des inverses des premiers jumeaux","family":"séries","domain":"théorie algébrique des nombres","property":"\\{\\, \\sum \\left( \\tfrac{1}{p} + \\tfrac{1}{p+2} \\right) : p, p+2 \\text{ premiers} \\,\\}","description":"La série des inverses des couples de premiers jumeaux (p, p+2).","example":"1/3 + 1/5 + 1/5 + 1/7 + 1/11 + 1/13 + …","notes":""},{"id":"BNS1","label":"Groupes d'ordre pᵃqᵇ","family":"groupes finis","domain":"théorie des groupes","property":"\\{\\, G \\mid |G| = p^a q^b, \\ p, q \\text{ premiers} \\,\\}","description":"Les groupes finis d'ordre à au plus deux facteurs premiers distincts.","example":"S₃, d’ordre 6 = 2 × 3","notes":""},{"id":"BNS2","label":"Groupes finis résolubles","family":"groupes finis","domain":"théorie des groupes","property":"\\{\\, G \\text{ fini} \\mid \\exists G = G_0 \\unrhd G_1 \\unrhd \\cdots \\unrhd G_k = \\{e\\} \\text{ à quotients abéliens} \\,\\}","description":"Les groupes finis résolubles : une tour de sous-groupes normaux à quotients abéliens.","example":"A₄, résoluble bien que non abélien","notes":""},{"id":"BSL1","label":"Nombres d'orbites d'actions de groupes finis","family":"actions de groupes","domain":"théorie des groupes","property":"\\{\\, |X/G| \\mid G \\curvearrowright X, \\ |G| < \\infty \\,\\}","description":"Les nombres d'orbites d'actions de groupes finis sur des ensembles finis.","example":"14 : les colliers bicolores à 6 perles modulo rotation","notes":""},{"id":"BSL2","label":"Moyennes de nombres de points fixes","family":"actions de groupes","domain":"théorie des groupes","property":"\\{\\, \\tfrac{1}{|G|} \\sum_{g \\in G} |\\mathrm{Fix}(g)| \\mid G \\curvearrowright X \\,\\}","description":"Les moyennes, sur un groupe fini, du nombre de points fixes d'une action.","example":"l’action triviale : la moyenne vaut |X|, et il y a |X| orbites","notes":""},{"id":"CNT1","label":"Applications d'un ensemble dans son ensemble des parties","family":"applications","domain":"théorie des ensembles","property":"\\{\\, f : X \\to \\mathcal{P}(X) \\mid X \\text{ un ensemble} \\,\\}","description":"Les applications d'un ensemble dans son propre ensemble des parties.","example":"x ↦ {x}","notes":""},{"id":"CNT2","label":"Applications non surjectives","family":"applications","domain":"théorie des ensembles","property":"\\{\\, f : X \\to Y \\mid f(X) \\neq Y \\,\\}","description":"Les applications dont l'image ne remplit pas tout l'ensemble d'arrivée.","example":"x ↦ {x}, de X vers P(X) : n’atteint ni ∅ ni les paires","notes":""},{"id":"ORD1","label":"Ordres linéaires denses dénombrables sans extrémités","family":"ordres","domain":"théorie des ordres","property":"\\{\\, (A, \\le) \\mid A \\text{ dénombrable, ordre dense, sans extrémités} \\,\\}","description":"Les ordres linéaires denses dénombrables, sans plus petit ni plus grand élément.","example":"l’ordre des rationnels de ]0,1[","notes":""},{"id":"ORD2","label":"Ordres isomorphes à celui des rationnels","family":"ordres","domain":"théorie des ordres","property":"\\{\\, (A, \\le) \\mid (A, \\le) \\simeq (\\mathbb{Q}, \\le) \\,\\}","description":"Les ordres linéaires isomorphes à (ℚ, ≤).","example":"(ℚ, ≤) lui-même","notes":""},{"id":"CBD1","label":"Fermés de ℝ","family":"parties de ℝ","domain":"topologie","property":"\\{\\, F \\subseteq \\mathbb{R} \\mid F \\text{ fermé} \\,\\}","description":"Les parties fermées de ℝ.","example":"l’ensemble de Cantor","notes":""},{"id":"CBD2","label":"Réunions d'un parfait et d'un dénombrable","family":"parties de ℝ","domain":"topologie","property":"\\{\\, F \\subseteq \\mathbb{R} \\mid F = P \\cup D, \\ P \\text{ parfait}, \\ D \\text{ au plus dénombrable} \\,\\}","description":"Les parties de ℝ qui s'écrivent comme réunion d'un ensemble parfait et d'un ensemble au plus dénombrable.","example":"l’ensemble de Cantor (déjà parfait, D = ∅)","notes":""},{"id":"CBE1","label":"Couples d'ensembles mutuellement injectables","family":"couples d'ensembles","domain":"théorie des ensembles","property":"\\{\\, (X, Y) \\mid X \\hookrightarrow Y \\text{ et } Y \\hookrightarrow X \\,\\}","description":"Les couples d'ensembles où chacun s'injecte dans l'autre.","example":"(ℝ, P(ℕ))","notes":""},{"id":"CBE2","label":"Couples d'ensembles équipotents","family":"couples d'ensembles","domain":"théorie des ensembles","property":"\\{\\, (X, Y) \\mid \\exists \\text{ bijection } X \\to Y \\,\\}","description":"Les couples d'ensembles équipotents.","example":"(ℝ, P(ℕ)), via les développements binaires","notes":""},{"id":"CAR1","label":"Algèbres d'ensembles","family":"tribus","domain":"théorie de la mesure","property":"\\{\\, \\mathcal{A} \\subseteq \\mathcal{P}(X) \\mid \\text{stable par complémentaire et réunion finie} \\,\\}","description":"Les algèbres d'ensembles : familles closes par complémentaire et réunion finie.","example":"les réunions finies d’intervalles de ℝ","notes":""},{"id":"CAR2","label":"Tribus complètes","family":"tribus","domain":"théorie de la mesure","property":"\\{\\, \\mathcal{T} \\mid \\text{tribu, et tout sous-ensemble d’un négligeable est mesurable} \\,\\}","description":"Les tribus complètes : tout sous-ensemble d'un ensemble de mesure nulle y est mesurable.","example":"la tribu de Lebesgue","notes":""},{"id":"CKD1","label":"Enveloppes convexes de parties de ℝⁿ","family":"convexité","domain":"topologie vectorielle","property":"\\{\\, \\mathrm{conv}(S) \\mid S \\subseteq \\mathbb{R}^n \\,\\}","description":"Les enveloppes convexes de parties de ℝⁿ.","example":"le disque, enveloppe du cercle","notes":""},{"id":"CKD2","label":"Réunions des enveloppes de n+1 points","family":"convexité","domain":"topologie vectorielle","property":"\\{\\, \\bigcup_{T \\subseteq S, |T| \\le n+1} \\mathrm{conv}(T) \\mid S \\subseteq \\mathbb{R}^n \\,\\}","description":"Les réunions des enveloppes convexes des sous-familles d'au plus n+1 points.","example":"dans ℝ², les triangles issus de S","notes":""},{"id":"CQG1","label":"Groupes finis d'ordre divisible par p","family":"groupes finis","domain":"théorie des groupes","property":"\\{\\, G \\text{ fini} \\mid p \\mid |G| \\,\\}","description":"Les groupes finis dont l'ordre est divisible par un nombre premier donné.","example":"S₃, divisible pa
