<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Graphe des théorèmes</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root { color-scheme: dark; --bg: #11151b; --panel: #151b24; --line: #263041; --ink: #e9edf3; --muted: #9fb0c3; --accent: #f2c14e; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 10px 0 0; font-weight: 650; letter-spacing: 0.2px; }
  header .sub { font-size: 12px; color: var(--muted); margin-right: 10px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  input[type=text], select { background: #0d1219; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  input[type=file] { font-size: 11px; color: var(--muted); max-width: 180px; }
  button { background: #1a2634; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  button:hover { background: #24344a; }
  .ctl { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .ctl input { accent-color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  #cy { flex: 1; min-width: 0; background: radial-gradient(ellipse at 50% 40%, #141b25 0%, #0e1218 100%); }
  aside { width: 390px; max-width: 48%; overflow-y: auto; padding: 16px; background: var(--panel); border-left: 1px solid var(--line); font-size: 13.5px; line-height: 1.6; color: #d7dde6; }
  aside::-webkit-scrollbar { width: 9px; }
  aside::-webkit-scrollbar-thumb { background: #243043; border-radius: 9px; }
  aside h2 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 19px; font-weight: 600; margin: 2px 0 10px; color: #f4f7fb; }
  aside h3 { font-size: 11px; margin: 16px 0 7px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
  .chip { display: inline-block; padding: 2px 11px; border-radius: 999px; font-size: 11.5px; margin: 0 5px 6px 0; background: #1a2634; border: 1px solid var(--line); color: #cfd9e6; }
  .chip.serif { font-style: italic; }
  .card { background: #10161f; border: 1px solid #1f2938; border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
  .prop { background: #0d1219; border: 1px solid #1f2938; border-radius: 12px; padding: 12px 12px; margin: 10px 0; overflow-x: auto; }
  .prop, .prop * { color: #f4f7fb !important; }
  .ce { background: rgba(242, 193, 78, 0.06); border: 1px solid rgba(242, 193, 78, 0.28); border-radius: 12px; padding: 10px 13px; margin: 8px 0; }
  .ce b { color: var(--accent); }
  .note { color: var(--muted); font-size: 12.5px; }
  .thm { background: linear-gradient(180deg, #141c28, #10161f); border: 1px solid #1f2938; border-radius: 14px; padding: 13px 14px 11px; margin: 8px 0; }
  .thm-kicker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
  .thm-sym { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 15px; color: #20232a; flex: 0 0 auto; }
  .thm-domain { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .thm-tag { font-size: 10px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; padding: 2px 9px; border-radius: 6px; border: 1px solid; margin-left: auto; }
  .thm .rel { overflow-x: auto; background: #0d1219; border: 1px solid #1f2938; border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .statement { background: #e6ebf2; color: #141a24; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin: 10px 0 2px; }
  .statement b { color: #10161f; }
  .statement .katex { color: #141a24; }
  .rel { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 16.5px; color: #f4f7fb; margin: 6px 0; }
  .rel .op { color: var(--accent); font-weight: 600; padding: 0 4px; }
  aside ul { margin: 4px 0; padding-left: 16px; list-style: none; }
  aside li { margin: 7px 0; padding-left: 4px; }
  aside li .op { color: var(--accent); font-weight: 600; padding: 0 3px; }
  aside li.antiitem .op { color: #ff8d7d; }
  aside p { margin: 8px 0; }
  footer { padding: 6px 18px; background: var(--panel); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .leg { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #f8cbd8; display: inline-block; }
  .sw { width: 26px; height: 0; display: inline-block; border-top: 1px solid #fff; }
  .sw.dash { border-top-style: dashed; }
</style>
</head>
<body>
<header>
  <h1>Graphe des théorèmes</h1>
  <span class="sub">nœud = ensemble · arête = théorème</span>
  <div class="controls">
    <input type="text" id="search" placeholder="Rechercher…"/>
    <select id="depth"></select>
    <select id="family"></select>
    <label class="ctl"><input type="checkbox" id="anti" checked/> contre-exemples</label>
    <button id="relayout">Réarranger</button>
    <input type="file" id="file" accept=".json,application/json" title="Charger un autre graphe"/>
  </div>
</header>
<main>
  <div id="cy"></div>
  <aside id="panel"></aside>
</main>
<footer>
  <span class="leg"><span class="dot"></span> cercle : ensemble (couleur = domaine)</span>
  <span class="leg"><span class="sw"></span> inclusion A ⊆ B</span>
  <span class="leg"><span class="sw dash"></span> contre-exemple A ⊄ B (couplable)</span>
  <span class="leg">taille du cercle ∝ arêtes qui y arrivent</span>
</footer>
<script>
var GRAPH_EMBEDDED = {"meta":{"name":"Graphe des théorèmes","version":"0.2.2","created":"2026-11-23","language":"fr","description":"Chaque nœud est un ensemble de fonctions, chaque arête est un théorème : inclusion (A ⊆ B) ou non-inclusion avec contre-exemple (A ⊄ B).","colorCode":{"analyse réelle":"rose pastel","arithmétique":"orange pastel","algèbre générale":"jaune orangé","algèbre linéaire":"vert pastel","théorie des ensembles":"bleu clair","analyse complexe":"marron pastel"},"semantics":{"node":"un ensemble, nommé précisément (ex. : Fonctions réelles continues)","inclusion":"arête blanche fine A → B : le théorème affirme A ⊆ B","anti":"arête pointillée : A ⊄ B, prouvé par un contre-exemple explicite","nodeSize":"taille du cercle proportionnelle au nombre d'arêtes qui y arrivent","depth":["définitoire","immédiat","facile","classique","fondamental","profond"],"notes":"Le type « équivalence » est prévu par le format mais aucune arête d'équivalence n'est encore tracée : la logique des équivalences sera établie par Mathis."}},"nodes":[{"id":"C","label":"Fonctions réelles continues","family":"continuité","domain":"analyse réelle","property":"\\{\\, f : \\mathbb{R} \\to \\mathbb{R} \\mid f \\text{ continue en tout point de } \\mathbb{R} \\,\\}","description":"Les fonctions continues de ℝ dans ℝ.","example":"x ↦ x²","notes":"Nœud de départ du graphe."},{"id":"F","label":"Fonctions réelles","family":"univers","domain":"analyse réelle","property":"\\mathbb{R}^{\\mathbb{R}} = \\{\\, f : \\mathbb{R} \\to \\mathbb{R} \\,\\}","description":"Toutes les fonctions de ℝ dans ℝ : l'ensemble ambiant.","example":"x ↦ 1 si x ∈ ℚ, sinon 0 (fonction de Dirichlet)","notes":""},{"id":"FC","label":"Fonctions continues","family":"continuité","domain":"analyse réelle","property":"\\{\\, f \\text{ continue, d'ensemble de définition quelconque} \\,\\}","description":"Toutes les fonctions continues, sans fixer le domaine.","example":"x ↦ sin(x) restreinte à [0, π]","notes":""},{"id":"UC","label":"Fonctions uniformément continues","family":"continuité","domain":"analyse réelle","property":"\\{\\, f : \\forall \\varepsilon > 0,\\ \\exists \\delta > 0,\\ \\forall x, y : |x - y| < \\delta \\Rightarrow |f(x) - f(y)| < \\varepsilon \\,\\}","description":"Fonctions uniformément continues sur ℝ tout entier.","example":"x ↦ x","notes":""},{"id":"L","label":"Fonctions lipschitziennes","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : \\exists k \\ge 0,\\ \\forall x, y : |f(x) - f(y)| \\le k\\,|x - y| \\,\\}","description":"Fonctions k-lipschitziennes sur ℝ.","example":"x ↦ |x| (constante 1)","notes":""},{"id":"DBR","label":"Fonctions dérivables à dérivée bornée","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f \\text{ dérivable sur } \\mathbb{R} \\text{ et } f' \\text{ bornée} \\,\\}","description":"Fonctions dérivées partout avec une dérivée bornée sur ℝ.","example":"x ↦ sin(x)","notes":""},{"id":"D","label":"Fonctions dérivables","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : \\forall a \\in \\mathbb{R},\\ f'(a) = \\lim_{x \\to a} \\frac{f(x) - f(a)}{x - a} \\text{ existe} \\,\\}","description":"Fonctions dérivables en tout point de ℝ.","example":"x ↦ x³","notes":""},{"id":"DEC","label":"Dérivables sauf sur un dénombrable","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f : \\{ x : f \\text{ non dérivable en } x \\} \\text{ est au plus dénombrable} \\,\\}","description":"Fonctions dérivables sauf sur un ensemble au plus dénombrable de points.","example":"x ↦ |x| (un seul point de non-dérivabilité)","notes":""},{"id":"DER","label":"Fonctions dérivées","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, g : \\exists f \\text{ dérivable},\\ g = f' \\,\\}","description":"Les fonctions qui sont la dérivée d'une fonction dérivable.","example":"x ↦ x (dérivée de x ↦ x²/2)","notes":"Ensemble construit à partir des fonctions dérivables par l'opérateur f ↦ f'. Contient des fonctions discontinues."},{"id":"C1","label":"Fonctions de classe C¹","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, f \\text{ dérivable, de dérivée continue} \\,\\}","description":"Fonctions de classe C¹.","example":"x ↦ sin(x)","notes":""},{"id":"P","label":"Fonctions polynomiales","family":"dérivabilité","domain":"analyse réelle","property":"\\mathbb{R}[X] = \\{\\, f : f(x) = a_n x^n + \\cdots + a_1 x + a_0 \\,\\}","description":"Les fonctions polynomiales.","example":"x ↦ x²","notes":"Même C^∞ et analytiques."},{"id":"AFF","label":"Fonctions affines","family":"dérivabilité","domain":"analyse réelle","property":"\\{\\, x \\mapsto ax + b : a, b \\in \\mathbb{R} \\,\\}","description":"Les fonctions affines.","example":"x ↦ 2x + 3","notes":""},{"id":"M","label":"Fonctions monotones","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f : f \\text{ croissante sur } \\mathbb{R} \\text{ ou décroissante sur } \\mathbb{R} \\,\\}","description":"Fonctions monotones sur ℝ.","example":"x ↦ x","notes":""},{"id":"CNV","label":"Fonctions convexes","family":"continuité","domain":"analyse réelle","property":"\\{\\, f : \\forall x, y,\\ \\forall t \\in [0,1] : f(tx + (1-t)y) \\le t f(x) + (1-t) f(y) \\,\\}","description":"Fonctions convexes sur ℝ.","example":"x ↦ eˣ","notes":""},{"id":"B","label":"Fonctions réelles bornées","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f : \\exists M,\\ \\forall x \\in \\mathbb{R} : |f(x)| \\le M \\,\\}","description":"Fonctions bornées sur ℝ tout entier.","example":"x ↦ sin(x)","notes":""},{"id":"MB","label":"Fonctions monotones et bornées","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f \\text{ monotone et bornée sur } \\mathbb{R} \\,\\}","description":"Ensemble-construit : intersection des monotones et des bornées.","example":"x ↦ arctan(x)","notes":"Nœud construit à partir de deux autres ensembles."},{"id":"LIM","label":"Fonctions à limites finies en ±∞","family":"monotonie","domain":"analyse réelle","property":"\\{\\, f : \\lim_{x \\to +\\infty} f(x) \\text{ et } \\lim_{x \\to -\\infty} f(x) \\text{ existent et sont finies} \\,\\}","description":"Fonctions admettant des limites finies aux deux infinis.","example":"x ↦ arctan(x)","notes":""},{"id":"IVP","label":"Fonctions de Darboux","family":"valeurs","domain":"analyse réelle","property":"\\{\\, f : f(I) \\text{ est un intervalle pour tout intervalle } I \\,\\}","description":"Les fonctions qui prennent toutes les valeurs intermédiaires.","example":"x ↦ sin(1/x) (f(0) = 0)","notes":""},{"id":"CARDE","label":"Fonctions à discontinuités dénombrables","family":"intégrabilité","domain":"analyse réelle","property":"\\{\\, f : \\{ x : f \\text{ discontinue en } x \\} \\text{ est au plus dénombrable} \\,\\}","description":"Fonctions discontinues seulement en un nombre au plus dénombrable de points.","example":"x ↦ 1_{x>0} (échelon d'Heaviside)","notes":""},{"id":"PC","label":"Fonctions continues par morceaux","family":"intégrabilité","domain":"analyse réelle","property":"\\{\\, f : \\text{sur chaque segment, un nombre fini de discontinuités de première espèce} \\,\\}","description":"Fonctions continues par morceaux sur chaque segment.","example":"x ↦ 1_{x>0}","notes":""},{"id":"RSEG","label":"Fonctions Riemann-intégrables sur tout segment","family":"intégrabilité","domain":"analyse réelle","property":"\\{\\, f : \\forall [a, b] \\subset \\mathbb{R},\\ f \\text{ Riemann-intégrable sur } [a, b] \\,\\}","description":"Fonctions Riemann-intégrables sur chaque segment.","example":"x ↦ 1_{x>0}","notes":""}],"edges":[{"from":"C","to":"IVP","kind":"inclusion","theorem":"Théorème des valeurs intermédiaires","statement":"Si \\( f \\) est continue sur \\( [a, b] \\), son image contient tout l'intervalle \\( [f(a), f(b)] \\) : pour toute valeur \\( c \\) comprise entre \\( f(a) \\) et \\( f(b) \\), il existe \\( x \\in [a, b] \\) tel que \\( f(x) = c \\).","depth":"fondamental","strict":true,"strictnessExample":"x ↦ sin(1/x) (f(0) = 0) prend toutes les valeurs intermédiaires sans être continue en 0.","id":"e1"},{"from":"C","to":"F","kind":"inclusion","theorem":"Définition","statement":"Une fonction réelle continue est en particulier une fonction de ℝ dans ℝ.","depth":"définitoire","id":"e2"},{"from":"C","to":"FC","kind":"inclusion","theorem":"Définition","statement":"Une fonction réelle continue est une fonction continue.","depth":"définitoire","id":"e3"},{"from":"D","to":"C","kind":"inclusion","theorem":"Une fonction dérivable est continue","statement":"Si \\( f \\) est dérivable en \\( a \\), l'existence de \\( f'(a) = \\lim_{x \\to a} \\frac{f(x) - f(a)}{x - a} \\) impose \\( \\lim_{x \\to a} f(x) = f(a) \\).","depth":"classique","strict":true,"strictnessExample":"x ↦ |x| est continue sans être dérivable en 0.","id":"e4"},{"from":"C1","to":"D","kind":"inclusion","theorem":"Définition de C¹","statement":"Une fonction de classe C¹ est dérivable, de dérivée continue.","depth":"définitoire","id":"e5"},{"from":"C1","to":"C","kind":"inclusion","theorem":"Chaîne définition + théorème","statement":"Une fonction C¹ est dérivable donc continue.","depth":"immédiat","id":"e6"},{"from":"P","to":"C1","kind":"inclusion","theorem":"Les polynômes sont lisses","statement":"Un polynôme est indéfiniment dérivable, à dérivées encore polynomiales donc continues : il est C¹, et même C^∞.","depth":"définitoire","id":"e7"},{"from":"AFF","to":"P","kind":"inclusion","theorem":"Définition","statement":"Une fonction affine x ↦ ax + b est un polynôme de degré au plus 1.","depth":"définitoire","id":"e8"},{"from":"AFF","to":"L","kind":"inclusion","theorem":"Définition","statement":"Pour \\( f(x) = ax + b \\) : \\( |f(x) - f(y)| = |a|\\,|x - y| \\), lipschitzienne de constante \\( |a| \\).","depth":"définitoire","id":"e9"},{"from":"DBR","to":"D","kind":"inclusion","theorem":"Définition","statement":"Une fonction à dérivée bornée est en particulier dérivable.","depth":"définitoire","id":"e10"},{"from":"DBR","to":"L","kind":"inclusion","theorem":"Théorème des accroissements finis (TAF)","statement":"Si \\( f \\) est dérivable et \\( |f'| \\le k \\), alors pour tous \\( x, y \\) le TAF fournit \\( c \\) entre \\( x \\) et \\( y \\) tel que \\( |f(x) - f(y)| = |f'(c)|\\,|x - y| \\le k\\,|x - y| \\).","depth":"fondamental","strict":true,"strictnessExample":"x ↦ |x| est lipschitzienne sans être dérivable en 0.","id":"e11"},{"from":"L","to":"UC","kind":"inclusion","theorem":"Module uniforme","statement":"Pour un k-lipschitzien, \\( \\delta = \\varepsilon / k \\) convient en tout point : le contrôle est déjà uniforme.","depth":"immédiat","id":"e12"},{"from":"UC","to":"C","kind":"inclusion","theorem":"Définition","statement":"L'uniforme continuité sur ℝ implique la continuité en tout point.","depth":"immédiat","id":"e13"},{"from":"C","to":"RSEG","kind":"inclusion","theorem":"Continues ⇒ intégrables","statement":"Sur chaque segment, une fonction continue y est bornée et Riemann-intégrable : l'uniforme continuité sur le compact contrôle l'oscillation des sommes de Riemann.","depth":"classique","id":"e14"},{"from":"M","to":"RSEG","kind":"inclusion","theorem":"Monotone ⇒ intégrable (Riemann)","statement":"Une fonction monotone est Riemann-intégrable sur chaque segment : le critère de Darboux est vérifié, la variation totale contrôle l'oscillation sur une subdivision.","depth":"classique","id":"e15"},{"from":"PC","to":"RSEG","kind":"inclusion","theorem":"Par morceaux ⇒ intégrable","statement":"Sur chaque segment, on découpe au niveau des discontinuités et on intègre morceau par morceau.","depth":"classique","id":"e16"},{"from":"M","to":"CARDE","kind":"inclusion","theorem":"Discontinuités d'une fonction monotone","statement":"Les discontinuités d'une fonction monotone sont des sauts deux à deux disjoints ; chacun contient un rationnel distinct : il y en a au plus une infinité dénombrable.","depth":"classique","id":"e17"},{"from":"PC","to":"CARDE","kind":"inclusion","theorem":"Définition","statement":"Un nombre fini de discontinuités par segment, et dénombrablement de segments : au plus dénombrable en tout.","depth":"immédiat","id":"e18"},{"from":"CNV","to":"C","kind":"inclusion","theorem":"Convexe ⇒ continue","statement":"Sur tout intervalle ouvert, une fonction convexe est coincée entre deux de ses cordes affines : l'oscillation sur un sous-intervalle est bornée, d'où la continuité.","depth":"classique","notes":"Mieux : localement lipschitzienne. L'analogue est faux en dimension infinie.","id":"e19"},{"from":"CNV","to":"DEC","kind":"inclusion","theorem":"Dérivée d'une fonction convexe","statement":"Une fonction convexe admet des dérivées latérales croissantes, égales sauf en au plus un ensemble dénombrable de points (les « angles » de la courbe).","depth":"classique","id":"e20"},{"from":"DER","to":"IVP","kind":"inclusion","theorem":"Théorème de Darboux","statement":"Une dérivée, même discontinue, satisfait la propriété des valeurs intermédiaires : si \\( g = f' \\), alors \\( g \\) prend toute valeur comprise entre deux de ses valeurs.","depth":"profond","notes":"Une dérivée ne peut donc jamais sauter : sa discontinuité est obligatoirement oscillante.","id":"e21"},{"from":"MB","to":"LIM","kind":"inclusion","theorem":"Théorème de la limite monotone","statement":"Une fonction croissante majorée converge vers sa borne supérieure : \\( \\lim_{x \\to +\\infty} f(x) = \\sup f \\). Une fonction monotone bornée admet donc des limites finies aux deux infinis.","depth":"fondamental","strict":true,"strictnessExample":"x ↦ sin(x)/(1 + x²) tend vers 0 aux deux infinis sans être monotone.","id":"e22"},{"from":"MB","to":"M","kind":"inclusion","theorem":"Définition","statement":"Un ensemble-construit est inclus dans ses composants.","depth":"définitoire","id":"e23"},{"from":"MB","to":"B","kind":"inclusion","theorem":"Définition","statement":"Un ensemble-construit est inclus dans ses composants.","depth":"définitoire","id":"e24"},{"from":"C","to":"M","kind":"anti","theorem":"Une continue non monotone","statement":"La continuité n'implique pas la monotonie.","depth":"facile","counterexample":"x ↦ sin(x) : continue et oscillante.","id":"e25"},{"from":"C","to":"L","kind":"anti","theorem":"Une continue non lipschitzienne","statement":"La continuité n'implique pas la condition de Lipschitz.","depth":"classique","counterexample":"x ↦ √|x| : continue, mais (f(h) − f(0))/h = 1/√h → +∞ : aucune constante de Lipschitz ne fonctionne près de 0.","id":"e26"},{"from":"C","to":"UC","kind":"anti","theorem":"Une continue non uniformément continue","statement":"La continuité sur ℝ tout entier n'implique pas l'uniforme continuité.","depth":"classique","counterexample":"x ↦ x² : |x² − y²| = |x + y|·|x − y| devient grand même pour un petit écart fixé quand x et y grandissent.","id":"e27"},{"from":"C","to":"B","kind":"anti","theorem":"Une continue non bornée","statement":"La continuité n'implique pas la bornitude sur ℝ.","depth":"facile","counterexample":"x ↦ x : continue et non bornée.","id":"e28"},{"from":"L","to":"D","kind":"anti","theorem":"Une lipschitzienne non dérivable","statement":"La condition de Lipschitz n'implique pas la dérivabilité.","depth":"facile","counterexample":"x ↦ |x| : 1-lipschitzienne, non dérivable en 0.","id":"e29"},{"from":"L","to":"B","kind":"anti","theorem":"Une lipschitzienne non bornée","statement":"Lipschitz n'implique pas bornée sur ℝ.","depth":"facile","counterexample":"x ↦ x : 1-lipschitzienne, non bornée.","id":"e30"},{"from":"D","to":"L","kind":"anti","theorem":"Une dérivable non lipschitzienne","statement":"La dérivabilité n'implique pas la condition de Lipschitz.","depth":"classique","counterexample":"f(x) = x² sin(1/x²), f(0) = 0 : dérivable partout, de dérivée \\( f'(x) = 2x\\sin(1/x^2) - (2/x)\\cos(1/x^2) \\) non bornée près de 0.","id":"e31"},{"from":"D","to":"DBR","kind":"anti","theorem":"Une dérivée qui explose","statement":"La dérivabilité n'implique pas une dérivée bornée.","depth":"classique","counterexample":"Même exemple : x² sin(1/x²), de dérivée non bornée près de 0.","id":"e32"},{"from":"M","to":"C","kind":"anti","theorem":"Une monotone discontinue","statement":"La monotonie n'implique pas la continuité.","depth":"facile","counterexample":"L'échelon d'Heaviside x ↦ 1_{x>0} : croissante, discontinue en 0.","id":"e33"},{"from":"M","to":"DEC","kind":"anti","theorem":"Fonction de Cantor","statement":"Une fonction monotone, même continue, peut ne pas être dérivable sur un ensemble non dénombrable de points.","depth":"profond","counterexample":"L'escalier du diable (fonction de Cantor–Lebesgue) : croissante, continue, non dérivable sur une partie non dénombrable de l'ensemble de Cantor.","notes":"Lebesgue : monotone ⇒ dérivable sauf sur un ensemble négligeable, mais « négligeable » est plus fin que « au plus dénombrable » : l'ensemble de Cantor en est exactement la frontière.","id":"e34"},{"from":"DER","to":"C","kind":"anti","theorem":"Une dérivée discontinue","statement":"Une fonction qui est une dérivée n'est pas nécessairement continue (mais ne peut pas sauter : Darboux).","depth":"profond","counterexample":"g(x) = 2x sin(1/x) − cos(1/x), g(0) = 0 : la dérivée de f(x) = x² sin(1/x), discontinue en 0.","id":"e35"},{"from":"IVP","to":"C","kind":"anti","theorem":"Une Darboux non continue","statement":"La propriété des valeurs intermédiaires n'implique pas la continuité.","depth":"classique","counterexample":"x ↦ sin(1/x) avec f(0) = 0 : l'image de tout intervalle contenant 0 est [−1, 1], mais f est discontinue en 0.","id":"e36"},{"from":"RSEG","to":"C","kind":"anti","theorem":"Une intégrable discontinue","statement":"L'intégrabilité au sens de Riemann sur chaque segment n'implique pas la continuité.","depth":"facile","counterexample":"L'échelon d'Heaviside est Riemann-intégrable sur chaque segment, discontinue en 0.","id":"e37"},{"from":"UC","to":"L","kind":"anti","theorem":"Une uniformément continue non lipschitzienne","statement":"L'uniforme continuité n'implique pas la condition de Lipschitz.","depth":"classique","counterexample":"x ↦ √|x| : uniformément continue, sans constante de Lipschitz possible près de 0.","id":"e38"},{"from":"P","to":"AFF","kind":"anti","theorem":"Un polynôme non affine","statement":"Presque tous les polynômes ne sont pas affines.","depth":"définitoire","counterexample":"x ↦ x².","id":"e39"},{"from":"B","to":"LIM","kind":"anti","theorem":"Une bornée sans limites","statement":"La bornitude n'implique pas l'existence de limites aux infinis.","depth":"facile","counterexample":"x ↦ sin(x) : bornée, sans limite en +∞.","id":"e40"}]};
var GRAPH = GRAPH_EMBEDDED;
var DEPTH_LABEL = { "définitoire": "définitoires", "immédiat": "immédiats", "facile": "faciles", "classique": "classiques", "fondamental": "fondamentaux", "profond": "profonds" };
var KIND_LABEL = { "inclusion": "inclusion", "equivalence": "équivalence", "anti": "contre-exemple (non-inclusion)" };
var FAMILY_LABEL = { "univers": "Fonctions réelles", "continuité": "Continuité", "dérivabilité": "Dérivabilité", "intégrabilité": "Intégrabilité", "monotonie": "Monotonie / bornes", "valeurs": "Valeurs intermédiaires" };
var DOMAIN_STYLE = {
  "analyse réelle": { bg: "#f8cbd8", border: "#e3a4b9" },
  "arithmétique": { bg: "#fbd9a9", border: "#e6b873" },
  "algèbre générale": { bg: "#f9dfa0", border: "#e0b45d" },
  "algèbre linéaire": { bg: "#c4e8c8", border: "#8fc79e" },
  "théorie des ensembles": { bg: "#b6dcf5", border: "#7fb4dd" },
  "analyse complexe": { bg: "#dfc3ac", border: "#b5896a" }
};
function domainStyle(d) { return DOMAIN_STYLE[d] || { bg: "#cfd9e4", border: "#a9b6c6" }; }

var cy = null;
var idToLabel = {};
function labelOf(id) { return idToLabel[id] || id; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function wrapLabel(label, maxChars) {
  var words = label.split(" ");
  var lines = [];
  var cur = "";
  words.forEach(function (w) {
    if (cur === "" || (cur + " " + w).length <= maxChars) { cur = cur === "" ? w : cur + " " + w; }
    else { lines.push(cur); cur = w; }
  });
  if (cur !== "") { lines.push(cur); }
  return lines;
}
function nodeSize(label, inDeg) {
  var lines = wrapLabel(label, 14);
  var longest = 0;
  lines.forEach(function (l) { if (l.length > longest) { longest = l.length; } });
  var dText = Math.max(32, longest * 6.8 + 14, lines.length * 16 + 8);
  var dDeg = 30 + inDeg * 3.4;
  var d = Math.max(dText, dDeg);
  d = Math.min(d, 132);
  return { d: Math.round(d), w: Math.round(d * 0.76) };
}

function buildElements(g) {
  idToLabel = {};
  g.nodes.forEach(function (n) { idToLabel[n.id] = n.label; });
  var inDeg = {};
  g.edges.forEach(function (e) { inDeg[e.to] = (inDeg[e.to] || 0) + 1; });
  var els = [];
  g.nodes.forEach(function (n) {
    var ds = domainStyle(n.domain);
    var sz = nodeSize(n.label, inDeg[n.id] || 0);
    els.push({ data: {
      id: n.id, label: n.label, family: n.family, domain: n.domain,
      property: n.property, description: n.description, example: n.example,
      notes: n.notes || "", color: ds.bg, borderColor: ds.border,
      size: sz.d, tw: sz.w, inDeg: inDeg[n.id] || 0
    } });
  });
  g.edges.forEach(function (e) {
    els.push({ data: {
      id: e.id, source: e.from, target: e.to, kind: e.kind,
      theorem: e.theorem, statement: e.statement, depth: e.depth,
      counterexample: e.counterexample || "", strict: e.kind === "inclusion" && e.strict,
      strictnessExample: e.strictnessExample || "", notes: e.notes || ""
    } });
  });
  return els;
}

function styleSheet() {
  return [
    { selector: "node", style: {
      "shape": "ellipse", "background-color": "data(color)",
      "border-width": 1.5, "border-color": "data(borderColor)",
      "width": "data(size)", "height": "data(size)",
      "label": "data(label)", "color": "#2e2a33", "font-size": 10,
      "font-weight": 600, "text-valign": "center", "text-halign": "center",
      "text-wrap": "wrap", "text-max-width": "data(tw)"
    } },
    { selector: "node:selected", style: { "border-width": 3, "border-color": "#f2c14e" } },
    { selector: "edge", style: {
      "curve-style": "bezier", "control-point-step-size": 55,
      "width": 0.9, "line-color": "#ffffff", "opacity": 0.65,
      "target-arrow-shape": "triangle", "target-arrow-color": "#ffffff", "arrow-scale": 0.7
    } },
    { selector: 'edge[kind="anti"]', style: { "line-style": "dashed", "target-arrow-shape": "none", "opacity": 0.5 } },
    { selector: 'edge[kind="equivalence"]', style: { "source-arrow-shape": "triangle", "source-arrow-color": "#ffffff" } },
    { selector: "edge:selected", style: { "line-color": "#f2c14e", "target-arrow-color": "#f2c14e", "width": 2.4, "opacity": 1 } },
    { selector: ".hiddenedge", style: { "display": "none" } },
    { selector: ".faded", style: { "opacity": 0.07 } }
  ];
}

function getLayout() {
  return { name: "cose", animate: true, animationDuration: 500, idealEdgeLength: 110, nodeRepulsion: 12000, nodeOverlap: 26, componentSpacing: 160, padding: 50, randomize: true };
}

function mathify() {
  var el = document.getElementById("panel");
  if (window.renderMathInElement) {
    renderMathInElement(el, { delimiters: [{ left: "\\(", right: "\\)", display: false }], throwOnError: false });
  }
}
function showPanel(html) {
  var el = document.getElementById("panel");
  el.innerHTML = html;
  mathify();
}

function chips(n) {
  var ds = domainStyle(n.domain);
  return "<span class='chip' style='background:" + ds.bg + "; color:#2e2a33; border-color:" + ds.border + "'>" + esc(n.domain) + "</span><span class='chip'>" + esc(FAMILY_LABEL[n.family] || n.family) + "</span>";
}

function nodeHtml(n) {
  var h = [];
  h.push("<h2>" + esc(n.label) + "</h2>");
  h.push(chips(n));
  h.push("<div class='card'>" + esc(n.description) + "</div>");
  h.push("<div class='prop'>\\(" + n.property + "\\)</div>");
  h.push("<div class='card'><b>Exemple type.</b> " + esc(n.example) + "</div>");
  if (n.notes) { h.push("<p class='note'>" + esc(n.notes) + "</p>"); }
  var outs = [], ins = [], antis = [];
  GRAPH.edges.forEach(function (e) {
    if (e.kind === "inclusion") {
      if (e.from === n.id) { outs.push(e); }
      else if (e.to === n.id) { ins.push(e); }
    } else if (e.kind === "anti") {
      if (e.from === n.id || e.to === n.id) { antis.push(e); }
    }
  });
  if (outs.length) {
    h.push("<h3>Sont contenus dedans (" + outs.length + ")</h3><ul>");
    outs.forEach(function (e) { h.push("<li>" + esc(labelOf(n.id)) + "<span class='op'>⊂</span>" + esc(labelOf(e.to)) + " — " + esc(e.theorem) + (e.strict ? " (strict)" : "") + "</li>"); });
    h.push("</ul>");
  }
  if (ins.length) {
    h.push("<h3>Le contiennent (" + ins.length + ")</h3><ul>");
    ins.forEach(function (e) { h.push("<li>" + esc(labelOf(e.from)) + "<span class='op'>⊂</span>" + esc(labelOf(n.id)) + " — " + esc(e.theorem) + "</li>"); });
    h.push("</ul>");
  }
  if (antis.length) {
    h.push("<h3>Non-inclusions voisines</h3><ul>");
    antis.forEach(function (e) {
      var first = e.from === n.id ? n.id : e.to;
      var second = e.from === n.id ? e.to : n.id;
      h.push("<li class='antiitem'>" + esc(labelOf(first)) + "<span class='op'>⊄</span>" + esc(labelOf(second)) + " — " + esc(e.theorem) + "</li>");
    });
    h.push("</ul>");
  }
  return h.join("");
}

function edgeHtml(e) {
  var a = null, b = null;
  GRAPH.nodes.forEach(function (n) { if (n.id === e.from) { a = n; } else if (n.id === e.to) { b = n; } });
  var lat = e.kind === "inclusion" ? "subseteq" : (e.kind === "equivalence" ? "equiv" : "nsubseteq");
  var opTxt = e.kind === "inclusion" ? "⊆" : (e.kind === "equivalence" ? "=" : "⊄");
  var tag = e.kind === "inclusion" ? "Théorème" : (e.kind === "anti" ? "Contre-exemple" : "Équivalence");
  var tagColor = e.kind === "inclusion" ? "#ff6b6b" : (e.kind === "anti" ? "#f5a34c" : "#5fc98e");
  var dom = (a && a.domain) || (b && b.domain) || "";
  var ds = domainStyle(dom);
  var h = [];
  h.push("<div class='thm'>");
  h.push("<div class='thm-kicker'><span class='thm-sym' style='background:" + ds.bg + "; border:1px solid " + ds.border + "'>" + opTxt + "</span><span class='thm-domain'>" + esc(dom) + "</span><span class='thm-tag' style='color:" + tagColor + "; border-color:" + tagColor + "'>" + esc(tag) + "</span><span class='chip'>" + esc(e.depth) + "</span></div>");
  h.push("<h2>" + esc(e.theorem || opTxt) + "</h2>");
  h.push("<div class='rel'>\\(" + ((a && a.property) || esc(labelOf(e.from))) + " \\" + lat + " " + ((b && b.property) || esc(labelOf(e.to))) + "\\)</div>");
  h.push("<div class='statement'>" + esc(e.statement) + "</div>");
  if (e.kind === "anti" && e.counterexample) {
    h.push("<div class='ce'><b>Contre-exemple.</b> " + esc(e.counterexample) + "</div>");
  }
  if (e.strict && e.strictnessExample) {
    h.push("<div class='ce'><b>Inclusion stricte.</b> " + esc(e.strictnessExample) + "</div>");
  }
  if (e.notes) { h.push("<p class='note'>" + esc(e.notes) + "</p>"); }
  h.push("<p class='note'>" + esc(labelOf(e.from)) + " → " + esc(labelOf(e.to)) + "</p>");
  h.push("</div>");
  return h.join("");
}

function defaultPanel() {
  var h = [];
  h.push("<h2>Graphe des théorèmes</h2>");
  h.push("<div class='card'>Chaque <b>cercle</b> est un <b>ensemble</b> de fonctions, nommé précisément. Chaque <b>arête blanche</b> est un <b>théorème</b> : A ⊆ B. Les pointillés sont des <b>contre-exemples</b> : A ⊄ B, prouvés par une fonction explicite.</div>");
  h.push("<div class='card'>La <b>taille d'un cercle</b> est proportionnelle au nombre d'arêtes qui y arrivent. Code couleur des domaines : analyse réelle = rose pastel, arithmétique = orange pastel, algèbre générale = jaune orangé, algèbre linéaire = vert pastel, théorie des ensembles = bleu clair, analyse complexe = marron pastel.</div>");
  h.push("<p class='note'>Cliquez sur un cercle ou une arête. Les formules sont composées via KaTeX. La case « contre-exemples » les masque ou les affiche.</p>");
  return h.join("");
}

function applyVisibility() {
  var fam = document.getElementById("family").value;
  var dep = document.getElementById("depth").value;
  var q = document.getElementById("search").value.trim().toLowerCase();
  cy.batch(function () {
    cy.nodes().forEach(function (n) {
      var nd = n.data();
      var okF = fam === "all" || nd.family === fam;
      var okQ = q === "" || ((nd.label + " " + nd.description + " " + (nd.notes || "") + " " + (nd.example || "")).toLowerCase().indexOf(q) >= 0);
      n.toggleClass("faded", !(okF && okQ));
    });
    cy.edges().forEach(function (e) {
      var ed = e.data();
      var okD = dep === "all" || ed.depth === dep;
      var epVisible = (!e.source().hasClass("faded")) && (!e.target().hasClass("faded"));
      e.toggleClass("faded", !(okD && epVisible));
    });
  });
}

function rebuild() {
  if (cy) { cy.destroy(); }
  cy = cytoscape({ container: document.getElementById("cy"), elements: buildElements(GRAPH), style: styleSheet(), layout: getLayout() });
  cy.on("tap", "node", function (ev) { showPanel(nodeHtml(ev.target.data())); });
  cy.on("tap", "edge", function (ev) { showPanel(edgeHtml(ev.target.data())); });
  cy.on("tap", function (ev) { if (ev.target === cy) { showPanel(defaultPanel()); } });
  applyAnti();
  applyVisibility();
}

function applyAnti() {
  var on = document.getElementById("anti").checked;
  cy.edges().forEach(function (e) {
    e.toggleClass("hiddenedge", !on && e.data("kind") === "anti");
  });
}

function initSelects() {
  var depthSel = document.getElementById("depth");
  depthSel.innerHTML = "";
  var o = document.createElement("option"); o.value = "all"; o.textContent = "Toutes profondeurs"; depthSel.appendChild(o);
  Object.keys(DEPTH_LABEL).forEach(function (d) {
    var x = document.createElement("option"); x.value = d; x.textContent = "Théorèmes " + DEPTH_LABEL[d]; depthSel.appendChild(x);
  });
  var famSel = document.getElementById("family");
  famSel.innerHTML = "";
  var o2 = document.createElement("option"); o2.value = "all"; o2.textContent = "Toutes familles"; famSel.appendChild(o2);
  Object.keys(FAMILY_LABEL).forEach(function (f) {
    var x = document.createElement("option"); x.value = f; x.textContent = FAMILY_LABEL[f]; famSel.appendChild(x);
  });
}

document.getElementById("relayout").addEventListener("click", function () { cy.layout(getLayout()).run(); });
document.getElementById("search").addEventListener("input", applyVisibility);
document.getElementById("depth").addEventListener("change", applyVisibility);
document.getElementById("family").addEventListener("change", applyVisibility);
document.getElementById("anti").addEventListener("change", applyAnti);
document.getElementById("file").addEventListener("change", function (ev) {
  var f = ev.target.files[0];
  if (!f) { return; }
  var r = new FileReader();
  r.onload = function () {
    try {
      var g = JSON.parse(r.result);
      if (!g.nodes || !g.edges) { throw new Error("JSON sans nodes/edges"); }
      GRAPH = g;
      rebuild();
      showPanel("<h2>Graphe chargé</h2><div class='card'>" + g.nodes.length + " ensembles, " + g.edges.length + " théorèmes.</div>");
    } catch (err) { alert("JSON invalide : " + err.message); }
  };
  r.readAsText(f);
});

initSelects();
showPanel(defaultPanel());
rebuild();

fetch("data/graphe.json").then(function (r) { return r.json(); }).then(function (g) {
  if (g && g.nodes && g.edges && (g.nodes.length !== GRAPH.nodes.length || g.edges.length !== GRAPH.edges.length)) {
    GRAPH = g;
    rebuild();
  }
}).catch(function () {});
</script>
