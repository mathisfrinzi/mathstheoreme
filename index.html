<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Graphe des théorèmes — analyse réelle</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #101418; color: #e8e8e8; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 10px 16px; background: #161c22; border-bottom: 1px solid #2a3340; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header .sub { font-size: 12px; color: #9fb0c3; margin-right: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  input[type=text], select { background: #0b0e12; color: #e8e8e8; border: 1px solid #2a3340; border-radius: 6px; padding: 6px 8px; font-size: 12px; }
  input[type=file] { font-size: 11px; color: #9fb0c3; max-width: 190px; }
  button { background: #1c2733; color: #e8e8e8; border: 1px solid #2a3340; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  button:hover { background: #263444; }
  main { flex: 1; display: flex; min-height: 0; }
  #cy { flex: 1; min-width: 0; }
  aside { width: 370px; max-width: 46%; overflow-y: auto; padding: 14px; background: #12171d; border-left: 1px solid #2a3340; font-size: 13px; line-height: 1.55; }
  aside h2 { font-size: 15px; margin: 0 0 8px; }
  aside h3 { font-size: 12px; margin: 14px 0 4px; color: #9fb0c3; text-transform: uppercase; letter-spacing: 0.5px; }
  aside .tag { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 11px; margin: 0 4px 6px 0; background: #1c2733; border: 1px solid #2a3340; }
  aside .prop { font-family: ui-monospace, "Cascadia Mono", monospace; background: #0b0e12; border: 1px solid #2a3340; border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 12px; overflow-wrap: break-word; }
  aside .ce { background: #2a1512; border: 1px solid #5c2b22; border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
  aside .ce b { color: #ff9c8a; }
  aside p { margin: 8px 0; }
  aside ul { margin: 4px 0; padding-left: 18px; }
  aside li { margin: 5px 0; }
  aside a { color: #9fd0ff; }
  footer { padding: 6px 16px; background: #161c22; border-top: 1px solid #2a3340; font-size: 11.5px; color: #9fb0c3; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .leg { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 26px; height: 0; display: inline-block; }
  .sw.inc { border-top: 3px solid #6f93b8; }
  .sw.eq { border-top: 3px solid #39c26d; }
  .sw.anti { border-top: 2px dashed #ff5c4d; }
</style>
</head>
<body>
<header>
  <h1>Graphe des théorèmes</h1>
  <span class="sub">nœud = ensemble de fonctions · arête = théorème</span>
  <div class="controls">
    <input type="text" id="search" placeholder="Rechercher (théorème, contre-exemple…)"/>
    <select id="depth"></select>
    <select id="family"></select>
    <button id="relayout">Réarranger</button>
    <input type="file" id="file" accept=".json,application/json" title="Charger un autre graphe JSON"/>
  </div>
</header>
<main>
  <div id="cy"></div>
  <aside id="panel"></aside>
</main>
<footer>
  <span class="leg"><span class="sw inc"></span> A ⊆ B : théorème</span>
  <span class="leg"><span class="sw eq"></span> A = B : équivalence</span>
  <span class="leg"><span class="sw anti"></span> A ⊄ B : contre-exemple</span>
  <span class="leg">épaisseur = profondeur</span>
  <span class="leg">clic sur un nœud ou une arête = détails</span>
</footer>
<script>
var GRAPH_EMBEDDED = {"meta":{"name":"Graphe des théorèmes","version":"0.1.0","created":"2026-11-23","language":"fr","domain":"analyse réelle — fonctions ℝ → ℝ","description":"Chaque nœud est un ensemble de fonctions, chaque arête est un théorème : inclusion (A ⊆ B), équivalence (A = B) ou non-inclusion avec contre-exemple (A ⊄ B).","semantics":{"node":"un ensemble A = { f : P(f) }","inclusion":"arête pleine A → B : le théorème affirme A ⊆ B","equivalence":"arête verte double : A = B","anti":"arête rouge pointillée : A ⊄ B, prouvé par un contre-exemple explicite","depth":["définitoire","immédiat","facile","classique","fondamental","profond"]}},"nodes":[{"id":"C","label":"Continues","family":"continuité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"C = { f : ℝ → ℝ | f est continue en tout point de ℝ }","description":"Les fonctions continues de ℝ dans ℝ.","example":"x ↦ x²","notes":"Point de départ du graphe, demandé par Mathis. Le théorème des valeurs intermédiaires et celui de Heine portent sur cet ensemble."},{"id":"F","label":"Toutes les fonctions","family":"univers","domain":"analyse réelle — fonctions ℝ → ℝ","property":"F = ℝ^ℝ = { f : ℝ → ℝ }","description":"L'ensemble de toutes les fonctions de ℝ dans ℝ : l'ensemble ambiant dans lequel vivent tous les nœuds de ce graphe.","example":"x ↦ 1 si x ∈ ℚ, sinon 0 (fonction de Dirichlet) : continue nulle part","notes":"Nœud univers, le plus grand de tous : tout le reste du graphe vit là-dedans."},{"id":"UC","label":"Uniformément continues","family":"continuité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"UC = { f : ∀ ε > 0, ∃ δ > 0, ∀ x, y : |x − y| < δ ⟹ |f(x) − f(y)| < ε }","description":"Fonctions uniformément continues sur ℝ tout entier : le δ peut être choisi indépendamment du point.","example":"x ↦ x","notes":"Différence cruciale avec C : sur ℝ (non compact), la continuité n'implique pas l'uniforme continuité."},{"id":"UCSEG","label":"Unif. cont. par segment","family":"continuité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"UCSEG = { f : f est uniformément continue sur chaque segment [a, b] }","description":"Fonctions uniformément continues sur chaque segment (mais pas nécessairement sur ℝ entier).","example":"x ↦ x²","notes":"Par Heine, cet ensemble est exactement l'ensemble C des continues."},{"id":"L","label":"Lipschitziennes","family":"dérivabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"L = { f : ∃ k ≥ 0, ∀ x, y : |f(x) − f(y)| ≤ k |x − y| }","description":"Fonctions k-lipschitziennes sur ℝ : un contrôle linéaire uniforme de l'oscillation.","example":"x ↦ |x| (constante 1)","notes":"Lipschitz ne veut pas dire dérivable : |x| est le contre-exemple standard."},{"id":"DBR","label":"Dérivée bornée","family":"dérivabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"DBR = { f : f dérivable sur ℝ et f' bornée }","description":"Fonctions dérivées partout avec une dérivée bornée sur ℝ.","example":"x ↦ sin(x)","notes":"Le TAF en fait un sous-ensemble des lipschitziennes."},{"id":"D","label":"Dérivables","family":"dérivabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"D = { f : ∀ a ∈ ℝ, f'(a) = lim(x→a) (f(x) − f(a)) / (x − a) existe }","description":"Fonctions dérivables en tout point de ℝ.","example":"x ↦ x³","notes":"Une dérivée peut exister partout et être discontinue : voir le nœud DER."},{"id":"DEC","label":"Dériv. sauf dénombrable","family":"dérivabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"DEC = { f : l'ensemble des points où f n'est pas dérivable est au plus dénombrable }","description":"Fonctions dérivables sauf sur un ensemble au plus dénombrable de points.","example":"x ↦ |x| (un seul point de non-dérivabilité)","notes":"Attention : « dénombrable » est plus fin que « négligeable » ; voir la fonction de Cantor."},{"id":"DER","label":"Dérivées","family":"dérivabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"DER = { g : ∃ f ∈ D, g = f' }","description":"Les fonctions qui sont la dérivée d'une fonction dérivable : l'image de D par l'opérateur de dérivation.","example":"x ↦ x (dérivée de x ↦ x²/2)","notes":"Exemple de construction d'un nouvel ensemble à partir d'un autre, ici D par l'opérateur f ↦ f'. Contient des fonctions discontinues."},{"id":"C1","label":"C¹","family":"dérivabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"C1 = { f : f' existe et f' ∈ C }","description":"Fonctions de classe C¹ : dérivables à dérivée continue.","example":"x ↦ sin(x)","notes":""},{"id":"P","label":"Polynômes","family":"dérivabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"P = ℝ[X] = { f : f(x) = aₙxⁿ + ⋯ + a₁x + a₀, un polynôme }","description":"Les fonctions polynomiales.","example":"x ↦ x²","notes":"Encore mieux : C^∞, et même analytiques."},{"id":"AFF","label":"Affines","family":"dérivabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"AFF = { x ↦ ax + b : a, b ∈ ℝ }","description":"Les fonctions affines : droites.","example":"x ↦ 2x + 3","notes":"Les plus simples : lipschitziennes avec pour constante la pente."},{"id":"M","label":"Monotones","family":"monotonie","domain":"analyse réelle — fonctions ℝ → ℝ","property":"M = { f : croissante sur ℝ ou décroissante sur ℝ }","description":"Fonctions monotones sur ℝ (au sens large).","example":"x ↦ x","notes":"Une fonction monotone peut être discontinue, mais seulement d'un dénombrable de fois."},{"id":"CNV","label":"Convexes","family":"continuité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"CNV = { f : ∀ x, y, ∀ t ∈ [0,1] : f(tx + (1−t)y) ≤ t f(x) + (1−t) f(y) }","description":"Fonctions convexes sur ℝ.","example":"x ↦ eˣ","notes":"En dimension finie, convexité rime avec continuité ; c'est faux en dimension infinie."},{"id":"B","label":"Bornées","family":"monotonie","domain":"analyse réelle — fonctions ℝ → ℝ","property":"B = { f : ∃ M, ∀ x : |f(x)| ≤ M }","description":"Fonctions bornées sur ℝ tout entier.","example":"x ↦ sin(x)","notes":""},{"id":"MB","label":"Monot. et bornées","family":"monotonie","domain":"analyse réelle — fonctions ℝ → ℝ","property":"MB = M ∩ B","description":"Fonctions monotones et bornées : un ensemble-construit, intersection de M et B.","example":"x ↦ arctan(x)","notes":"Nœud construit à partir de deux autres : c'est l'opération d'intersection sur le graphe."},{"id":"LIM","label":"Limites en ±∞","family":"monotonie","domain":"analyse réelle — fonctions ℝ → ℝ","property":"LIM = { f : lim(x→+∞) f(x) et lim(x→−∞) f(x) existent et sont finies }","description":"Fonctions admettant des limites finies aux deux infinis.","example":"x ↦ arctan(x)","notes":""},{"id":"IVP","label":"Valeurs interm.","family":"valeurs","domain":"analyse réelle — fonctions ℝ → ℝ","property":"IVP = { f : l'image par f de tout intervalle est un intervalle }","description":"Les fonctions de Darboux : celles qui prennent toutes les valeurs intermédiaires.","example":"x ↦ sin(1/x) (f(0) = 0)","notes":"Contient toutes les continues (TVI) et toutes les dérivées (Darboux), mais aussi des fonctions discontinues."},{"id":"CARDE","label":"Discontinuités dénombr.","family":"intégrabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"CARDE = { f : l'ensemble des points de discontinuité de f est au plus dénombrable }","description":"Fonctions discontinues seulement en un nombre au plus dénombrable de points.","example":"x ↦ 1_{x>0} (échelon d'Heaviside) : une seule discontinuité","notes":""},{"id":"PC","label":"Continues par morceaux","family":"intégrabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"PC = { f : sur chaque segment [a,b], f est continue par morceaux (un nombre fini de discontinuités de première espèce) }","description":"Fonctions continues par morceaux sur chaque segment.","example":"x ↦ 1_{x>0}","notes":""},{"id":"RSEG","label":"Riemann-intégrables","family":"intégrabilité","domain":"analyse réelle — fonctions ℝ → ℝ","property":"RSEG = { f : f est Riemann-intégrable sur chaque segment [a, b] }","description":"Fonctions Riemann-intégrables sur chaque segment.","example":"x ↦ 1_{x>0}","notes":"Critère de Riemann : bornée et discontinue seulement sur un ensemble négligeable."}],"edges":[{"from":"C","to":"IVP","kind":"inclusion","theorem":"Théorème des valeurs intermédiaires","statement":"Si f est continue sur [a, b], son image contient tout l'intervalle [f(a), f(b)] : pour toute valeur c comprise entre f(a) et f(b), il existe x ∈ [a, b] tel que f(x) = c. L'image de tout intervalle est donc un intervalle.","depth":"fondamental","strict":true,"strictnessExample":"x ↦ sin(1/x) (f(0)=0) possède la propriété des valeurs intermédiaires sans être continue en 0.","id":"e1"},{"from":"D","to":"C","kind":"inclusion","theorem":"Une fonction dérivable est continue","statement":"Si f est dérivable en a, l'existence de f'(a) = lim(x→a) (f(x) − f(a)) / (x − a) impose lim(x→a) f(x) = f(a).","depth":"classique","strict":true,"strictnessExample":"x ↦ |x| est continue sans être dérivable en 0.","id":"e2"},{"from":"C1","to":"D","kind":"inclusion","theorem":"Définition de C¹","statement":"Une fonction de classe C¹ est dérivable, avec une dérivée continue.","depth":"définitoire","id":"e3"},{"from":"C1","to":"C","kind":"inclusion","theorem":"Par le théorème précédent","statement":"Une fonction C¹ est dérivable donc continue (composée de deux lignes du graphe).","depth":"immédiat","id":"e4"},{"from":"P","to":"C1","kind":"inclusion","theorem":"Les polynômes sont lisses","statement":"Un polynôme est dérivable avec une dérivée polynomiale donc continue : il est C¹, et même C^∞.","depth":"définitoire","id":"e5"},{"from":"AFF","to":"P","kind":"inclusion","theorem":"Définition","statement":"Une fonction affine x ↦ ax + b est un polynôme de degré au plus 1.","depth":"définitoire","id":"e6"},{"from":"AFF","to":"L","kind":"inclusion","theorem":"Définition","statement":"|f(x) − f(y)| = |a| |x − y| : une fonction affine est lipschitzienne, de constante |a|.","depth":"définitoire","id":"e7"},{"from":"DBR","to":"D","kind":"inclusion","theorem":"Définition","statement":"Une fonction à dérivée bornée est en particulier dérivable.","depth":"définitoire","id":"e8"},{"from":"DBR","to":"L","kind":"inclusion","theorem":"Théorème des accroissements finis (TAF)","statement":"Si f est dérivable sur ℝ et |f'| ≤ k, alors pour tous x, y, le TAF donne un c entre x et y tel que |f(x) − f(y)| = |f'(c)| |x − y| ≤ k |x − y| : f est lipschitzienne.","depth":"fondamental","strict":true,"strictnessExample":"x ↦ |x| est lipschitzienne sans être dérivable en 0.","id":"e9"},{"from":"L","to":"UC","kind":"inclusion","theorem":"Module d'incrément","statement":"Pour ε > 0, prendre δ = ε / k : si |x − y| < δ, alors |f(x) − f(y)| ≤ k |x − y| < ε. Une fonction k-lipschitzienne est uniformément continue, avec un δ indépendant du point.","depth":"immédiat","id":"e10"},{"from":"UC","to":"C","kind":"inclusion","theorem":"Définition","statement":"L'uniforme continuité sur ℝ implique la continuité en tout point (le δ uniforme convient pour tout point).","depth":"immédiat","id":"e11"},{"from":"UC","to":"UCSEG","kind":"inclusion","theorem":"Évident","statement":"Une fonction uniformément continue sur ℝ est uniformément continue sur chaque segment.","depth":"immédiat","id":"e12"},{"from":"C","to":"UCSEG","kind":"equivalence","theorem":"Théorème de Heine","statement":"Une fonction continue sur ℝ est uniformément continue sur chaque segment [a, b] (Heine : continue sur un compact implique uniformément continue). Réciproquement, l'uniforme continuité sur chaque segment implique la continuité. Donc C = UCSEG exactement.","depth":"fondamental","notes":"L'égalité est fausse si on remplace « chaque segment » par « ℝ tout entier » : ℝ n'est pas compact.","id":"e13"},{"from":"C","to":"RSEG","kind":"inclusion","theorem":"Continues ⇒ intégrables","statement":"Une fonction continue est bornée et Riemann-intégrable sur chaque segment : l'uniforme continuité (Heine) sur le compact contrôle l'oscillation donc les sommes de Riemann.","depth":"classique","id":"e14"},{"from":"M","to":"RSEG","kind":"inclusion","theorem":"Monotone ⇒ intégrable (Riemann)","statement":"Une fonction monotone sur [a, b] (à valeurs bornées) y est Riemann-intégrable : le critère de Darboux est vérifié car l'oscillation sur une subdivision contrastée est contrôlée par la variation totale.","depth":"classique","id":"e15"},{"from":"PC","to":"RSEG","kind":"inclusion","theorem":"Par morceaux ⇒ intégrable","statement":"Une fonction continue par morceaux sur un segment est Riemann-intégrable : on découpe le segment au niveau des discontinuités et on intègre morceau par morceau.","depth":"classique","id":"e16"},{"from":"M","to":"CARDE","kind":"inclusion","theorem":"Discontinuités d'une fonction monotone","statement":"Une fonction monotone n'a que des discontinuités de première espèce, et il y en a au plus une infinité dénombrable : chaque saut contient dans son image un intervalle ouvert, et ces intervalles sont deux à deux disjoints, donc chacun contient un rationnel distinct.","depth":"classique","id":"e17"},{"from":"PC","to":"CARDE","kind":"inclusion","theorem":"Définition","statement":"Au plus un nombre fini de discontinuités par segment : au plus dénombrable en tout (réunion dénombrable d'ensembles finis).","depth":"immédiat","id":"e18"},{"from":"CNV","to":"C","kind":"inclusion","theorem":"Convexe ⇒ continue","statement":"Une fonction convexe sur un intervalle ouvert de ℝ est continue : sur tout sous-intervalle, elle est coincée entre deux fonctions affines (les cordes), ce qui borde son oscillation.","depth":"classique","notes":"Mieux : localement lipschitzienne. L'analogue est faux en dimension infinie.","id":"e19"},{"from":"CNV","to":"DEC","kind":"inclusion","theorem":"Dérivée d'une fonction convexe","statement":"Une fonction convexe admet des dérivées à gauche et à droite (croissantes), égales sauf en au plus un nombre dénombrable de points (les « angles » de la courbe).","depth":"classique","id":"e20"},{"from":"DER","to":"IVP","kind":"inclusion","theorem":"Théorème de Darboux","statement":"Une dérivée, même discontinue, satisfait la propriété des valeurs intermédiaires : si g = f' pour un certain f dérivable, alors g prend toute valeur comprise entre deux de ses valeurs.","depth":"profond","notes":"C'est pourquoi une dérivée ne peut jamais sauter : la discontinuité d'une dérivée est obligatoirement d'oscillation.","id":"e21"},{"from":"MB","to":"LIM","kind":"inclusion","theorem":"Théorème de la limite monotone","statement":"Une fonction croissante et majorée admet une limite finie en +∞ (les sections croissantes convergent vers leur borne supérieure) ; de même en −∞. Donc une fonction monotone bornée admet des limites finies aux deux infinis.","depth":"fondamental","strict":true,"strictnessExample":"x ↦ sin(x) / (1 + x²) tend vers 0 aux deux infinis sans être monotone.","id":"e22"},{"from":"MB","to":"M","kind":"inclusion","theorem":"Définition","statement":"MB = M ∩ B : une fonction monotone et bornée est monotone.","depth":"définitoire","id":"e23"},{"from":"MB","to":"B","kind":"inclusion","theorem":"Définition","statement":"MB = M ∩ B : une fonction monotone et bornée est bornée.","depth":"définitoire","id":"e24"},{"from":"LIM","to":"B","kind":"inclusion","theorem":"Limites ⇒ bornée","statement":"Si f admet une limite finie ℓ (resp. ℓ') en +∞ (resp. −∞), alors f est proche de ℓ en dehors d'un segment, et bornée sur ce segment (fonction continue non requise : un segment suffit pour borner l'oscillation), donc f est bornée sur ℝ.","depth":"facile","id":"e25"},{"from":"C","to":"M","kind":"anti","theorem":"Une continue non monotone","statement":"La continuité n'implique pas la monotonie.","depth":"facile","counterexample":"x ↦ sin(x) : continue et oscillante.","id":"e26"},{"from":"C","to":"L","kind":"anti","theorem":"Une continue non lipschitzienne","statement":"La continuité n'implique pas la condition de Lipschitz.","depth":"classique","counterexample":"x ↦ √|x| : continue sur ℝ, mais (f(h) − f(0)) / h = 1/√h → +∞ quand h → 0⁺ : aucune constante de Lipschitz ne fonctionne près de 0.","id":"e27"},{"from":"C","to":"UC","kind":"anti","theorem":"Une continue non uniformément continue","statement":"La continuité sur ℝ tout entier n'implique pas l'uniforme continuité (ℝ n'est pas compact).","depth":"classique","counterexample":"x ↦ x² : |x² − y²| = |x + y| |x − y|, qui devient grand même pour un petit écart |x − y| fixé quand x et y grandissent : aucun δ ne convient pour tous les points à la fois.","id":"e28"},{"from":"C","to":"B","kind":"anti","theorem":"Une continue non bornée","statement":"La continuité n'implique pas la bornitude sur ℝ entier.","depth":"facile","counterexample":"x ↦ x : continue et non bornée.","id":"e29"},{"from":"L","to":"D","kind":"anti","theorem":"Une lipschitzienne non dérivable","statement":"La condition de Lipschitz n'implique pas la dérivabilité.","depth":"facile","counterexample":"x ↦ |x| : 1-lipschitzienne, non dérivable en 0.","id":"e30"},{"from":"L","to":"B","kind":"anti","theorem":"Une lipschitzienne non bornée","statement":"Lipschitz n'implique pas bornée sur ℝ.","depth":"facile","counterexample":"x ↦ x : 1-lipschitzienne, non bornée.","id":"e31"},{"from":"D","to":"L","kind":"anti","theorem":"Une dérivable non lipschitzienne","statement":"La dérivabilité n'implique pas la condition de Lipschitz.","depth":"classique","counterexample":"f(x) = x² sin(1/x²), f(0) = 0 : dérivable partout, mais f'(x) = 2x sin(1/x²) − (2/x) cos(1/x²) est non bornée près de 0.","id":"e32"},{"from":"D","to":"DBR","kind":"anti","theorem":"Une dérivée qui explose","statement":"La dérivabilité n'implique pas une dérivée bornée.","depth":"classique","counterexample":"Même exemple : f(x) = x² sin(1/x²), f(0) = 0, de dérivée non bornée près de 0.","id":"e33"},{"from":"M","to":"C","kind":"anti","theorem":"Une monotone discontinue","statement":"La monotonie n'implique pas la continuité.","depth":"facile","counterexample":"L'échelon d'Heaviside x ↦ 1_{x>0} : croissante, discontinue en 0.","id":"e34"},{"from":"M","to":"DEC","kind":"anti","theorem":"Fonction de Cantor","statement":"Une fonction monotone (même continue !) peut ne pas être dérivable sur un ensemble non dénombrable de points.","depth":"profond","counterexample":"La fonction de Cantor–Lebesgue (« l'escalier du diable ») : croissante, continue sur [0,1] (prolongée constantes sur ℝ), non dérivable sur une partie non dénombrable de l'ensemble de Cantor.","notes":"Il reste vrai (Lebesgue, plus profond) qu'une fonction monotone est dérivable en dehors d'un ensemble négligeable : « négligeable (mesure nulle) » est plus faible que « au plus dénombrable ». L'ensemble de Cantor est la frontière exacte entre les deux.","id":"e35"},{"from":"DER","to":"C","kind":"anti","theorem":"Une dérivée discontinue","statement":"Une fonction qui est une dérivée n'est pas nécessairement continue (mais elle ne peut pas sauter : voir Darboux).","depth":"profond","counterexample":"g(x) = 2x sin(1/x) − cos(1/x), g(0) = 0 : c'est la dérivée de f(x) = x² sin(1/x) (f(0) = 0), discontinue en 0.","id":"e36"},{"from":"IVP","to":"C","kind":"anti","theorem":"Une Darboux non continue","statement":"La propriété des valeurs intermédiaires n'implique pas la continuité.","depth":"classique","counterexample":"x ↦ sin(1/x) avec f(0) = 0 : l'image de tout intervalle contenant 0 est [−1, 1] tout entier, mais l'image d'un intervalle est toujours un intervalle : la propriété des valeurs intermédiaires est satisfaite, f est pourtant discontinue en 0.","id":"e37"},{"from":"RSEG","to":"C","kind":"anti","theorem":"Une intégrable discontinue","statement":"L'intégrabilité au sens de Riemann sur chaque segment n'implique pas la continuité.","depth":"facile","counterexample":"L'échelon d'Heaviside est Riemann-intégrable sur chaque segment, discontinue en 0.","id":"e38"},{"from":"UC","to":"L","kind":"anti","theorem":"Une uniformément continue non lipschitzienne","statement":"L'uniforme continuité n'implique pas la condition de Lipschitz (elle tolère des dérivées qui explosent lentement).","depth":"classique","counterexample":"x ↦ √|x| : uniformément continue sur ℝ (croissance sous-linéaire, dérivée qui explose mais de moins en moins), sans constante de Lipschitz possible près de 0.","id":"e39"},{"from":"P","to":"AFF","kind":"anti","theorem":"Un polynôme non affine","statement":"Presque tous les polynômes ne sont pas affines : le degré est un échelon.","depth":"définitoire","counterexample":"x ↦ x².","id":"e40"},{"from":"B","to":"LIM","kind":"anti","theorem":"Une bornée sans limites","statement":"La bornitude n'implique pas l'existence de limites aux infinis.","depth":"facile","counterexample":"x ↦ sin(x) : bornée, sans limite en +∞.","id":"e41"}]};
var GRAPH = GRAPH_EMBEDDED;
var DEPTH_LABEL = { "définitoire": "définitoires", "immédiat": "immédiats", "facile": "faciles", "classique": "classiques", "fondamental": "fondamentaux", "profond": "profonds" };
var DEPTH_WIDTH = { "définitoire": 1, "immédiat": 1.3, "facile": 1.7, "classique": 2.2, "fondamental": 3, "profond": 3 };
var KIND_LABEL = { "inclusion": "inclusion", "equivalence": "équivalence", "anti": "non-inclusion" };
var FAMILY_LABEL = { "univers": "Toutes fonctions", "continuité": "Continuité", "dérivabilité": "Dérivabilité", "intégrabilité": "Intégrabilité", "monotonie": "Monotonie / bornes", "valeurs": "Valeurs intermédiaires" };
var FAMILY_COLOR = { "univers": "#7a8694", "continuité": "#59a14f", "dérivabilité": "#4c78a8", "intégrabilité": "#e8922b", "monotonie": "#b07aa1", "valeurs": "#4db6ac" };

var cy = null;
var idToLabel = {};

function labelOf(id) { return idToLabel[id] || id; }

function buildElements(g) {
  idToLabel = {};
  g.nodes.forEach(function (n) { idToLabel[n.id] = n.label; });
  var els = [];
  g.nodes.forEach(function (n) {
    els.push({ data: {
      id: n.id, label: n.label, family: n.family, domain: n.domain,
      property: n.property, description: n.description, example: n.example,
      notes: n.notes || "", isNode: true,
      color: FAMILY_COLOR[n.family] || "#888888",
      size: n.family === "univers" ? 46 : 34
    } });
  });
  g.edges.forEach(function (e) {
    var showLabel = (e.depth === "fondamental" || e.depth === "profond");
    els.push({ data: {
      id: e.id, source: e.from, target: e.to, kind: e.kind,
      theorem: e.theorem, statement: e.statement, depth: e.depth,
      counterexample: e.counterexample || "", strict: !!e.strict,
      strictnessExample: e.strictnessExample || "", notes: e.notes || "",
      width: e.kind === "anti" ? 1.7 : (DEPTH_WIDTH[e.depth] || 2),
      showLabel: showLabel ? "1" : "0"
    } });
  });
  return els;
}

function styleSheet() {
  return [
    { selector: "node", style: {
      "background-color": "data(color)", "width": "data(size)", "height": "data(size)",
      "label": "data(label)", "color": "#eef2f6", "font-size": 11,
      "text-valign": "center", "text-halign": "center", "text-wrap": "wrap", "text-max-width": 92,
      "border-width": 1.5, "border-color": "#0b0e12"
    } },
    { selector: "node:selected", style: { "border-width": 3, "border-color": "#ffffff" } },
    { selector: "edge", style: {
      "curve-style": "bezier", "control-point-step-size": 45,
      "width": "data(width)", "line-color": "#6f93b8",
      "target-arrow-shape": "triangle", "target-arrow-color": "#6f93b8", "arrow-scale": 0.9,
      "opacity": 0.85
    } },
    { selector: 'edge[kind="equivalence"]', style: { "line-color": "#39c26d", "source-arrow-shape": "triangle", "source-arrow-color": "#39c26d", "target-arrow-color": "#39c26d" } },
    { selector: 'edge[kind="anti"]', style: { "line-color": "#ff5c4d", "line-style": "dashed", "target-arrow-shape": "none", "opacity": 0.7, "width": 1.7 } },
    { selector: 'edge[showLabel="1"]', style: {
      "label": "data(theorem)", "font-size": 9, "color": "#b9c7d6",
      "text-background-color": "#0b0e12", "text-background-opacity": 0.8, "text-background-padding": 3,
      "text-rotation": "autorotate"
    } },
    { selector: "edge:selected", style: { "line-color": "#ffffff", "target-arrow-color": "#ffffff", "width": 4, "opacity": 1, "z-index": 99 } },
    { selector: ".faded", style: { "opacity": 0.07 } },
    { selector: "edge.faded", style: { "opacity": 0.03 } }
  ];
}

function getLayout() {
  return { name: "cose", animate: true, animationDuration: 500, idealEdgeLength: 80, nodeOverlap: 18, componentSpacing: 140, padding: 40, randomize: true };
}

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function nodeHtml(n) {
  var h = [];
  h.push('<h2>' + esc(n.label) + '</h2>');
  h.push('<span class="tag">' + esc(FAMILY_LABEL[n.family] || n.family) + '</span><span class="tag">' + esc(n.domain) + '</span>');
  h.push('<p>' + esc(n.description) + '</p>');
  h.push('<div class="prop">' + esc(n.property) + '</div>');
  h.push('<p><b>Exemple type :</b> ' + esc(n.example) + '</p>');
  if (n.notes) { h.push('<p>' + esc(n.notes) + '</p>'); }
  var outs = [], ins = [], antis = [];
  GRAPH.edges.forEach(function (e) {
    if (e.kind === "inclusion") {
      if (e.from === n.id) { outs.push(e); }
      if (e.to === n.id) { ins.push(e); }
    } else if (e.kind === "equivalence") {
      if (e.from === n.id || e.to === n.id) { ins.push(e); }
    } else {
      if (e.from === n.id || e.to === n.id) { antis.push(e); }
    }
  });
  if (outs.length) {
    h.push('<h3>Ce que cet ensemble contient</h3><ul>');
    outs.forEach(function (e) { h.push('<li><b>' + esc(labelOf(n.id)) + ' ⊆ ' + esc(labelOf(e.to)) + '</b> — ' + esc((e.theorem || "") + (e.strict ? " (strict)" : "")) + '</li>'); });
    h.push('</ul>');
  }
  if (ins.length) {
    h.push('<h3>Ce qui est inclus dedans</h3><ul>');
    ins.forEach(function (e) {
      var other = e.from === n.id ? e.to : e.from;
      var sym = e.kind === "equivalence" ? " = " : " ⊆ ";
      h.push('<li><b>' + esc(labelOf(other)) + ' ' + sym + ' ' + esc(labelOf(n.id)) + '</b> — ' + esc(e.theorem || "") + '</li>');
    });
    h.push('</ul>');
  }
  if (antis.length) {
    h.push('<h3>Non-inclusions voisines (contre-exemples)</h3><ul>');
    antis.forEach(function (e) {
      var other = e.from === n.id ? e.to : e.from;
      var rel = e.from === n.id ? (esc(labelOf(n.id)) + " ⊄ " + esc(labelOf(other))) : (esc(labelOf(other)) + " ⊄ " + esc(labelOf(n.id)));
      h.push('<li><b>' + rel + '</b> — ' + esc(e.theorem || "") + '</li>');
    });
    h.push('</ul>');
  }
  return h.join('');
}

function edgeHtml(e) {
  var h = [];
  var relation;
  if (e.kind === "inclusion") { relation = esc(labelOf(e.from)) + " ⊆ " + esc(labelOf(e.to)); }
  else if (e.kind === "equivalence") { relation = esc(labelOf(e.from)) + " = " + esc(labelOf(e.to)); }
  else { relation = esc(labelOf(e.from)) + " ⊄ " + esc(labelOf(e.to)); }
  h.push('<h2>' + esc(e.theorem || relation) + '</h2>');
  h.push('<span class="tag">' + esc(KIND_LABEL[e.kind] || e.kind) + '</span><span class="tag">profondeur : ' + esc(e.depth) + '</span>');
  h.push('<p><b>' + relation + '</b></p>');
  h.push('<p>' + esc(e.statement) + '</p>');
  if (e.kind === "anti" && e.counterexample) {
    h.push('<div class="ce"><b>Contre-exemple.</b> ' + esc(e.counterexample) + '</div>');
  }
  if (e.kind === "inclusion" && e.strict && e.strictnessExample) {
    h.push('<div class="ce"><b>Inclusion stricte.</b> ' + esc(e.strictnessExample) + '</div>');
  }
  if (e.notes) { h.push('<p><i>' + esc(e.notes) + '</i></p>'); }
  return h.join('');
}

function defaultPanel() {
  var h = [];
  h.push('<h2>Graphe des théorèmes</h2>');
  h.push("<p>Chaque <b>nœud</b> est un <b>ensemble</b> de fonctions (le premier est l'ensemble C des fonctions réelles continues), chaque <b>arête</b> est un <b>théorème</b> :</p>");
  h.push('<ul>');
  h.push("<li>flèche pleine : A ⊆ B, assuré par le théorème porté par l'arête ;</li>");
  h.push('<li>flèche verte double : A = B (équivalence) ;</li>');
  h.push('<li>pointillé rouge : A ⊄ B, prouvé par un contre-exemple explicite.</li>');
  h.push('</ul>');
  h.push("<p>L'épaisseur code la profondeur du théorème : de purement <i>définitoire</i> à <i>profond</i> (Heine, TAF, Darboux…).</p>");
  h.push("<p>Cliquez sur un nœud ou une arête pour voir l'énoncé complet, l'exemple type ou le contre-exemple.</p>");
  h.push('<p><i>Source de vérité : data/graphe.json. Cliquez sur « Réarranger » si le graphe se chevauche trop.</i></p>');
  return h.join('');
}

function showPanel(html) { document.getElementById("panel").innerHTML = html; }

function applyVisibility() {
  var fam = document.getElementById("family").value;
  var dep = document.getElementById("depth").value;
  var q = document.getElementById("search").value.trim().toLowerCase();
  cy.batch(function () {
    cy.nodes().forEach(function (n) {
      var nd = n.data();
      var okF = fam === "all" || nd.family === fam;
      var okQ = q === "" || ((nd.label + " " + nd.description + " " + (nd.notes || "") + " " + nd.property + " " + (nd.example || "")).toLowerCase().indexOf(q) >= 0);
      n.toggleClass("faded", !(okF && okQ));
    });
    cy.edges().forEach(function (e) {
      var ed = e.data();
      var okD = dep === "all" || ed.depth === dep;
      var epVisible = (!e.source().hasClass("faded")) && (!e.target().hasClass("faded"));
      e.toggleClass("faded", !(okD && epVisible));
    });
  });
}

function rebuild() {
  if (cy) { cy.destroy(); }
  cy = cytoscape({ container: document.getElementById("cy"), elements: buildElements(GRAPH), style: styleSheet(), layout: getLayout() });
  cy.on("tap", "node", function (ev) {
    showPanel(nodeHtml(ev.target.data()));
  });
  cy.on("tap", "edge", function (ev) {
    showPanel(edgeHtml(ev.target.data()));
  });
  cy.on("tap", function (ev) {
    if (ev.target === cy) { showPanel(defaultPanel()); }
  });
  applyVisibility();
}

function initSelects() {
  var depthSel = document.getElementById("depth");
  depthSel.innerHTML = "";
  var optAll = document.createElement("option"); optAll.value = "all"; optAll.textContent = "Toutes profondeurs"; depthSel.appendChild(optAll);
  Object.keys(DEPTH_LABEL).forEach(function (d) {
    var o = document.createElement("option"); o.value = d; o.textContent = "Théorèmes " + DEPTH_LABEL[d]; depthSel.appendChild(o);
  });
  var famSel = document.getElementById("family");
  famSel.innerHTML = "";
  var fo = document.createElement("option"); fo.value = "all"; fo.textContent = "Toutes familles"; famSel.appendChild(fo);
  Object.keys(FAMILY_LABEL).forEach(function (f) {
    var o = document.createElement("option"); o.value = f; o.textContent = FAMILY_LABEL[f]; famSel.appendChild(o);
  });
}

document.getElementById("relayout").addEventListener("click", function () { cy.layout(getLayout()).run(); });
document.getElementById("search").addEventListener("input", applyVisibility);
document.getElementById("depth").addEventListener("change", applyVisibility);
document.getElementById("family").addEventListener("change", applyVisibility);
document.getElementById("file").addEventListener("change", function (ev) {
  var f = ev.target.files[0];
  if (!f) { return; }
  var r = new FileReader();
  r.onload = function () {
    try {
      var g = JSON.parse(r.result);
      if (!g.nodes || !g.edges) { throw new Error("JSON sans nodes/edges"); }
      GRAPH = g;
      rebuild();
      showPanel('<h2>Graphe chargé</h2><p>' + g.nodes.length + ' nœuds, ' + g.edges.length + ' arêtes.</p>');
    } catch (err) { alert("JSON invalide : " + err.message); }
  };
  r.readAsText(f);
});

initSelects();
showPanel(defaultPanel());
rebuild();

// Si le JSON du dépôt est accessible (GitHub Pages), il prime sur la copie intégrée.
fetch("data/graphe.json").then(function (r) { return r.json(); }).then(function (g) {
  if (g && g.nodes && g.edges && (g.nodes.length !== GRAPH.nodes.length || g.edges.length !== GRAPH.edges.length)) {
    GRAPH = g; rebuild();
  }
}).catch(function () {});
</script>
</body>
</html>
